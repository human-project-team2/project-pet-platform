spring.application.name=rarepet
spring.datasource.hikari.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.jdbc-url=jdbc:mysql://192.168.0.60:3306/petstore?serverTimezone=Asia/Seoul
#192.168.0.66:3306/petstore root humanfullstack 
spring.datasource.hikari.username=root
spring.datasource.hikari.password=humanfullstack
spring.datasource.hikari.connection-test-query=SELECT 1

mybatis.configuration.map-underscore-to-camel-case=true
mybatis.type-aliases-package=com.human.rarepet.dto

spring.main.allow-bean-definition-overriding=true

server.servlet.session.tracking-modes=cookie

#to keep connection alive, may need to delete this in the future??
#spring.mvc.async.request-timeout=-1
#onCompletion can fail....
# Sets the default timeout for all async requests (30 minutes)
spring.mvc.async.request-timeout=1800000
# If using Jackson for JSON, ensure it doesn't fail on empty beans 
# (useful if you send empty heartbeat objects)
spring.jackson.serialization.fail-on-empty-beans=false