<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AnyZoo | 마이페이지</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
	rel="stylesheet">
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link
	href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Jua&display=swap"
	rel="stylesheet">
<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
<link rel="stylesheet" th:href="@{/css/floating-chat.css}">
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<style>
body {
	font-family: 'Noto Sans KR', sans-serif;
	background: #fdf6ee;
	padding-top: 100px;
	transition: background-color 0.3s;
}

.profile-card {
	background: white;
	border-radius: 30px;
	padding: 40px;
	box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
}

.profile-img {
	width: 120px;
	height: 120px;
	border-radius: 50%;
	border: 5px solid #ffc107;
	object-fit: cover;
}

.user-name {
	font-family: 'Jua', sans-serif;
	font-size: 1.8rem;
	color: #5a3c32;
}

.stat-box {
	background: #fffaf5;
	border-radius: 20px;
	padding: 15px;
	border: 1px solid #eee;
	text-align: center;
}

.nav-pills .nav-link {
	color: #8d7b6d;
	border-radius: 15px;
	padding: 12px 25px;
}

.nav-pills .nav-link.active {
	background-color: #5a3c32;
	color: white;
}

.content-card {
	background: white;
	border-radius: 25px;
	padding: 20px;
	box-shadow: 0 5px 15px rgba(0, 0, 0, 0.03);
	margin-bottom: 15px;
}

.item-img {
	width: 80px;
	height: 80px;
	border-radius: 15px;
	object-fit: cover;
}

/* 🌙 다크모드 전용 스타일 추가 */
[data-bs-theme="dark"] body {
	background-color: #1a1d20 !important;
	color: #f8f9fa;
}

[data-bs-theme="dark"] .profile-card, [data-bs-theme="dark"] .content-card,
	[data-bs-theme="dark"] .tab-pane>div {
	background-color: #2b3035 !important;
	color: #f8f9fa !important;
	box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2) !important;
}

[data-bs-theme="dark"] .user-name {
	color: #ffc107 !important;
}

[data-bs-theme="dark"] .stat-box {
	background-color: #343a40 !important;
	border-color: #495057 !important;
}

[data-bs-theme="dark"] .bg-light {
	background-color: #343a40 !important;
	color: #adb5bd !important;
}

[data-bs-theme="dark"] .nav-pills .nav-link {
	color: #adb5bd;
}

[data-bs-theme="dark"] .nav-pills .nav-link.active {
	background-color: #ffc107;
	color: #1a1d20;
}

[data-bs-theme="dark"] .text-muted {
	color: #adb5bd !important;
}

[data-bs-theme="dark"] .btn-outline-dark {
	color: #f8f9fa;
	border-color: #f8f9fa;
}

[data-bs-theme="dark"] .btn-outline-dark:hover {
	background-color: #f8f9fa;
	color: #1a1d20;
}
</style>

</head>
<body>
	<div th:replace="fragments/fragment :: header"></div>

	<script th:inline="javascript" th:if="${shopRegisterMessage}">
		alert(/*[[${shopRegisterMessage}]]*/"")
	</script>

	<div class="container mb-5">
		<div class="row g-4">
			<div class="col-lg-4">
				<div class="profile-card">
					<div class="text-center mb-4">

						<img th:src="@{${userImgUrl}}" alt="Profile Image"
							class="profile-img shadow-sm">
						<h3 class="user-name mt-3" th:text="${user.name}">집사님</h3>
						<p class="text-muted small" th:text="${user.email}">user@email.com</p>
					</div>
					<div class="row g-2 mb-4">
						<div class="col-6">
							<div class="stat-box">
								<div class="small text-muted">등록 상품</div>
								<div class="fw-bold fs-4" th:text="${productCount}">0</div>
							</div>
						</div>
						<div class="col-6">
							<div class="stat-box">
								<div class="small text-muted">활동상태</div>
								<div class="fw-bold text-success">정상</div>
							</div>
						</div>
					</div>
					<div class="p-3 bg-light rounded-4 mb-4">
						<p class="mb-2 small">
							<strong>연락처:</strong> <span th:text="${user.phone}">010-0000</span>
						</p>
						<p class="mb-0 small">
							<strong>배송지:</strong> <span th:text="${user.address}">주소
								없음</span>
						</p>
					</div>
					<div class="d-grid gap-2">
						<th:block sec:authorize=hasRole("member")>
							<a th:if="${shop == null}" th:href="@{/shop-register}"
								class="btn btn-warning rounded-pill"> 판매자 등록 </a>
							<a th:if="${shop != null and shop.verified == false}"
								th:href="@{/shop/shopmain}"
								class="btn btn-secondary rounded-pill" tabindex="-1"
								aria-disabled="true"> 판매자 승인 대기중 </a>
							<a th:if="${shop != null and shop.verified == true}"
								th:href="@{/shop/shopmain}"
								class="btn btn-secondary rounded-pill" tabindex="-1"
								aria-disabled="true"> 판매자 정보 수정 </a>
							<a th:href="@{/editProfile}"
								class="btn btn-outline-dark rounded-pill">정보 수정</a>
						</th:block>
					</div>
				</div>
			</div>

			<div class="col-lg-8">
				<ul class="nav nav-pills mb-4 gap-2">
					<li class="nav-item"><button class="nav-link active"
							data-bs-toggle="pill" data-bs-target="#tab-sell">내 판매 상품</button></li>
					<li class="nav-item"><button class="nav-link"
							data-bs-toggle="pill" data-bs-target="#tab-order">구매 기록</button></li>
					<li class="nav-item"><button class="nav-link"
							data-bs-toggle="pill" data-bs-target="#tab-post">내가 쓴 글</button></li>
					<li class="nav-item"><button class="nav-link"
							data-bs-toggle="pill" data-bs-target="#tab-wish">관심 목록</button></li>
				</ul>

				<div class="tab-content">
					<div class="tab-pane fade show active" id="tab-sell">
						<div th:if="${not #lists.isEmpty(myProducts)}">
							<div th:each="item : ${myProducts}"
								class="content-card d-flex align-items-center justify-content-between">
								<div class="d-flex align-items-center gap-3">
									<img th:src="${item.productImages[0].imgUrl}"
										class="item-img shadow-sm">
									<div>
										<h6 class="fw-bold mb-1" th:text="${item.productName}">상품명</h6>
										<p class="text-danger fw-bold mb-0"
											th:text="${#numbers.formatInteger(item.price, 0, 'COMMA') + '원'}"></p>
									</div>
								</div>
								<span th:if="${item.productCount == 0}" class="badge bg-danger text-dark rounded-pill px-3">품절</span>
								<span th:unless="${item.productCount == 0}" class="badge bg-warning text-dark rounded-pill px-3">판매중</span>
							</div>
						</div>
						<div th:if="${#lists.isEmpty(myProducts)}"
							class="text-center py-5 bg-white rounded-5 shadow-sm">
							<p class="text-muted">등록한 상품이 없습니다. 🐾</p>
							<a href="/market/register"
								class="btn btn-warning rounded-pill px-4">상품 등록하기</a>
						</div>
					</div>
					<div class="tab-pane fade" id="tab-order">
<!-- ------------------------------------------------------------------------------ -->
							<div th:if="${not #lists.isEmpty(myOrders)}">
								
								<!-- 주문 단위 반복 -->
								<div th:each="order : ${myOrders}" class="content-card mb-3">

									<!-- 주문 정보 -->
									<div class="d-flex justify-content-between mb-3">
										<div>
											<h6 class="fw-bold mb-1">
												주문번호: <span th:text="${order.orderNo}"></span>
											</h6>
											<p class="text-muted small mb-0"
												th:text="${#dates.format(order.orderDate, 'yyyy-MM-dd')}">
											</p>
										</div>
										<div class="text-end">
											<p class="fw-bold mb-0"
												th:text="${#numbers.formatInteger(order.totalPrice, 0, 'COMMA') + '원'}"></p>
											<span class="badge bg-success rounded-pill px-3">구매확정</span>
										</div>
									</div>

									<!-- 주문 상품 리스트 -->
									<div th:each="item : ${order.orderItems}"
										class="d-flex align-items-center gap-3 border-top pt-3 mt-3">

										<!-- 이미지 (product 정보 따로 필요함) -->
										<img src="/img/no_image.jpg" class="item-img shadow-sm">
				
										<div class="flex-grow-1">
											<h6 class="fw-bold mb-1">
												상품번호: <span th:text="${item.productNo}"></span>
											</h6>

											<p class="mb-0 small text-muted">
												수량: <span th:text="${item.productOrderCount}"></span>
											</p>
										</div>

										<div class="text-end">
											<p class="fw-bold mb-0"
												th:text="${#numbers.formatInteger(item.price * item.productOrderCount, 0, 'COMMA') + '원'}"></p>
										</div>
									</div>

								</div>
							</div>

							<!-- 주문 없을 때 -->
							<div th:if="${#lists.isEmpty(myOrders)}"
								class="text-center py-5 bg-white rounded-5 shadow-sm">
								<p class="text-muted">구매한 내역이 없습니다. 💸</p>
							</div>
<!-- ------------------------------------------------------------------------------ -->
						
					</div>

					<div class="tab-pane fade" id="tab-post">
						<th:block th:if="${(myPosts != null) || (qmyPosts != null) || (amyPosts != null)}">
						<table class="table table-hover">
					      <thead>
					      <tr>
					        <th scope="col">글번호</th>
					        <th scope="col">제목</th>
					        <th scope="col">작성일</th>
					        <th scope="col">조회수</th>
					        <th scope="col">좋아요</th>
					      </tr>
					      </thead>
					      <tbody>
					        <tr th:each="board, boardStat : ${myPosts}" style="height:30px">
					          <th scope="row" th:text="${ board.boardId }"></th>
					          <td>
					            <a 	th:href="@{/board/detail(boardId=${board.boardId}) }"
					                th:text="${ board.boardTitle }"></a>
					          </td>
					          <td th:text="${#dates.format(board.boardWriteDate, 'yyyy-MM-dd')}"></td>
					          <td th:text="${ board.boardViewCount }"></td>
							  <td>
							    <span class="text-danger">
							        <i class="bi bi-heart-fill"></i>
							    </span>
							    <span th:text="${ board.boardLikeCount }">0</span>
							  </td>
					        </tr>
					      </tbody>
					      <tbody>
					        <tr th:each="board, boardStat : ${qmyPosts}" style="height:30px">
					          <th scope="row" th:text="${ board.boardId }"></th>
					          <td>
					            <a 	th:href="@{/board/qna(boardId=${board.boardId}) }"
					                th:text="${ board.boardTitle }"></a>
					          </td>
					          <td th:text="${#dates.format(board.boardWriteDate, 'yyyy-MM-dd')}"></td>
					          <td th:text="${ board.boardViewCount }"></td>
							  <td>
							    <span class="text-danger">
							        <i class="bi bi-heart-fill"></i>
							    </span>
							    <span th:text="${ board.boardLikeCount }">0</span>
							  </td>
					        </tr>
					      </tbody>
					      <tbody>
					        <tr th:each="board, boardStat : ${amyPosts}" style="height:30px">
					          <th scope="row" th:text="${ board.boardId }"></th>
					          <td>
					            <a 	th:href="@{/board/adoption(boardId=${board.boardId}) }"
					                th:text="${ board.boardTitle }"></a>
					          </td>
					          <td th:text="${#dates.format(board.boardWriteDate, 'yyyy-MM-dd')}"></td>
					          <td th:text="${ board.boardViewCount }"></td>
							  <td>
							    <span class="text-danger">
							        <i class="bi bi-heart-fill"></i>
							    </span>
							    <span th:text="${ board.boardLikeCount }">0</span>
							  </td>
					        </tr>
					      </tbody>
					    </table>
					    </th:block>
					    
						<div th:if="${#lists.isEmpty(myPosts) && #lists.isEmpty(qmyPosts) && #lists.isEmpty(amyPosts)}"
							class="text-center py-5 bg-white rounded-5 shadow-sm">
							<p class="text-muted">작성한 글이 없습니다. 📝</p>
						</div>
					</div>

					<div class="tab-pane fade" id="tab-wish">
						<div class="text-center py-5 bg-white rounded-5 shadow-sm">
							<p class="text-muted">찜한 상품이 없습니다. ❤️</p>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
	<div th:replace="fragments/fragment :: footer"></div>
	<div th:replace="fragments/fragment :: message"></div>

	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
	<script th:replace="fragments/fragment :: message_script"></script>
	<script>
	$( () => {
		// 현재 url 에서 #뒤의 값을 가져옴.
		const hash = window.location.hash;
		// 특정 탭 지정
		const targetTab = ["#tab-order"];
		// hash 가 존재하고, targetTab이 hash를 포함하면
		if(hash && targetTab.includes(hash)){
			const btn = $(`.nav-link[data-bs-target="${hash}"]`)
			if(btn){
				const tab = new bootstrap.Tab(btn);
				tab.show();
			}
		}
	})
	</script>
</body>
</html>
