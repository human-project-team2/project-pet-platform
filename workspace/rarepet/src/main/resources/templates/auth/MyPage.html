<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AnyZoo | 마이페이지</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Jua&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
<style>
    body { font-family: 'Noto Sans KR', sans-serif; background: #fdf6ee; padding-top: 100px; }
    .profile-card { background: white; border-radius: 30px; padding: 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
    .profile-img { width: 120px; height: 120px; border-radius: 50%; border: 5px solid #ffc107; object-fit: cover; }
    .user-name { font-family: 'Jua', sans-serif; font-size: 1.8rem; color: #5a3c32; }
    .stat-box { background: #fffaf5; border-radius: 20px; padding: 15px; border: 1px solid #eee; text-align: center; }
    .nav-pills .nav-link { color: #8d7b6d; border-radius: 15px; padding: 12px 25px; }
    .nav-pills .nav-link.active { background-color: #5a3c32; color: white; }
    .content-card { background: white; border-radius: 25px; padding: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.03); margin-bottom: 15px; }
    .item-img { width: 80px; height: 80px; border-radius: 15px; object-fit: cover; }
</style>
</head>
<body>
    <div th:replace="fragments/fragment :: header"></div>

    <div class="container mb-5">
        <div class="row g-4">
            <div class="col-lg-4">
                <div class="profile-card">
                    <div class="text-center mb-4">
                        <img src="https://cdn-icons-png.flaticon.com/512/1998/1998627.png" class="profile-img shadow-sm">
                        <h3 class="user-name mt-3" th:text="${user.name}">집사님</h3>
                        <p class="text-muted small" th:text="${user.email}">user@email.com</p>
                    </div>
                    <div class="row g-2 mb-4">
                        <div class="col-6">
                            <div class="stat-box">
                                <div class="small text-muted">등록 상품</div>
                                <div class="fw-bold fs-4" th:text="${productCount}">0</div>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="stat-box">
                                <div class="small text-muted">활동상태</div>
                                <div class="fw-bold text-success">정상</div>
                            </div>
                        </div>
                    </div>
                    <div class="p-3 bg-light rounded-4 mb-4">
                        <p class="mb-2 small"><strong>연락처:</strong> <span th:text="${user.phone}">010-0000</span></p>
                        <p class="mb-0 small"><strong>배송지:</strong> <span th:text="${user.address}">주소 없음</span></p>
                    </div>
                    <div class="d-grid gap-2">
                        <button class="btn btn-outline-dark rounded-pill">정보 수정</button>
                    </div>
                </div>
            </div>

            <div class="col-lg-8">
                <ul class="nav nav-pills mb-4 gap-2">
                    <li class="nav-item"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#tab-sell">내 판매 상품</button></li>
                    <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab-wish">관심 목록</button></li>
                </ul>
                <div class="tab-content">
                    <div class="tab-pane fade show active" id="tab-sell">
                        <div th:if="${not #lists.isEmpty(myProducts)}">
                            <div th:each="item : ${myProducts}" class="content-card d-flex align-items-center justify-content-between">
                                <div class="d-flex align-items-center gap-3">
                                    <img th:src="${item.imgUrl}" class="item-img shadow-sm">
                                    <div>
                                        <h6 class="fw-bold mb-1" th:text="${item.productName}">상품명</h6>
                                        <p class="text-danger fw-bold mb-0" th:text="${#numbers.formatInteger(item.price, 0, 'COMMA') + '원'}"></p>
                                    </div>
                                </div>
                                <span class="badge bg-warning text-dark rounded-pill px-3">판매중</span>
                            </div>
                        </div>
                        <div th:if="${#lists.isEmpty(myProducts)}" class="text-center py-5 bg-white rounded-5 shadow-sm">
                            <p class="text-muted">등록한 상품이 없습니다. 🐾</p>
                            <a href="/productRegister" class="btn btn-warning rounded-pill px-4">상품 등록하기</a>
                        </div>
                    </div>
                    <div class="tab-pane fade" id="tab-wish">
                        <div class="text-center py-5 bg-white rounded-5 shadow-sm">
                            <p class="text-muted">찜한 상품이 없습니다.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div th:replace="fragments/fragment :: footer"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
