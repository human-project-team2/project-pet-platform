<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<!-- Bootstrap CSS & Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">   
    <script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
    <style>
        /* 로더 애니메이션 스타일 */
        #loader {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #fff; z-index: 9999;
            display: flex; align-items: center; justify-content: center;
            transition: opacity 0.3s ease;
        }
        .fadeOut { opacity: 0; pointer-events: none; }
        .spinner {
            width: 40px; height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #e76f51;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>

<body class="app" style="background-color: #f8f9fa;">
    <div id="loader">
        <div class="spinner"></div>
    </div>

    <div id="pageContainer" style="margin-top: 80px; margin-bottom: 60px;">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-5">
                    <div class="card shadow-sm p-4" style="border-radius: 25px; border: none;">
                        <div class="card-body">
                            <h3 class="text-center fw-bold mb-4" style="color: #5a3c32;">회원가입</h3>

                            <form id="registerform" action="register" method="post">
                                <div class="mb-3">
                                    <label class="form-label fw-bold" style="color: #777;">아이디(ID)</label>
                                    <div class="input-group">
                                        <input type="text" id="id" name="id" class="form-control"
                                            placeholder="8~20자 영문, 숫자"
                                            style="border-radius: 12px 0 0 12px; font-size: 15px;">
                                        <button class="btn btn-outline-secondary" type="button" id="btn-dup-check"
                                            style="border-radius: 0 12px 12px 0; font-size: 14px; border-color: #dee2e6;">
                                            중복검사
                                        </button>
                                    </div>
                                    <small id="id-status" style="font-size: 12px; margin-left: 5px;"></small>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label fw-bold" style="color: #777;">비밀번호</label>
                                    <input type="password" id="passwd" name="passwd" class="form-control" 
                                        placeholder="비밀번호를 입력하세요" style="border-radius: 12px; font-size: 15px;">
                                </div>

                                <div class="mb-3">
                                    <label class="form-label fw-bold" style="color: #777;">비밀번호 확인</label> 
                                    <input type="password" id="confirm" name="confirm" class="form-control" 
                                        placeholder="비밀번호를 한번 더 입력하세요" style="border-radius: 12px; font-size: 15px;">
                                </div>

                                <div class="mb-3">
                                    <label class="form-label fw-bold" style="color: #777;">이메일</label>
                                    <input type="email" id="email" name="email" class="form-control" 
                                        placeholder="이메일을 입력하세요" style="border-radius: 12px; font-size: 15px;">
                                </div>

                                <div class="mb-3">
                                    <label class="form-label fw-bold" style="color: #777;">이름</label>
                                    <input type="text" id="name" name="name" class="form-control"
                                        placeholder="이름을 입력하세요" style="border-radius: 12px; font-size: 15px;">
                                </div>

                                <div class="mb-3">
                                    <label class="form-label fw-bold" style="color: #777;">주소</label>
                                    <div class="input-group mb-2">
                                        <input type="text" id="postcode" class="form-control" placeholder="우편번호" readonly style="border-radius: 12px 0 0 12px; font-size: 15px;">
                                        <button class="btn btn-outline-secondary" type="button" onclick="execDaumPostcode()" style="border-radius: 0 12px 12px 0; font-size: 14px;">주소 찾기</button>
                                    </div>
                                    <input type="text" id="main_address" class="form-control mb-2" placeholder="기본 주소" readonly style="border-radius: 12px; font-size: 15px;">
                                    <input type="text" id="detail_address" class="form-control" placeholder="상세 주소를 입력하세요" style="border-radius: 12px; font-size: 15px;">
                                    
                                    <input type="hidden" id="address" name="address">
                                </div>

                                <div class="mb-3">
                                    <label class="form-label fw-bold" style="color: #777;">연락처</label>
                                    <input type="tel" id="phone" name="phone" class="form-control"
                                        placeholder="연락처를 입력하세요" style="border-radius: 12px; font-size: 15px;">
                                </div>

                                <div class="d-grid gap-2">
                                    <button type="button" id="register" class="btn btn-lg fw-bold shadow-sm"
                                        style="background-color: #e76f51; color: white; border-radius: 12px;">
                                        회원가입하기
                                    </button>
                                    <button type="button" id="cancel" class="btn btn-link text-decoration-none"
                                        style="color: #999; font-size: 14px;">취소하고 돌아가기</button>
                                </div>
                            </form>
                        </div>
                    </div>

                    <hr class="my-3" style="color: #ddd;">
                    <div class="text-center">
                        <p style="color: #777; font-size: 14px;">이미 계정이 있으신가요?</p>
                        <a href="login" class="fw-bold" style="color: #e76f51; text-decoration: none;">로그인하러 가기</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
	
    <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
	
    <script>
        // 주소 API 함수
        function execDaumPostcode() {
            new daum.Postcode({
                oncomplete: function(data) {
                    var addr = ''; 
                    if (data.userSelectedType === 'R') { addr = data.roadAddress; } 
                    else { addr = data.jibunAddress; }

                    document.getElementById('postcode').value = data.zonecode;
                    document.getElementById("main_address").value = addr;
                    document.getElementById("detail_address").focus();
                }
            }).open();
        }

        window.addEventListener('load', function() {
            const loader = document.getElementById('loader');
            setTimeout(function() {
                loader.classList.add('fadeOut');
            }, 300);
        });

        $(function() {
            let isIdValid = false; 

            $('#btn-dup-check').on('click', function() {
                const memberId = $('#id').val().trim();
                const $status = $('#id-status');
                if (!memberId) { alert("아이디를 입력해 주세요."); return; }

                fetch('/auth/dup-check?id=' + memberId)
                    .then(response => response.text())
                    .then(data => {
                        if (data.trim() === 'valid') {
                            isIdValid = true;
                            $status.text("사용 가능한 아이디입니다.").css("color", "green");
                        } else { 
                            isIdValid = false;
                            $status.text("이미 사용중인 아이디입니다.").css("color", "red");
                        }
                    });
            });

            $('#id').on('input', function() {
                isIdValid = false;
                $('#id-status').text(""); 
            });

            // 회원가입 버튼 클릭 시 주소 합치기 로직 추가
            $('#register').on('click', function() {
                if (!isIdValid) { alert('아이디 중복검사를 완료해 주세요.'); return; }
                if (!$('#id').val()) { alert('아이디를 입력하세요.'); return; }
                if ($('#passwd').val() !== $('#confirm').val()) { alert('비밀번호가 일치하지 않습니다.'); return; }

                // [주소 합치기] 기본주소 + 상세주소
                const mainAddr = $('#main_address').val();
                const detailAddr = $('#detail_address').val();
                
                if(!mainAddr) {
                    alert('주소를 입력해 주세요.');
                    return;
                }
                
                // 히든 필드인 #address에 값을 채워넣음
                $('#address').val(mainAddr + " " + detailAddr);

                $('#registerform').submit();
            });

            $('#cancel').on('click', function() {
                window.history.back();
            });
        });
    </script>
</body>
</html>
