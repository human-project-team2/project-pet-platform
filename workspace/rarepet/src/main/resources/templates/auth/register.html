<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background-color: #f8f9fa;">

    <div id="pageContainer" style="margin-top: 80px; margin-bottom: 60px;">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-5">
                    <div class="card shadow-sm p-4" style="border-radius: 25px; border: none;">
                        <div class="card-body">
                            <h3 class="text-center fw-bold mb-4" style="color: #5a3c32;">회원가입</h3>
                            
                            <form id="registerform" action="register" method="post">
                                <div class="mb-3">
                                    <label class="form-label fw-bold" style="color: #777;">아이디(ID)</label>
                                    <div class="input-group">
                                        <input type="text" id="memberId" name="memberId"
                                            class="form-control" placeholder="8~20자 영문, 숫자"
                                            style="border-radius: 12px 0 0 12px; font-size: 15px;">
                                        <button class="btn btn-outline-secondary" type="button" id="btn-dup-check" 
                                            style="border-radius: 0 12px 12px 0; font-size: 14px; border-color: #dee2e6;">
                                            중복검사
                                        </button>
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label fw-bold" style="color: #777;">비밀번호</label>
                                    <input type="password" id="passwd" name="passwd"
                                        class="form-control" placeholder="비밀번호를 입력하세요"
                                        style="border-radius: 12px; font-size: 15px;">
                                </div>

                                <div class="mb-3">
                                    <label class="form-label fw-bold" style="color: #777;">비밀번호 확인</label>
                                    <input type="password" id="confirm" name="confirm"
                                        class="form-control" placeholder="비밀번호를 한번 더 입력하세요"
                                        style="border-radius: 12px; font-size: 15px;">
                                </div>

                                <div class="d-grid gap-2">
                                    <button type="button" id="register" class="btn btn-lg fw-bold shadow-sm"
                                        style="background-color: #e76f51; color: white; border-radius: 12px;">
                                        회원가입하기
                                    </button>
                                    <button type="button" id="cancel" class="btn btn-link text-decoration-none" 
                                        style="color: #999; font-size: 14px;">
                                        취소하고 돌아가기
                                    </button>
                                </div>
                            </form>
                        </div>

                        <hr class="my-3" style="color: #ddd;">
                        <div class="text-center">
                            <p style="color: #777; font-size: 14px;">이미 계정이 있으신가요?</p>
                            <a href="login" class="fw-bold" style="color: #e76f51; text-decoration: none;">로그인하러 가기</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
    <script>
    $(function() {
        let isIdValid = false;

        // 아이디 중복 체크
        $('#btn-dup-check').on('click', function() {
            const memberId = $('#memberId').val();
            if (!memberId) {
                alert("아이디를 입력해 주세요.");
                return;
            }

            fetch('dup-check?memberid=' + memberId)
                .then(response => response.text())
                .then(data => {
                    if (data === 'valid') {
                        isIdValid = true;
                        alert("사용 가능한 아이디입니다.");
                    } else { 
                        isIdValid = false;
                        alert("이미 사용중인 아이디입니다.");
                    }
                });
        });

        // 아이디 입력 시 중복체크 초기화
        $('#memberId').on('input', function() {
            isIdValid = false;
        });

        // 등록 버튼 클릭
        $('#register').on('click', function() {
            if (!isIdValid) {
                alert('아이디 중복검사를 완료해 주세요.');
                return;
            }

            // 간단한 유효성 검사
            if ($('#passwd').val() !== $('#confirm').val()) {
                alert('비밀번호가 일치하지 않습니다.');
                return;
            }

            if ($('#email').val().length < 5) {
                alert('올바른 이메일을 입력하세요.');
                return;
            }

            $('#registerform').submit();
        });

        // 취소 버튼
        $('#cancel').on('click', function() {
            window.history.back();
        });
    });
    </script>
</body>
</html>
