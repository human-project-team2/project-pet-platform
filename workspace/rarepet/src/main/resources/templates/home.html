<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AnyZoo Marketplace</title>

<!-- Bootstrap 5 CSS -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
	rel="stylesheet">

<!-- Google Font -->
<link
	href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap"
	rel="stylesheet">

<style>
body {
	font-family: 'Noto Sans KR', sans-serif;
	background: #fdf6ee;
}

/* Hero */
.hero {
	background: linear-gradient(rgba(230, 180, 150, 0.45),
		rgba(245, 210, 185, 0.55)),
		url("https://images.unsplash.com/photo-1508672019048-805c876b67e2?auto=format&fit=crop&w=1600&q=80");
	background-size: cover;
	background-position: center;
	height: 60vh;
}

.hero-box {
	background: rgba(255, 250, 245, 0.92);
	border-radius: 30px;
}

/* Card */
.card {
	border: none;
	border-radius: 20px;
}

.card img {
	height: 200px;
	object-fit: cover;
	border-radius: 20px 20px 0 0;
}

.heart {
	position: absolute;
	top: 15px;
	right: 15px;
	font-size: 22px;
	cursor: pointer;
	color: #ccc;
}

.heart.active {
	color: #e76f51;
}

.review-section {
	background:
		url("https://images.unsplash.com/photo-1518717758536-85ae29035b6d?auto=format&fit=crop&w=1600&q=80");
	background-size: cover;
	background-position: center;
}

.review-overlay {
	background: rgba(90, 60, 50, 0.75);
	border-radius: 25px;
}
</style>
</head>

<body>

	<!-- NAVBAR -->
	<div th:replace="fragments/fragment :: header"></div>

	<!-- HERO -->
	<section
		class="hero d-flex align-items-center justify-content-center text-center text-dark mt-5">
		<div class="hero-box p-5 shadow">
			<h2 class="fw-bold">희귀 반려동물 전문 거래 플랫폼</h2>
			<p class="text-muted">자연과 사람, 그리고 소중한 생명을 연결합니다</p>
		</div>
	</section>

	<!-- FILTER -->
	<div class="container my-5">
		<div class="row g-3 align-items-end">

			<div class="col-md-4">
				<label class="form-label">검색어</label> <input type="text"
					id="searchInput" class="form-control" placeholder="동물 이름 입력">
			</div>

			<div class="col-md-3">
				<label class="form-label">카테고리</label> <select id="categorySelect"
					class="form-select">
					<option value="all">전체 종류</option>
					<option value="포유류">포유류</option>
					<option value="파충류">파충류</option>
					<option value="양서류">양서류</option>
					<option value="조류">조류</option>
					<option value="절지동물-곤충">절지동물 & 곤충</option>
					<option value="기타동물">기타특수생물</option>
					<option value="기타">관련 용품</option>
				</select>
			</div>

			<div class="col-md-3">
				<label class="form-label">가격 정렬</label> <select id="priceSort"
					class="form-select">
					<option value="default">기본</option>
					<option value="low">낮은 가격순</option>
					<option value="high">높은 가격순</option>
				</select>
			</div>

			<div class="col-md-2 d-grid">
				<button class="btn btn-warning" onclick="searchAnimals()">검색</button>
			</div>

		</div>
	</div>

	<!-- MARKET -->
	<div class="container">
		<div class="row g-4">



			<!-- 상품 리스트 반복문 -->
			<div class="col-md-4 market-item" th:each="product:${products}">
				<div class="card shadow">
					<a th:href="@{market/detail}"><img
						th:src="@{${product.imgUrl}}" class="card-img-top"></a>
					<div class="card-body">
						<h5 class="card-title" th:text="${product.productName}"></h5>
						<p class="card-text text-muted"
							th:text="${product.shortDescription}"></p>
						<div class="price-badge" th:text="${product.price}"></div>
					</div>
				</div>
			</div>
			<!-- 상품 리스트 반복문  끝-->


		</div>

		<!-- PAGINATION -->
		<nav class="my-5">
			<ul class="pagination justify-content-center">
				<li class="page-item"><a class="page-link" href="#">1</a></li>
				<li class="page-item"><a class="page-link" href="#">2</a></li>
				<li class="page-item"><a class="page-link" href="#">3</a></li>
			</ul>
		</nav>

	</div>
	
	<div th:replace="fragments/fragment :: message"></div>
	
	<!-- REVIEW -->
	<section class="review-section text-white py-5">
		<div class="container review-overlay p-5">
			<h3 class="mb-4">💛 이용 후기</h3>
			<p>★★★★★ “슈가 글라이더를 안전하게 입양했어요.” – 김지훈</p>
			<p>★★★★☆ “설명이 상세해서 믿고 거래했습니다.” – 이서연</p>
			<p>★★★★★ “초보자에게 정말 유용했어요.” – 박민준</p>
		</div>
	</section>	

	<div th:replace="fragments/fragment :: footer"></div>

	<!-- Bootstrap JS -->
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
	<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>	
	<script th:replace="fragments/fragment :: message_script"></script>
	<script>
	
		$( () => {
			
			function toggleHeart(el) {
				el.classList.toggle("active");
			}
			
		})
		
	</script>

</body>
</html>
