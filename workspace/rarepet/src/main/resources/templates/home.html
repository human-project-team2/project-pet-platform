<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" 
xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AnyZoo Marketplace</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
	rel="stylesheet">
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link
	href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap"
	rel="stylesheet">
<link rel="stylesheet" th:href="@{/css/floating-chat.css}">
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<style>
body {
	font-family: 'Noto Sans KR', sans-serif;
	background: #fdfaf6;
	transition: 0.3s;
}

.hero {
	background: linear-gradient(rgba(230, 180, 150, 0.3),
		rgba(245, 210, 185, 0.4)),
		url("https://images.unsplash.com/photo-1508672019048-805c876b67e2?auto=format&fit=crop&w=1600&q=80")
		center/cover;
	height: 50vh;
}

.hero-box {
	background: rgba(255, 255, 255, 0.9);
	border-radius: 30px;
	border: 1px solid rgba(255, 255, 255, 0.3);
}

.card {
	border: none;
	border-radius: 20px;
	transition: 0.3s;
	overflow: hidden;
	background: #fff;
}

.card:hover {
	transform: translateY(-8px);
	box-shadow: 0 15px 30px rgba(0, 0, 0, 0.1) !important;
}

.price-badge {
	font-weight: bold;
	color: #f26419;
	font-size: 1.25rem;
}
/* [기본] 라이트 모드일 때의 색상 */
.main-title {
    color: #333; /* 원래대로 검은색 */
}

/* 🌙 한 단계 밝아진 소프트 다크모드 (Deep Blue Gray) */
[data-bs-theme="dark"] body {
	background-color: #1a1d20 !important;
	color: #f8f9fa;
}

[data-bs-theme="dark"] .hero-box {
	background: rgba(43, 48, 53, 0.9) !important;
	color: #fff !important;
	border: 1px solid #495057;
}

[data-bs-theme="dark"] .card {
	background-color: #2b3035 !important;
	border: 1px solid #3d4246;
}

[data-bs-theme="dark"] .card-title {
	color: #ff9f1c !important;
}

[data-bs-theme="dark"] .price-badge {
	color: #ffbf69 !important;
}

[data-bs-theme="dark"] .text-muted {
	color: #adb5bd !important;
}

[data-bs-theme="dark"] .btn-warning {
	background-color: #ff9f1c;
	border-color: #ff9f1c;
	color: #1a1d20;
	font-weight: bold;
}
/* soft 다크모드 전용 설정 */
[data-bs-theme="dark"] body {
    background-color: #1a1d20 !important;
    color: #f8f9fa;
}

/* 🌙 [추가] 다크 모드일 때만 흰색으로 변경 */
[data-bs-theme="dark"] .main-title {
    color: #ffffff !important; /* 다크모드에서는 흰색으로! */
}
</style>
</head>
<body>
	<div th:replace="~{fragments/fragment :: header}"></div>

	<section
		class="hero d-flex align-items-center justify-content-center text-center mt-5">
		<div class="hero-box p-5 shadow-sm">
			<h2 class="fw-bold display-6 main-title">희귀 반려동물 전문 마켓</h2>
			<p class="text-muted fs-5">소중한 생명과의 특별한 만남을 시작하세요</p>
		</div>
	</section>

	<div class="container my-5">
		<div class="row g-3 align-items-end mb-5">
			<div class="col-md-5">
				<label class="form-label fw-bold small">검색어</label> <input
					type="text" id="searchInput" class="form-control form-control-lg"
					th:value="${search}" placeholder="찾으시는 생물을 입력하세요">
			</div>
			<div class="col-md-3">
				<label class="form-label fw-bold small">카테고리</label> <select
					id="categorySelect" class="form-select form-select-lg">
					<option value="all" th:selected="${category == 'all'}">전체</option>
					<option value="포유류" th:selected="${category == '포유류'}">포유류</option>
					<option value="파충류" th:selected="${category == '파충류'}">파충류</option>
					<option value="양서류" th:selected="${category == '양서류'}">양서류</option>
					<option value="조류" th:selected="${category == '조류'}">조류</option>
					<option value="절지동물-곤충" th:selected="${category == '절지동물-곤충'}">절지동물
						& 곤충</option>
					<option value="기타동물" th:selected="${category == '기타동물'}">기타특수생물</option>
					<option value="기타" th:selected="${category == '기타'}">관련 용품</option>
				</select>
			</div>
			<div class="col-md-2 d-grid">
				<button type="button"
					class="btn btn-warning btn-lg fw-bold shadow-sm"
					onclick="performSearch()">검색</button>
			</div>
		</div>

		<div class="row g-4">
			<div th:if="${#lists.isEmpty(products)}"
				class="col-12 text-center py-5">
				<div class="display-1 mb-3">🐾</div>
				<p class="text-muted">현재 등록된 상품이 없습니다.</p>
			</div>

			<div class="col-sm-6 col-lg-4 mb-2" th:each="product : ${products}">
				<div class="card shadow-sm h-100">
					<a th:href="@{/market/detail/{no}(no=${product.productNo})}">
					<img
						th:if="${#lists.isEmpty(product.productImages) == false}" 
						th:src="@{${product.productImages[0].imgUrl}}" class="card-img-top"
						style="height: 220px; object-fit: cover;" alt="Animal">
					<img th:if="${#lists.isEmpty(product.productImages) == true}" 
                           src="/img/no_image.jpg" class="card-img-top"
                           style="height: 220px; object-fit: cover;" alt="Animal">
					</a>
					<div class="card-body p-4">
						<div class="mb-2">
							<span class="badge bg-warning text-dark px-3 py-2"
								th:text="${product.productCategory}">분류</span>
						</div>
						<div class="mb-2">
							    <span class="badge bg-danger"
							          th:if="${product.productCount == 0}">
							        품절
							    </span>
							
							    <span class="badge bg-secondary"
							          th:if="${product.productCount > 0}"
							          th:text="'수량 : ' + ${product.productCount}">
							    </span>
						</div>
						<h5 class="card-title fw-bold mb-3"
							th:text="${product.productName}">이름</h5>
						<p class="card-text text-muted small mb-4"
							th:text="${product.shortDescription}">설명</p>
						<hr class="opacity-10">
						<div
							class="d-flex justify-content-between align-items-center mt-3">
							<span class="text-muted small">분양가</span>
							<div class="price-badge"
								th:text="${#numbers.formatInteger(product.price, 0, 'COMMA')} + '원'"></div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>

	<div th:replace="~{fragments/fragment :: footer}"></div>
	<div th:replace="~{fragments/fragment :: message}"></div>

	
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
	<div th:replace="~{fragments/fragment :: message_script}"></div>

	<script>
		// 검색 실행 함수
		function performSearch() {
			const searchVal = $('#searchInput').val();
			const categoryVal = $('#categorySelect').val();

			// 컨트롤러의 @GetMapping 경로로 파라미터를 담아 보냅니다.
			location.href = `/home?search=${encodeURIComponent(searchVal)}&category=${encodeURIComponent(categoryVal)}`;
		}

		$(function() {
			// 입력창에서 엔터 키를 눌렀을 때도 검색이 되게 합니다.
			$('#searchInput').on('keypress', function(e) {
				if (e.which == 13) {
					performSearch();
				}
			});
		});
	</script>
</body>
</html>
