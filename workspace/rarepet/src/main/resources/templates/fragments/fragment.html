<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<div th:fragment="header">
    <nav class="navbar navbar-expand-lg shadow-sm fixed-top" 
         style="background-color: var(--bs-body-bg); border-bottom: 1px solid rgba(0,0,0,0.1); transition: 0.3s;">
        <div class="container">
            <a class="navbar-brand fw-bold d-flex align-items-center" th:href="@{/home}"> 
                <img th:src="@{/img/AnyZooLogo.png}" alt="AnyZoo Logo" width="35" height="35" class="me-2"> 
                <span style="color: #ff9f1c;">AnyZoo</span>
            </a>
            
            <div class="form-check form-switch ms-auto me-3">
                <input class="form-check-input" type="checkbox" id="darkModeToggle" style="cursor: pointer;">
                <label class="form-check-label d-none d-sm-inline" for="darkModeToggle" style="font-size: 0.8rem; opacity: 0.8;">🌙 모드</label>
            </div>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav">
                	
                	<th:block sec:authorize="hasRole('admin')">
	                	<li class="nav-item">
	                		<a class="nav-link" th:href="@{/admin}"><i class="bi bi-shield-lock"></i>관리자</a></li>
                	</th:block>
                    <li class="nav-item"><a class="nav-link" th:href="@{/market}">
                    	<i class="bi bi-shop"></i>마켓</a></li>
           
                    <li class="nav-item" ><a class="nav-link" th:href="@{/market/register}">
                    	<i class="bi bi-plus-circle"></i>판매등록</a></li>
                   
                    <li class="nav-item"><a class="nav-link" th:href="@{/board/boardlist}">
                    	<i class="bi bi-card-text"></i>게시판</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/review/list}">
                    	<i class="bi bi-star"></i>리뷰</a></li>
                   	<th:block sec:authorize="isAuthenticated()">
                   	<span class="nav-link" style="color: #e91e63; font-weight: 600;">
					    [[${#authentication.principal.username}]] 님
					</span>
                    </th:block>
                    <th:block sec:authorize="isAuthenticated()">
	                    <li class="nav-item dropdown ms-2">
	                        <a class="nav-link dropdown-toggle p-0 d-flex align-items-center" href="#" id="userDropdown" role="button" data-bs-toggle="dropdown">
	                           <div class="rounded-circle overflow-hidden me-2 border border-secondary"
	                                 style="width: 36px; height: 36px; background: rgba(0,0,0,0.05); display: flex; align-items: center; justify-content: center;">
	                                <i class="bi bi-person-circle fs-4 text-secondary"></i>
	                            </div>
	                        </a>
	                        <ul class="dropdown-menu dropdown-menu-end shadow-sm" aria-labelledby="userDropdown">
	                              <li>
	                                  <a class="dropdown-item d-flex align-items-center" th:href="@{/mypage}">
	                                      <i class="bi bi-person me-2 text-muted"></i> 마이페이지
	                                  </a>
	                              </li>
	                              <li>
	                                  <a class="dropdown-item d-flex align-items-center" th:href="@{/market/shoppingCart}">  <!-- adjust path if your cart is elsewhere -->
	                                      <i class="bi bi-cart me-2 text-muted"></i> 장바구니
	                                  </a>
	                              </li>
	                              <li>
	                                  <a class="dropdown-item d-flex align-items-center"
	                                     data-bs-toggle="modal" data-bs-target="#chatListModal">
	                                      <i class="bi bi-chat-dots me-2 text-muted"></i> 메시지
	                                  </a>
	                              </li>
	                              <li><hr class="dropdown-divider"></li>
	                              <li>
	                                  <a class="dropdown-item text-danger d-flex align-items-center" th:href="@{/auth/logout}">
	                                      <i class="bi bi-box-arrow-right me-2"></i> 로그아웃
	                                  </a>
	                              </li>
	                          </ul>
	                    </li>
                    </th:block>
                    <th:block sec:authorize ="isAnonymous()">
	                    <li class="nav-item" th:if="${session.loginuser == null}"><a class="nav-link" th:href="@{/auth/login}">
	                    	<i class="bi bi-box-arrow-in-right"></i>로그인</a>
	                   	</li>
                    </th:block>
                    
                </ul>
            </div>
        </div>
    </nav>

    <script th:inline="javascript">
        (function() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-bs-theme', savedTheme);
        })();

        document.addEventListener('DOMContentLoaded', () => {
            const toggle = document.getElementById('darkModeToggle');
            if (toggle) {
                toggle.checked = (document.documentElement.getAttribute('data-bs-theme') === 'dark');
                toggle.addEventListener('change', () => {
                    const nextTheme = toggle.checked ? 'dark' : 'light';
                    document.documentElement.setAttribute('data-bs-theme', nextTheme);
                    localStorage.setItem('theme', nextTheme);
                });
            }
        });
    </script>
    
    <style>
        /* 좀 더 밝고 세련된 다크모드 배경색 설정 */
        [data-bs-theme="dark"] .navbar { 
            background-color: #2b3035 !important; 
            border-bottom: 1px solid #3d4246 !important; 
        }
        [data-bs-theme="dark"] .nav-link { color: #dee2e6 !important; }
        [data-bs-theme="dark"] .nav-link:hover { color: #ff9f1c !important; }
        [data-bs-theme="dark"] .dropdown-menu { background-color: #343a40; border-color: #495057; }
        [data-bs-theme="dark"] .dropdown-item { color: #e9ecef; }
        [data-bs-theme="dark"] .dropdown-item:hover { background-color: #495057; color: #ff9f1c; }
    </style>
</div>

<div th:fragment="footer">
    <footer class="text-center py-4 border-top" style="background-color: var(--bs-tertiary-bg);">
        <p class="mb-0 text-muted small">© 2026 AnyZoo. 소중한 생명을 위한 희귀 반려동물 마켓</p>
    </footer>
</div>

<div th:fragment="message">

      <div class="modal fade" id="chatListModal" tabindex="-1"
         aria-labelledby="chatListModalLabel" aria-hidden="true">
         <div class="modal-dialog modal-xl modal-dialog-scrollable">
            <div class="modal-content">
               <div class="modal-header">
                  <h5 class="modal-title" id="chatListModalLabel">메시지</h5>
                  <button type="button" class="btn-close" data-bs-dismiss="modal"
                     aria-label="Close"></button>
               </div>

               <div class="modal-body">
                  <!-- 메시지 목록 테이블 -->
                  <div class="table-responsive">
                     <table class="table table-hover align-middle">
                        <thead class="table-light">
                           <tr>
                              <th>대화 상대</th>
                              <th>마지막 대화 시간</th>
                           </tr>
                        </thead>
                        <tbody id="messageListBody">

                           <!-- 메시지 목록 여기에 -->

                        </tbody>
                     </table>
                  </div>
               </div>

               <div class="modal-footer">
                  <button type="button" class="btn btn-outline-primary"
                     data-bs-toggle="modal" data-bs-target="#newMessageModal">
                     새 메시지 보내기</button>
                  <button type="button" class="btn btn-secondary"
                     data-bs-dismiss="modal">닫기</button>
               </div>
            </div>
         </div>
      </div>

      <!-- 2. 채팅 상세 모달 (또는 같은 모달 내 영역으로 처리) -->
      <div class="modal fade" id="chatDetailModal" tabindex="-1"
         aria-labelledby="chatDetailModalLabel" aria-hidden="true">
         <div class="modal-dialog modal-lg modal-dialog-scrollable">
            <div class="modal-content">
               <div class="modal-header">
                  <button type="button" class="btn btn-outline-secondary me-3"
                     id="btnBackToList">← 목록으로</button>
                  <h5 class="modal-title" id="chatPartnerTitle">대화 상대</h5>
                  <button type="button" class="btn-close" data-bs-dismiss="modal"
                     aria-label="Close"></button>
               </div>

               <div class="modal-body" style="background: #f8f9fa;">
                  <!-- 채팅 메시지 영역 -->
                  <div id="chatMessages"
                     style="min-height: 300px; max-height: 500px; overflow-y: auto; padding: 15px;">
                     <!-- 메시지 상세 여기에 -->
                  </div>
               </div>

               <div class="modal-footer">
                  <div class="input-group">
                     <input type="text" class="form-control"
                        placeholder="메시지를 입력하세요..." id="chatInput">
                     <button class="btn btn-primary" type="button" id="btnSendInChat">전송</button>
                  </div>
               </div>
            </div>
         </div>
      </div>

      <!-- 3. 새 메시지 모달 -->
      <div class="modal fade" id="newMessageModal" tabindex="-1"
         aria-labelledby="newMessageModalLabel" aria-hidden="true">
         <div class="modal-dialog">
            <div class="modal-content">
               <div class="modal-header">
                  <h5 class="modal-title" id="newMessageModalLabel">새 메시지</h5>
                  <button type="button" class="btn-close" data-bs-dismiss="modal"
                     aria-label="Close"></button>
               </div>
               <div class="modal-body">
                  <div class="mb-3">
                     <label for="receiverId" class="form-label">받는 사람 아이디 </label> <input
                        type="text" class="form-control" id="receiverId"
                        placeholder="아이디를 입력하세요" required>
                  </div>
                  <div class="mb-3">
                     <label for="messageContent" class="form-label">메시지 내용</label>
                     <textarea class="form-control" id="messageContent" rows="5"
                        placeholder="메시지를 입력하세요..." required></textarea>
                  </div>
               </div>
               <div class="modal-footer">
                  <button type="button" class="btn btn-secondary"
                     data-bs-dismiss="modal">취소</button>
                  <button type="button" class="btn btn-primary">보내기</button>
               </div>
            </div>
         </div>
      </div>
   </div>


<div th:fragment="message_script">
   <script>
      $( () => {
         
         // 판매자 문의 누를 때 새로 열리는
         $("#newMessageModal").on("show.bs.modal", function(event){
            const button = event.relatedTarget;
            const receiver = button.getAttribute("data-bs-receiver") || "";
            $("#receiverId").val(receiver.trim());
            
         })
         
          // 새 메시지 보내기 모달 버튼
         $('#newMessageModal .btn-primary').on('click', () => {
            
             const receiver = $('#receiverId').val().trim();
             const content = $('#messageContent').val().trim();

            if (!receiver) {
              alert('받는 사람을 입력하세요');
              return;
            }
            if (!content) {
                 alert('메시지 내용을 입력하세요');
                 return;
           }
            
            fetch("/messages", {method:"post", 
                             headers:{"Content-Type":"application/json"},
                             body: JSON.stringify({
                                 receiverId: receiver,
                                 messageContent: content
                              })
            }).then(response => response.text())
             .then(data => {
                if(data == "success"){
                   alert("메시지 보내기 완료.");
                   $("#newMessageModal").modal("hide");
                } else if (data == "failure"){
                   alert("존재하지 않는 회원...")
                   $("#newMessageModal").modal("hide");
                }
             })            
          });
          
         // 보낸 사람별로 메시지 목록 불러오기
         
         $("#chatListModal").on("shown.bs.modal", () => {
            
            fetch("/messages/list").then(response => response.json())
            .then(messages => {
               $("#messageListBody").empty();
               
               messages.forEach( (message) => {
                  
                  const partnerId = message.direction === "sent" ? message.receiverId : message.senderId;
                         
                  $("#messageListBody").append(
                     `
                     <tr class="message-row" data-partner-id="${partnerId}">
                        <td>${partnerId}</td>
                        <td>${message.sentAt}</td>
                     </tr>
                     `);
               });
            });
            
         })
         
          
         // 메시지 클릭 → 채팅 상세 모달 열기
          $(document).on('click', '.message-row', function () { // $(".message-row").on("click") -> 작동하지 않음
             
             const partnerId = $(this).data("partner-id")
             
             fetch(`/messages/detail?partnerId=${partnerId}`)
             .then(response => response.json())
             .then(data => {
                
                $("#chatMessages").empty();
                
                data.forEach(message => {
                   
                   let isMe = (message.direction === "sent");
                   
                   $("#chatMessages").append(
                   `
                   <div class="d-flex ${isMe?'justify-content-end':'justify-content-start'} mb-3">
                      <div class="p-3 rounded ${isMe?'bg-primary':'bg-white'} ${isMe?'text-white':'border'} shadow-sm" style="max-width: 70%;">
                        ${message.messageContent}
                        <div class="small ${isMe?'text-white-50':'text-muted'} mt-1">${message.sentAt}</div>
                      </div>
                    </div>
                   `      
                   )
                });            
               
                // 전송 버튼에 현재 대화중인 아이디 저장.
                $("#btnSendInChat").data("partner", partnerId);
             })
             setTimeout(() => {
             $('#chatMessages')[0].scrollTop = $('#chatMessages')[0].scrollHeight;
             }, 1000);
            
            const partnerName = $(this).data('partner-id') || '대화 상대';

            $('#chatPartnerTitle').text(partnerId + ' 님과의 대화');
            
            // 채팅 모달 열기
            $('#chatListModal').modal('hide');
            $('#chatDetailModal').modal('show');
          });

          // 뒤로 가기 버튼
          $('#btnBackToList').on('click', function() {
            $('#chatDetailModal').modal('hide');
            $('#chatListModal').modal('show');
          });

          // 채팅창 내 전송 버튼
          $('#btnSendInChat').on('click', function() {
             
            const text = $('#chatInput').val().trim();
            if (!text) return;
            const partnerId = $(this).data("partner")
            const now = new Date();
            const newMsg = `
              <div class="d-flex justify-content-end mb-3">
                <div class="p-3 rounded bg-primary text-white shadow-sm" style="max-width: 70%;">
                  ${text}
                  <div class="small text-white-50 mt-1">${now}</div>
                </div>
              </div>
            `;
            
            fetch("/messages", {method:"post", 
                             headers:{"Content-Type":"application/json"},
                             body: JSON.stringify({
                                 receiverId: partnerId,
                                 messageContent: text
                              })
            }).then(response => response.text())
             .then(data => {
                if (data == "failure"){
                   alert("메시지 보내기 실패")
                }
                
                $('#chatMessages').append(newMsg);
                $('#chatInput').val('');
                $('#chatMessages')[0].scrollTop = $('#chatMessages')[0].scrollHeight;
             })   
            
            
          });

          // Enter 키로도 전송
          $('#chatInput').on('keypress', function(e) {
            if (e.which === 13 && !e.shiftKey) {
              e.preventDefault();
              $('#btnSendInChat').click();
            }
          });
          // 채팅창 끝

         
      })
      
   </script>
</div>
</body>
</html>
