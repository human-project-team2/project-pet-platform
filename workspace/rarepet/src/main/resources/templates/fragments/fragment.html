<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

	<!-- 공통 header -->
	<div th:fragment="header">
		<!-- NAVBAR -->
		<nav
			class="navbar navbar-expand-lg navbar-light bg-white shadow-sm fixed-top">
			<div class="container">
				<a class="navbar-brand fw-bold d-flex align-items-center"
					th:href="@{/home}"> <img th:src="@{/img/AnyZooLogo.png}"
					alt="AnyZoo Logo" width="35" height="35"
					class="d-inline-block align-top me-2"> <span>AnyZoo</span>
				</a>
				<button class="navbar-toggler" type="button"
					data-bs-toggle="collapse" data-bs-target="#navbarNav">
					<span class="navbar-toggler-icon"></span>
				</button>

				<div class="collapse navbar-collapse justify-content-end"
					id="navbarNav">
					<ul class="navbar-nav">

						<li class="nav-item"><a class="nav-link" href="/market">마켓</a></li>
						<li class="nav-item"><a class="nav-link"
							href="/market/register">판매등록</a></li>
						<li class="nav-item"><a class="nav-link"
							href="/board/boardlist">게시판</a></li>
						<li class="nav-item"><a class="nav-link" href="#">리뷰</a></li>
						<li class="nav-item"><a class="nav-link"
							data-bs-toggle="modal" data-bs-target="#chatListModal"> 메시지 </a>
						</li>
						<li class="nav-item" th:if="${session.loginuser != null}"><a class="nav-link" href="/auth/logout">로그아웃</a></li>
						<li class="nav-item" th:if="${session.loginuser == null}"><a class="nav-link" href="/auth/login">로그인</a></li>
					</ul>
				</div>
			</div>
		</nav>
	</div>

	<!-- 공통 footer -->
	<div th:fragment="footer">
		<footer class="text-center py-4 bg-light"> © 2026 AnyZoo </footer>
	</div>

	<!-- 메시지 목록 모달 -->
	
		<!-- 메시지 목록 모달 -->
		<div th:fragment="message">

			<!-- 1. 메시지 목록 모달 -->
			<div class="modal fade" id="chatListModal" tabindex="-1"
				aria-labelledby="chatListModalLabel" aria-hidden="true">
				<div class="modal-dialog modal-xl modal-dialog-scrollable">
					<div class="modal-content">
						<div class="modal-header">
							<h5 class="modal-title" id="chatListModalLabel">메시지</h5>
							<button type="button" class="btn-close" data-bs-dismiss="modal"
								aria-label="Close"></button>
						</div>

						<div class="modal-body">
							<!-- 메시지 목록 테이블 -->
							<div class="table-responsive">
								<table class="table table-hover align-middle">
									<thead class="table-light">
										<tr>
											<th>보낸 사람</th>
											<th>받은 사람</th>
											<th>보낸 시각</th>
											<th>받은 시각</th>
										</tr>
									</thead>
									<tbody id="messageListBody">
										<!-- 실제로는 JS로 채워짐 (지금은 임시 샘플 행) -->
										<tr class="message-row" data-partner-id="2"
											data-partner-name="판매자김">
											<td>판매자김</td>
											<td>나 (Umi)</td>
											<td>2026-02-19 14:35</td>
											<td>2026-02-19 14:40</td>
										</tr>
										<tr class="message-row" data-partner-id="7"
											data-partner-name="초보집사">
											<td>나 (Umi)</td>
											<td>초보집사</td>
											<td>2026-02-18 09:12</td>
											<td>-</td>
										</tr>
										<tr class="message-row" data-partner-id="15"
											data-partner-name="레오파드맘">
											<td>레오파드맘</td>
											<td>나 (Umi)</td>
											<td>2026-02-17 21:05</td>
											<td>미확인</td>
										</tr>
									</tbody>
								</table>
							</div>
						</div>

						<div class="modal-footer">
							<button type="button" class="btn btn-outline-primary"
								data-bs-toggle="modal" data-bs-target="#newMessageModal">
								새 메시지 보내기</button>
							<button type="button" class="btn btn-secondary"
								data-bs-dismiss="modal">닫기</button>
						</div>
					</div>
				</div>
			</div>

			<!-- 2. 채팅 상세 모달 (또는 같은 모달 내 영역으로 처리) -->
			<div class="modal fade" id="chatDetailModal" tabindex="-1"
				aria-labelledby="chatDetailModalLabel" aria-hidden="true">
				<div class="modal-dialog modal-lg modal-dialog-scrollable">
					<div class="modal-content">
						<div class="modal-header">
							<button type="button" class="btn btn-outline-secondary me-3"
								id="btnBackToList">← 목록으로</button>
							<h5 class="modal-title" id="chatPartnerTitle">대화 상대</h5>
							<button type="button" class="btn-close" data-bs-dismiss="modal"
								aria-label="Close"></button>
						</div>

						<div class="modal-body" style="background: #f8f9fa;">
							<!-- 채팅 메시지 영역 -->
							<div id="chatMessages"
								style="min-height: 300px; max-height: 500px; overflow-y: auto; padding: 15px;">
								<!-- JS로 채워질 영역 (임시 샘플 메시지) -->
							</div>
						</div>

						<div class="modal-footer">
							<div class="input-group">
								<input type="text" class="form-control"
									placeholder="메시지를 입력하세요..." id="chatInput">
								<button class="btn btn-primary" type="button" id="btnSendInChat">전송</button>
							</div>
						</div>
					</div>
				</div>
			</div>

			<!-- 3. 새 메시지 모달 -->
			<div class="modal fade" id="newMessageModal" tabindex="-1"
				aria-labelledby="newMessageModalLabel" aria-hidden="true">
				<div class="modal-dialog">
					<div class="modal-content">
						<div class="modal-header">
							<h5 class="modal-title" id="newMessageModalLabel">새 메시지</h5>
							<button type="button" class="btn-close" data-bs-dismiss="modal"
								aria-label="Close"></button>
						</div>
						<div class="modal-body">
							<div class="mb-3">
								<label for="receiverId" class="form-label">받는 사람 아이디
									</label> <input type="text" class="form-control" id="receiverId"
									placeholder="아이디를 입력하세요" required>
							</div>
							<div class="mb-3">
								<label for="messageContent" class="form-label">메시지 내용</label>
								<textarea class="form-control" id="messageContent" rows="5"
									placeholder="메시지를 입력하세요..." required></textarea>
							</div>
						</div>
						<div class="modal-footer">
							<button type="button" class="btn btn-secondary"
								data-bs-dismiss="modal">취소</button>
							<button type="button" class="btn btn-primary">보내기</button>
						</div>
					</div>
				</div>
			</div>
		</div>

		<!-- 메시지 스크립트 -->
		<script th:fragment="message_script">
		
		$( () => {
			// 메시지 목록 행 클릭 → 채팅 상세 모달 열기
		    $(document).on('click', '.message-row', function() {
		      const partnerId   = $(this).data('partner-id');
		      const partnerName = $(this).data('partner-name') || '대화 상대';

		      $('#chatPartnerTitle').text(partnerName + ' 님과의 대화');

		      // 임시 샘플 대화 내용 (나중에 fetch로 대체)
		      const sampleMessages = `
		        <div class="d-flex justify-content-start mb-3">
		          <div class="p-3 rounded bg-white border shadow-sm" style="max-width: 70%;">
		            안녕하세요! 상품 아직 판매중이신가요?
		            <div class="small text-muted mt-1">2026-02-19 14:35</div>
		          </div>
		        </div>
		        <div class="d-flex justify-content-end mb-3">
		          <div class="p-3 rounded bg-primary text-white shadow-sm" style="max-width: 70%;">
		            네, 아직 있어요~ 관심 있으시면 사진 더 보내드릴게요!
		            <div class="small text-white-50 mt-1">2026-02-19 14:37</div>
		          </div>
		        </div>
		        <div class="d-flex justify-content-start mb-3">
		          <div class="p-3 rounded bg-white border shadow-sm" style="max-width: 70%;">
		            가격 조금 깎아주실 수 있을까요?
		            <div class="small text-muted mt-1">2026-02-19 14:38</div>
		          </div>
		        </div>
		      `;

		      $('#chatMessages').html(sampleMessages);

		      // 채팅 모달 열기
		      $('#chatListModal').modal('hide');
		      $('#chatDetailModal').modal('show');
		    });

		    // 뒤로 가기 버튼
		    $('#btnBackToList').on('click', function() {
		      $('#chatDetailModal').modal('hide');
		      $('#chatListModal').modal('show');
		    });

		    // 채팅창 내 전송 버튼 (임시)
		    $('#btnSendInChat').on('click', function() {
		      const text = $('#chatInput').val().trim();
		      if (!text) return;

		      const newMsg = `
		        <div class="d-flex justify-content-end mb-3">
		          <div class="p-3 rounded bg-primary text-white shadow-sm" style="max-width: 70%;">
		            ${text}
		            <div class="small text-white-50 mt-1">방금</div>
		          </div>
		        </div>
		      `;
		      $('#chatMessages').append(newMsg);
		      $('#chatInput').val('');
		      $('#chatMessages')[0].scrollTop = $('#chatMessages')[0].scrollHeight;
		    });

		    // Enter 키로도 전송
		    $('#chatInput').on('keypress', function(e) {
		      if (e.which === 13 && !e.shiftKey) {
		        e.preventDefault();
		        $('#btnSendInChat').click();
		      }
		    });
			
		 // 새 메시지 모달의 보내기 버튼
		    $('#newMessageModal .btn-primary').on('click', () => {
		      const receiver = $('#receiverId').val().trim();
		      const content = $('#messageContent').val().trim();

		      if (!receiver) {
		        alert('받는 사람을 입력하세요');
		        return;
		      }
		      if (!content) {
			        alert('메시지 내용을 입력하세요');
			        return;
			      }

		      fetch('/messages', {
		        method: 'POST',
		        headers: {
		            'Accept': 'application/json',
		            'Content-Type': 'application/json'
		          },
		        body: JSON.stringify({ // 백엔드로 보냄.
		          receiverId: receiver,      
		          messageContent: content
		        })
		      })
		      .then(r => {
		        if (!r.ok) { // request가 성공했는가?
		          throw new Error('메시지 전송 실패'); // 새 error 객체를 생성하고 throw 함. 현재 메서드 멈춤.
		        }
		        return r.json();
		      })
		      .then(data => {
		        alert('메시지가 전송되었습니다!');
		        $('#newMessageModal').modal('hide');
		        $('#receiverId').val('');
		        $('#messageContent').val('');
		        
		        // 옵션: 목록 새로고침
		        // loadMessageList();  // 나중에 구현
		      })
		      .catch(error => {
		        alert('전송 중 오류가 발생했습니다: ' + error.message);
		        console.error(error);
		      });
		    });
			
		})
		
	</script>
</body>
</html>
