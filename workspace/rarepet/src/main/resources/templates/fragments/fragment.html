<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

	<!-- 공통 header -->
	<div th:fragment="header">
		<!-- NAVBAR -->
		<nav
			class="navbar navbar-expand-lg navbar-light bg-white shadow-sm fixed-top">
			<div class="container">
				<a class="navbar-brand fw-bold d-flex align-items-center"
					th:href="@{/home}"> <img th:src="@{/img/AnyZooLogo.png}"
					alt="AnyZoo Logo" width="35" height="35"
					class="d-inline-block align-top me-2"> <span>AnyZoo</span>
				</a>
				<button class="navbar-toggler" type="button"
					data-bs-toggle="collapse" data-bs-target="#navbarNav">
					<span class="navbar-toggler-icon"></span>
				</button>

				<div class="collapse navbar-collapse justify-content-end"
					id="navbarNav">
					<ul class="navbar-nav">
						<li class="nav-item"><a class="nav-link" th:href="@{/market}">마켓</a></li>
						<li class="nav-item" th:if="${session.loginuser}"><a
							class="nav-link" th:href="@{/market/register}">판매등록</a></li>
						<li class="nav-item" th:unless="${session.loginuser}"><a
							class="nav-link" href="/auth/login">판매등록</a></li>
						<li class="nav-item"><a class="nav-link"
							href="/board/boardlist">게시판</a></li>
						<li class="nav-item"><a class="nav-link" th:href="@{#}">리뷰</a></li>

						<li class="nav-item" th:if="${session.loginuser}"><a class="nav-link"
							data-bs-toggle="modal" data-bs-target="#chatListModal"> 메시지 </a>
						</li>
						<li class="nav-item" th:unless="${session.loginuser}"><a class="nav-link"
							th:href="@{/auth/login}"> 메시지 </a>
						</li>
						<li class="nav-item" th:if="${session.loginuser}"><a class="nav-link" th:href="@{/mypage}">마이페이지</a></li>
						<li class="nav-item" th:if="${session.loginuser != null}"><a class="nav-link" th:href="@{/auth/logout}">로그아웃</a></li>
						<li class="nav-item" th:if="${session.loginuser == null}"><a class="nav-link" th:href="@{/auth/login}">로그인</a></li>

					</ul>
				</div>
			</div>
		</nav>
	</div>

	<!-- 공통 footer -->
	<div th:fragment="footer">
		<footer class="text-center py-4 bg-light"> © 2026 AnyZoo </footer>
	</div>

	<!-- 메시지 목록 모달 -->
	<div th:fragment="message">

		<div class="modal fade" id="chatListModal" tabindex="-1"
			aria-labelledby="chatListModalLabel" aria-hidden="true">
			<div class="modal-dialog modal-xl modal-dialog-scrollable">
				<div class="modal-content">
					<div class="modal-header">
						<h5 class="modal-title" id="chatListModalLabel">메시지</h5>
						<button type="button" class="btn-close" data-bs-dismiss="modal"
							aria-label="Close"></button>
					</div>

					<div class="modal-body">
						<!-- 메시지 목록 테이블 -->
						<div class="table-responsive">
							<table class="table table-hover align-middle">
								<thead class="table-light">
									<tr>
										<th>아이디</th>
										<th>보낸 시각</th>
										<th>받은 시각</th>
									</tr>
								</thead>
								<tbody id="messageListBody">

									<!-- 메시지 목록 여기에 -->

								</tbody>
							</table>
						</div>
					</div>

					<div class="modal-footer">
						<button type="button" class="btn btn-outline-primary"
							data-bs-toggle="modal" data-bs-target="#newMessageModal">
							새 메시지 보내기</button>
						<button type="button" class="btn btn-secondary"
							data-bs-dismiss="modal">닫기</button>
					</div>
				</div>
			</div>
		</div>

		<!-- 2. 채팅 상세 모달 (또는 같은 모달 내 영역으로 처리) -->
		<div class="modal fade" id="chatDetailModal" tabindex="-1"
			aria-labelledby="chatDetailModalLabel" aria-hidden="true">
			<div class="modal-dialog modal-lg modal-dialog-scrollable">
				<div class="modal-content">
					<div class="modal-header">
						<button type="button" class="btn btn-outline-secondary me-3"
							id="btnBackToList">← 목록으로</button>
						<h5 class="modal-title" id="chatPartnerTitle">대화 상대</h5>
						<button type="button" class="btn-close" data-bs-dismiss="modal"
							aria-label="Close"></button>
					</div>

					<div class="modal-body" style="background: #f8f9fa;">
						<!-- 채팅 메시지 영역 -->
						<div id="chatMessages"
							style="min-height: 300px; max-height: 500px; overflow-y: auto; padding: 15px;">
							<!-- 메시지 상세 여기에 -->
						</div>
					</div>

					<div class="modal-footer">
						<div class="input-group">
							<input type="text" class="form-control"
								placeholder="메시지를 입력하세요..." id="chatInput">
							<button class="btn btn-primary" type="button" id="btnSendInChat">전송</button>
						</div>
					</div>
				</div>
			</div>
		</div>

		<!-- 3. 새 메시지 모달 -->
		<div class="modal fade" id="newMessageModal" tabindex="-1"
			aria-labelledby="newMessageModalLabel" aria-hidden="true">
			<div class="modal-dialog">
				<div class="modal-content">
					<div class="modal-header">
						<h5 class="modal-title" id="newMessageModalLabel">새 메시지</h5>
						<button type="button" class="btn-close" data-bs-dismiss="modal"
							aria-label="Close"></button>
					</div>
					<div class="modal-body">
						<div class="mb-3">
							<label for="receiverId" class="form-label">받는 사람 아이디 </label> <input
								type="text" class="form-control" id="receiverId"
								placeholder="아이디를 입력하세요" required>
						</div>
						<div class="mb-3">
							<label for="messageContent" class="form-label">메시지 내용</label>
							<textarea class="form-control" id="messageContent" rows="5"
								placeholder="메시지를 입력하세요..." required></textarea>
						</div>
					</div>
					<div class="modal-footer">
						<button type="button" class="btn btn-secondary"
							data-bs-dismiss="modal">취소</button>
						<button type="button" class="btn btn-primary">보내기</button>
					</div>
				</div>
			</div>
		</div>
	</div>

	<!-- 메시지 스크립트 -->
	<script th:fragment="message_script">
		
		$( () => {
			
			 // 새 메시지 보내기 모달 버튼
			$('#newMessageModal .btn-primary').on('click', () => {
		      
		    	const receiver = $('#receiverId').val().trim();
		    	const content = $('#messageContent').val().trim();

		      if (!receiver) {
		        alert('받는 사람을 입력하세요');
		        return;
		      }
		      if (!content) {
			        alert('메시지 내용을 입력하세요');
			        return;
			  }
		      
		      fetch("/messages", {method:"post", 
		    	  				  headers:{"Content-Type":"application/json"},
		      					  body: JSON.stringify({
		      							receiverId: receiver,
		      							messageContent: content
		      						})
		      }).then(response => response.text())
		    	.then(data => {
		    		if(data == "success"){
			    		alert("메시지 보내기 완료.");
		    		} else if (data == "failure"){
		    			alert("존재하지 않는 회원...")
		    		}
		    	})		      
		    });
			 
			// 보낸 사람별로 메시지 목록 불러오기
			
			$("#chatListModal").on("shown.bs.modal", () => {
				
				fetch("/messages/list").then(response => response.json())
				.then(messages => {
					$("#messageListBody").empty();
					
					messages.forEach( (message) => {
						$("#messageListBody").append(
							`
							<tr class="message-row" data-sender-id="${message.senderId}" data-receiver-id="${message.receiverId}" >
								<td>${message.senderId}</td>
								<td>${message.sentAt}</td>
								<td>${message.receivedAt}</td>
							</tr>
							`);
					});
				});
				
			})
			
			 
			// 메시지 클릭 → 채팅 상세 모달 열기
		    $(document).on('click', '.message-row', function () { // $(".message-row").on("click") -> 작동하지 않음
		    	
		    	const receiverId = $(this).data("receiver-id")
		    	const senderId = $(this).data("sender-id")
		    	
		    	fetch(`/messages/detail?receiverId=${receiverId}&senderId=${senderId}`)
		    	.then(response => response.json())
		    	.then(data => {
		    		
		    		$("#chatMessages").empty();
		    		
		    		data.forEach(message => {
		    			
		    			let myId = receiverId;
		    			let isMe = (myId === message.senderId);
		    			
		    			$("#chatMessages").append(
		    			`
		    			<div class="d-flex ${isMe?'justify-content-end':'justify-content-start'} mb-3">
				          <div class="p-3 rounded ${isMe?'bg-primary':'bg-white'} ${isMe?'text-white':'border'} shadow-sm" style="max-width: 70%;">
				            ${message.messageContent}
				            <div class="small ${isMe?'text-white-50':'text-muted'} mt-1">${message.sentAt}</div>
				          </div>
				        </div>
		    			`		
		    			)
		    		});
		    		
		    	})
		    	
		    	
		    	
		      const partnerId   = $(this).data('sender-id');
		      const partnerName = $(this).data('sender-id') || '대화 상대';

		      $('#chatPartnerTitle').text(partnerId + ' 님과의 대화');

		      
		      // 채팅 모달 열기
		      $('#chatListModal').modal('hide');
		      $('#chatDetailModal').modal('show');
		    });

		    // 뒤로 가기 버튼
		    $('#btnBackToList').on('click', function() {
		      $('#chatDetailModal').modal('hide');
		      $('#chatListModal').modal('show');
		    });

		    // 채팅창 내 전송 버튼 (임시)
		    $('#btnSendInChat').on('click', function() {
		      const text = $('#chatInput').val().trim();
		      if (!text) return;

		      const newMsg = `
		        <div class="d-flex justify-content-end mb-3">
		          <div class="p-3 rounded bg-primary text-white shadow-sm" style="max-width: 70%;">
		            ${text}
		            <div class="small text-white-50 mt-1">방금</div>
		          </div>
		        </div>
		      `;
		      $('#chatMessages').append(newMsg);
		      $('#chatInput').val('');
		      $('#chatMessages')[0].scrollTop = $('#chatMessages')[0].scrollHeight;
		    });

		    // Enter 키로도 전송
		    $('#chatInput').on('keypress', function(e) {
		      if (e.which === 13 && !e.shiftKey) {
		        e.preventDefault();
		        $('#btnSendInChat').click();
		      }
		    });
			

			
		})
		
	</script>
</body>
</html>
