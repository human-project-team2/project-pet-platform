<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>주문 완료 | AnyZoo Marketplace</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: #fdf6ee;
            padding-top: 80px;
        }

        .success-card {
            border-radius: 20px;
            border: none;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            background: white;
            text-align: center;
            padding: 50px 30px;
        }

        .success-icon {
            font-size: 60px;
            color: #28a745;
        }

        .btn-main {
            border-radius: 30px;
            padding: 12px 25px;
            font-weight: 600;
        }

        .btn-home {
            background-color: #e76f51;
            color: white;
        }

        .btn-home:hover {
            background-color: #cf5d42;
        }
    </style>
</head>

<body>

<!-- Header -->
<div th:replace="~{fragments/fragment :: header}"></div>

<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-lg-6">

            <div class="card success-card">

                <!-- ✅ Icon -->
                <div class="success-icon mb-4">
                    ✔
                </div>

                <!-- ✅ Title -->
                <h3 class="fw-bold mb-3">주문이 완료되었습니다!</h3>

                <!-- ✅ Order Info -->
                <p class="text-muted mb-2">
                    주문번호: <strong th:text="${order.orderNo}">123456</strong>
                </p>

                <p class="text-muted mb-4">
                    결제가 정상적으로 처리되었습니다.
                </p>

                <!-- ✅ Total Price -->
                <h5 class="fw-bold mb-4">
                    총 결제 금액:
                    <span class="text-danger"
                          th:text="|₩${#numbers.formatInteger(order.totalPrice, 0, 'COMMA')}|">
                        ₩0
                    </span>
                </h5>

                <!-- ✅ Buttons -->
                <div class="d-flex justify-content-center gap-3">
                    <a href="/" class="btn btn-home btn-main">
                        홈으로 이동
                    </a>

                    <a th:href="@{/order/history}" class="btn btn-outline-secondary btn-main">
                        주문 내역 보기
                    </a>
                </div>

            </div>

        </div>
    </div>
</div>

<!-- Footer -->
<div th:replace="~{fragments/fragment :: footer}"></div>

</body>
</html>
