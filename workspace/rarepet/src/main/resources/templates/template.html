<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AnyZoo Marketplace</title>

<!-- Bootstrap JS -->
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- Bootstrap 5 CSS -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
	rel="stylesheet">

<!-- Google Font -->
<link
	href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap"
	rel="stylesheet">

<style>
body {
	font-family: 'Noto Sans KR', sans-serif;
	background: #fdf6ee;
}

/* Hero */
.hero {
	background: linear-gradient(rgba(230, 180, 150, 0.45),
		rgba(245, 210, 185, 0.55)),
		url("https://images.unsplash.com/photo-1508672019048-805c876b67e2?auto=format&fit=crop&w=1600&q=80");
	background-size: cover;
	background-position: center;
	height: 60vh;
}

.hero-box {
	background: rgba(255, 250, 245, 0.92);
	border-radius: 30px;
}

/* Card */
.card {
	border: none;
	border-radius: 20px;
}

.card img {
	height: 200px;
	object-fit: cover;
	border-radius: 20px 20px 0 0;
}

.heart {
	position: absolute;
	top: 15px;
	right: 15px;
	font-size: 22px;
	cursor: pointer;
	color: #ccc;
}

.heart.active {
	color: #e76f51;
}

.review-section {
	background:
		url("https://images.unsplash.com/photo-1518717758536-85ae29035b6d?auto=format&fit=crop&w=1600&q=80");
	background-size: cover;
	background-position: center;
}

.review-overlay {
	background: rgba(90, 60, 50, 0.75);
	border-radius: 25px;
}
</style>
</head>

<body>

	<!-- NAVBAR -->
	<div th:replace="fragments/fragment :: header"></div>

	<div th:replace="fragments/fragment :: message"></div>
	<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>	
	<script th:replace="fragments/fragment :: message_script"></script>
	

	<script>
	
		$( () => {
			
			function toggleHeart(el) {
				el.classList.toggle("active");
			}
			
		})
		
	</script>

</body>
</html>
