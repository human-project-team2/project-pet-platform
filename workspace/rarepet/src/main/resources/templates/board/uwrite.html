<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AnyZoo | 동영상 게시글 쓰기</title>

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
	rel="stylesheet">
<link
	href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Jua&display=swap"
	rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" th:href="@{/css/floating-chat.css}">

<style>
body {
	font-family: 'Noto Sans KR', sans-serif;
	background: #fdf6ee;
	padding-top: 80px;
}

.register-container {
	max-width: 900px;
	background: white;
	border-radius: 30px;
	padding: 30px;
	box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
}

.form-label {
	font-weight: 600;
	color: #5a3c32;
}

/* 유튜브 미리보기 영역 */
.video-upload-wrapper {
	display: flex;
	gap: 15px;
	flex-wrap: wrap;
	margin-bottom: 10px;
}

.video-preview {
	position: relative;
	width: 100%;
	max-width: 520px;
	height: 300px;
	border: 2px dashed #ddd;
	border-radius: 20px;
	display: flex;
	align-items: center;
	justify-content: center;
	overflow: hidden;
	background: #fafafa;
	color: #888;
	flex-direction: column;
	text-align: center;
	padding: 12px;
}

@media (max-width: 576px) {
	.video-preview {
		height: 230px;
	}
}

.video-preview iframe {
	width: 100%;
	height: 100%;
	border: none;
	border-radius: 18px;
}

.preview-placeholder {
	display: flex;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	gap: 10px;
	color: #8a6d63;
	font-size: 0.95rem;
}

.remove-btn {
	position: absolute;
	top: 8px;
	right: 8px;
	background: rgba(231, 111, 81, 0.95);
	color: white;
	border: none;
	border-radius: 50%;
	width: 32px;
	height: 32px;
	font-size: 16px;
	cursor: pointer;
	z-index: 10;
	display: none;
	align-items: center;
	justify-content: center;
}

.upload-guide {
	font-size: 0.95rem;
	color: #8a6d63;
	margin-top: 8px;
	line-height: 1.5;
}

input[name="title"], textarea[name="content"] {
	font-family: 'Jua', sans-serif !important;
	color: #5a3c32;
}

.btn-submit {
	background-color: #ffc107;
	border: none;
	padding: 15px;
	border-radius: 15px;
	font-weight: bold;
	color: #5a3c32;
	width: 100%;
	transition: all 0.2s;
}

.btn-submit:hover {
	background-color: #e6ae06;
	transform: translateY(-2px);
}

.btn-upload {
	background: #fff3cd;
	border: 1px solid #ffe08a;
	color: #5a3c32;
	border-radius: 12px;
	padding: 10px 16px;
	font-weight: 600;
}

.btn-upload:hover {
	background: #ffe69c;
}

.btn-remove-link {
	background: #f8d7da;
	border: 1px solid #f1aeb5;
	color: #842029;
	border-radius: 12px;
	padding: 10px 16px;
	font-weight: 600;
}

.btn-remove-link:hover {
	background: #f1b7bf;
}

/* 에러 피드백 */
.is-invalid {
	border-color: #e76f51 !important;
	box-shadow: 0 0 0 0.25rem rgba(231, 111, 81, 0.25) !important;
}

.error-msg {
	color: #e76f51;
	font-size: 0.85rem;
	margin-top: 5px;
	display: none;
}

.url-text {
	word-break: break-all;
	font-size: 0.9rem;
	color: #6b4f45;
	margin-top: 10px;
	display: none;
	background: #fff8e1;
	padding: 10px 12px;
	border-radius: 12px;
	border: 1px solid #ffe08a;
}
</style>
</head>
<body>

	<div th:replace="fragments/fragment :: header"></div>

	<div class="container my-4">
		<div class="register-container mx-auto">
			<h3 class="fw-bold mb-4 text-center">🎬 동영상 게시글 쓰기</h3>

			<form action="/board/uwrite" method="post" id="videoBoardForm">
			  <div class="row g-3">
			  
				<div class="col-12 col-md-8">
					<label class="form-label">제목</label> <input type="text"
						class="form-control form-control-lg" name="boardTitle" id="boardTitle">
					<div class="error-msg">글 제목을 작성하세요!</div>
				</div>					
				<div class="col-12 col-md-8">
					<th:block th:if="${user != null}">
					<label class="form-label">글쓴이</label> <input type="text"
						class="form-control form-control-lg"
						th:value="${user.id}" readonly="readonly" style="background-color: #f8f9fa;" 
						name="boardWriterId" id="boardWriterId">
					<div class="error-msg">작성자</div>
					</th:block>
				</div>

				<div class="mb-3">
					<label class="form-label">유튜브 영상 첨부</label>

					<div class="video-upload-wrapper">
						<div class="video-preview" id="videoPreviewBox">
							<button type="button" class="remove-btn" id="removeVideoBtn" title="삭제">
								<i class="bi bi-x-lg"></i>
							</button>

							<div class="preview-placeholder" id="previewPlaceholder">
								<i class="bi bi-youtube" style="font-size: 2.8rem; color: #dc3545;"></i>
								<div>아직 첨부된 유튜브 영상이 없습니다.</div>
								<div>아래 버튼을 눌러 유튜브 전체 링크를 입력하세요.</div>
							</div>

							<iframe id="youtubePreview" src="" allowfullscreen style="display:none;"></iframe>
						</div>
					</div>

					<div class="d-flex gap-2 flex-wrap mt-2">
						<button type="button"
								class="btn btn-upload"
								data-bs-toggle="modal"
								data-bs-target="#youtubeModal">
							<i class="bi bi-plus-circle"></i> 유튜브 링크 첨부
						</button>

						<button type="button" class="btn btn-remove-link" id="removeLinkTextBtn" style="display:none;">
							<i class="bi bi-trash"></i> 첨부 삭제
						</button>
					</div>

					<input type="hidden" id="videoUrl" name="videoUrl">

					<div class="url-text" id="savedUrlText"></div>
					<div class="upload-guide">
						예시: <br>
						https://www.youtube.com/watch?v=25aiG5qg-CU&list=PLVZJ4OQIe9iNE4un9yGkU4woca3HO5IjR
						<br><br>
						※ 유튜브 전체 링크 1개만 첨부할 수 있습니다.
					</div>
				</div>
				<div class="col-12">
					<label class="form-label">글내용</label>
					<textarea class="form-control" id="boardContent" name="boardContent"
						rows="5" maxlength="1000"></textarea>
					<div class="error-msg">내용을 입력해주세요!</div>
				</div>
			  </div>

				<div class="mt-5 row g-2">
					<div class="col-6 col-md-3">
						<button type="button" class="btn btn-outline-secondary w-100 p-3"
							onclick="history.back();">취소</button>
					</div>
					<div class="col-6 col-md-9">
						<button type="submit" class="btn btn-submit">등록하기</button>
					</div>
				</div>
			</form>
		</div>
	</div>

	<!-- 유튜브 링크 입력 모달 -->
	<div class="modal fade" id="youtubeModal" tabindex="-1" aria-labelledby="youtubeModalLabel" aria-hidden="true">
		<div class="modal-dialog modal-dialog-centered">
			<div class="modal-content" style="border-radius: 20px;">
				<div class="modal-header">
					<h5 class="modal-title fw-bold" id="youtubeModalLabel">유튜브 링크 첨부</h5>
					<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="닫기"></button>
				</div>
				<div class="modal-body">
					<label for="youtubeUrlInput" class="form-label">유튜브 전체 링크</label>
					<input type="text"
						   class="form-control"
						   id="youtubeUrlInput"
						   placeholder="https://www.youtube.com/watch?v=...">
					<div class="error-msg" id="youtubeErrorMsg">올바른 유튜브 링크를 입력해주세요.</div>
				</div>
				<div class="modal-footer">
					<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
					<button type="button" class="btn btn-warning" id="applyYoutubeUrlBtn">첨부하기</button>
				</div>
			</div>
		</div>
	</div>

	<div th:replace="fragments/fragment :: footer"></div>
	<div th:replace="fragments/fragment :: message"></div>

	<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
	<script th:replace="fragments/fragment :: message_script"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

	<script>
		const youtubeUrlInput = document.getElementById("youtubeUrlInput");
		const applyYoutubeUrlBtn = document.getElementById("applyYoutubeUrlBtn");
		const youtubeErrorMsg = document.getElementById("youtubeErrorMsg");
		const youtubePreview = document.getElementById("youtubePreview");
		const previewPlaceholder = document.getElementById("previewPlaceholder");
		const removeVideoBtn = document.getElementById("removeVideoBtn");
		const removeLinkTextBtn = document.getElementById("removeLinkTextBtn");
		const savedUrlText = document.getElementById("savedUrlText");
		const videoUrl = document.getElementById("videoUrl");
		const form = document.getElementById("videoBoardForm");

		function extractYoutubeVideoId(url) {
			if (!url) return null;

			url = url.trim();

			// watch?v=VIDEO_ID
			let match = url.match(/[?&]v=([^&#]+)/);
			if (match && match[1]) return match[1];

			// youtu.be/VIDEO_ID
			match = url.match(/youtu\.be\/([^?&#/]+)/);
			if (match && match[1]) return match[1];

			// youtube.com/embed/VIDEO_ID
			match = url.match(/youtube\.com\/embed\/([^?&#/]+)/);
			if (match && match[1]) return match[1];

			// youtube.com/shorts/VIDEO_ID
			match = url.match(/youtube\.com\/shorts\/([^?&#/]+)/);
			if (match && match[1]) return match[1];

			return null;
		}

		function makeYoutubeEmbedUrl(url) {
			const videoId = extractYoutubeVideoId(url);
			if (!videoId) return null;
			return "https://www.youtube.com/embed/" + videoId;
		}

		function showYoutubePreview(url) {
			const embedUrl = makeYoutubeEmbedUrl(url);

			if (!embedUrl) {
				youtubeUrlInput.classList.add("is-invalid");
				youtubeErrorMsg.style.display = "block";
				return false;
			}

			youtubeUrlInput.classList.remove("is-invalid");
			youtubeErrorMsg.style.display = "none";

			videoUrl.value = url;
			youtubePreview.src = embedUrl;
			youtubePreview.style.display = "block";
			previewPlaceholder.style.display = "none";
			removeVideoBtn.style.display = "flex";
			removeLinkTextBtn.style.display = "inline-block";
			savedUrlText.style.display = "block";
			savedUrlText.textContent = "첨부된 링크: " + url;

			return true;
		}

		function clearYoutubePreview() {
			videoUrl.value = "";
			youtubePreview.src = "";
			youtubePreview.style.display = "none";
			previewPlaceholder.style.display = "flex";
			removeVideoBtn.style.display = "none";
			removeLinkTextBtn.style.display = "none";
			savedUrlText.style.display = "none";
			savedUrlText.textContent = "";
			youtubeUrlInput.value = "";
			youtubeUrlInput.classList.remove("is-invalid");
			youtubeErrorMsg.style.display = "none";
		}

		applyYoutubeUrlBtn.addEventListener("click", function() {
			const url = youtubeUrlInput.value;
			const ok = showYoutubePreview(url);

			if (ok) {
				const modalElement = document.getElementById("youtubeModal");
				const modalInstance = bootstrap.Modal.getInstance(modalElement);
				if (modalInstance) {
					modalInstance.hide();
				}
			}
		});

		removeVideoBtn.addEventListener("click", clearYoutubePreview);
		removeLinkTextBtn.addEventListener("click", clearYoutubePreview);

		form.addEventListener("submit", function(e) {
			const url = videoUrl.value.trim();

			// 유튜브 첨부를 필수로 하고 싶으면 아래 주석 해제
			/*
			if (!url) {
				e.preventDefault();
				alert("유튜브 링크를 첨부해주세요.");
				return;
			}
			*/

			if (url && !makeYoutubeEmbedUrl(url)) {
				e.preventDefault();
				alert("올바른 유튜브 링크를 첨부해주세요.");
			}
		});
	</script>
</body>
</html>
