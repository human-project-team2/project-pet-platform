<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AnyZoo | 동영상 게시글 쓰기</title>

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
	rel="stylesheet">
<link
	href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Jua&display=swap"
	rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<link rel="stylesheet" th:href="@{/css/floating-chat.css}">

<style>
body {
	font-family: 'Noto Sans KR', sans-serif;
	background: #fdf6ee;
	padding-top: 80px;
}

.register-container {
	max-width: 900px;
	background: white;
	border-radius: 30px;
	padding: 30px;
	box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
}

.form-label {
	font-weight: 600;
	color: #5a3c32;
}

/* 동영상 업로드 영역 */
.video-upload-wrapper {
	display: flex;
	gap: 15px;
	flex-wrap: wrap;
	margin-bottom: 10px;
}

.video-preview {
	position: relative;
	width: 320px;
	height: 220px;
	border: 2px dashed #ddd;
	border-radius: 20px;
	display: flex;
	align-items: center;
	justify-content: center;
	overflow: hidden;
	background: #fafafa;
	cursor: pointer;
	color: #888;
	flex-direction: column;
	text-align: center;
	padding: 10px;
}

@media (max-width: 576px) {
	.video-preview {
		width: 100%;
		height: 220px;
	}
}

.video-preview video {
	width: 100%;
	height: 100%;
	object-fit: cover;
	border-radius: 18px;
}

.remove-btn {
	position: absolute;
	top: 8px;
	right: 8px;
	background: rgba(231, 111, 81, 0.9);
	color: white;
	border: none;
	border-radius: 50%;
	width: 28px;
	height: 28px;
	font-size: 14px;
	cursor: pointer;
	z-index: 5;
	display: flex;
	align-items: center;
	justify-content: center;
}

.upload-guide {
	font-size: 0.95rem;
	color: #8a6d63;
	margin-top: 8px;
}

/* 입력창 및 버튼 */
input[name="title"], textarea[name="content"] {
	font-family: 'Jua', sans-serif !important;
	color: #5a3c32;
}

.btn-submit {
	background-color: #ffc107;
	border: none;
	padding: 15px;
	border-radius: 15px;
	font-weight: bold;
	color: #5a3c32;
	width: 100%;
	transition: all 0.2s;
}

.btn-submit:hover {
	background-color: #e6ae06;
	transform: translateY(-2px);
}

.btn-upload {
	background: #fff3cd;
	border: 1px solid #ffe08a;
	color: #5a3c32;
	border-radius: 12px;
	padding: 10px 16px;
	font-weight: 600;
}

.btn-upload:hover {
	background: #ffe69c;
}

/* 에러 피드백 */
.is-invalid {
	border-color: #e76f51 !important;
	box-shadow: 0 0 0 0.25rem rgba(231, 111, 81, 0.25) !important;
}

.error-msg {
	color: #e76f51;
	font-size: 0.85rem;
	margin-top: 5px;
	display: none;
}
</style>
</head>
<body>

	<div th:replace="fragments/fragment :: header"></div>

	<div class="container my-4">
		<div class="register-container mx-auto">
			<h3 class="fw-bold mb-4 text-center">🎬 동영상 게시글 쓰기</h3>

			<form action="/board/vwrite" method="post" enctype="multipart/form-data">
			
				<div class="row g-3">

				<div class="col-12 col-md-8">
					<label class="form-label">제목</label> <input type="text"
						class="form-control form-control-lg" name="boardTitle" id="boardTitle">
					<div class="error-msg">글 제목을 작성하세요!</div>
				</div>					
				<div class="col-12 col-md-8">
					<th:block th:if="${user != null}">
					<label class="form-label">글쓴이</label> <input type="text"
						class="form-control form-control-lg"
						th:value="${user.id}" readonly="readonly" style="background-color: #f8f9fa;" 
						name="boardWriterId" id="boardWriterId">
					<div class="error-msg">작성자</div>
					</th:block>
				</div>

				<div class="mb-3">
					<label class="form-label">동영상 첨부 (1개)</label>

					<div class="video-upload-wrapper">
						<div id="videoPreviewBox" class="video-preview">
							<i class="bi bi-camera-reels fs-1 mb-2"></i>
							<div>첨부된 동영상이 없습니다</div>
						</div>
					</div>

					<input
						type="file"
						id="videoInput"
						name="videoFile"
						accept="video/*"
						style="display:none;">

					<button type="button" id="btnVideoUpload" class="btn btn-upload mt-2">
						<i class="bi bi-upload"></i> 동영상 선택
					</button>

					<div class="upload-guide">
						동영상은 1개만 첨부할 수 있습니다.
					</div>
				</div>
				
					<div class="col-12">
						<label class="form-label">글내용</label>
						<textarea class="form-control" id="boardContent" name="boardContent"
							rows="5" maxlength="1000"></textarea>
						<div class="error-msg">내용을 입력해주세요!</div>
					</div>
				</div>

				<div class="mt-5 row g-2">
					<div class="col-6 col-md-3">
						<button type="button" class="btn btn-outline-secondary w-100 p-3"
							onclick="history.back();">취소</button>
					</div>
					<div class="col-6 col-md-9">
						<button type="submit" class="btn btn-submit">등록하기</button>
					</div>
				</div>
			
			</form>
		</div>
	</div>

	<div th:replace="fragments/fragment :: footer"></div>
	<div th:replace="fragments/fragment :: message"></div>

	<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
	<script th:replace="fragments/fragment :: message_script"></script>

	<script>
	$(function() {
		const $videoInput = $('#videoInput');
		const $videoPreviewBox = $('#videoPreviewBox');
		const previewDefault = `
			<i class="bi bi-camera-reels fs-1 mb-2"></i>
			<div>첨부된 동영상이 없습니다</div>
		`;

		// 업로드 버튼 클릭 시 숨겨진 파일 선택창 열기
		$('#btnVideoUpload').on('click', function() {
			$videoInput.click();
		});

		// 동영상 선택 시 미리보기 표시
		$videoInput.on('change', function() {
			const file = this.files[0];

			if (!file) return;

			// 동영상 파일인지 검사
			if (!file.type.startsWith('video/')) {
				alert('동영상 파일만 첨부할 수 있습니다.');
				$videoInput.val('');
				$videoPreviewBox.html(previewDefault);
				return;
			}

			const videoUrl = URL.createObjectURL(file);

			$videoPreviewBox.html(`
				<button type="button" class="remove-btn" id="removeVideoBtn">
					<i class="bi bi-x"></i>
				</button>
				<video controls>
					<source src="${videoUrl}" type="${file.type}">
					브라우저가 video 태그를 지원하지 않습니다.
				</video>
			`);
		});

		// 첨부된 동영상 삭제
		$(document).on('click', '#removeVideoBtn', function(e) {
			e.stopPropagation();
			$videoInput.val('');
			$videoPreviewBox.html(previewDefault);
		});
	});
	</script>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
