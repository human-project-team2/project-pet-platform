<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AnyZoo Marketplace</title>

<!-- Bootstrap 5 CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- Bootstrap CSS & Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">

<style>
body{
    font-family:'Noto Sans KR',sans-serif;
    background:#fdf6ee;
}

/* Hero */
.hero{
    background:
    linear-gradient(rgba(230,180,150,0.45), rgba(245,210,185,0.55)),
    url("https://images.unsplash.com/photo-1508672019048-805c876b67e2?auto=format&fit=crop&w=1600&q=80");
    background-size:cover;
    background-position:center;
    height:60vh;
}

.hero-box{
    background:rgba(255,250,245,0.92);
    border-radius:30px;
}

/* Card */
.card{
    border:none;
    border-radius:20px;
}

.card img{
    height:200px;
    object-fit:cover;
    border-radius:20px 20px 0 0;
}

.heart{
    position:absolute;
    top:15px;
    right:15px;
    font-size:22px;
    cursor:pointer;
    color:#ccc;
}

.heart.active{color:#e76f51;}

.review-section{
    background:url("https://images.unsplash.com/photo-1518717758536-85ae29035b6d?auto=format&fit=crop&w=1600&q=80");
    background-size:cover;
    background-position:center;
}

.review-overlay{
    background:rgba(90,60,50,0.75);
    border-radius:25px;
}
</style>
</head>

<body>

<!-- NAVBAR -->
<div th:replace="fragments/fragment :: header"></div>

<br><br>

<div class="container my-5">
		
		<div class="mb-3">
		    <a th:href="@{/board/qnalist}" 
		       class="btn btn-outline-secondary rounded-pill px-4">
		        ← 목록으로 돌아가기
		    </a>		    
		</div>		
		
		<h3 class="fw-bold" th:text="${board.boardId}"></h3>        
        <h3 class="fw-bold">AnyZoooo 분양받은 아이가 잠만 자요. 괜찮은가요?</h3>
        <div class="text-muted small">작성자</div>
		<div class="mb-4">			
			<p class="text-muted" th:text="${board.boardWriterId}" ></p>
		</div>
		<div class="mb-4">			
			<p class="text-muted" th:text="${board.boardWriteDate}" ></p>
		</div>
		
		<div class="mb-3">
			<span class="badge bg-secondary mb-2">답변 대기</span>
		</div>
		
		<!-- Title -->
		<div class="mb-4">			
			<p class="text-muted" th:text="${board.boardTitle}" ></p>
		</div>

		<div class="row g-5">

			<!-- LEFT : Image -->
			<div class="col-lg-6">
				<div class="card shadow">
				<!-- 
					<img
						th:src="@{${product.imgUrl}}"
						class="card-img-top">
						 -->
				</div>
			</div>

			<!-- RIGHT : Basic Info -->
			<div class="col-lg-6">
				<div class="card shadow p-4">
<!-- 
					<div class="price-badge mb-3" th:text="|₩${board.boardContent}|" ></div>
 -->
					<ul class="list-unstyled mb-4">
						<li><strong>타입:</strong>
						<span th:text="${board.boardId}" ></span>
						</li>
						<!-- 
						<li><strong>성별:</strong></li>
						<li><strong>건강상태:</strong></li>
						<li><strong>접종여부:</strong></li>
						<li><strong>지역:</strong></li>
						 -->
					</ul>

				</div>
			</div>

		</div>
		
		<div id="mainContent">
	      <div class="container-fluid">
	    	  <div class="row">
	          <div class="col-md-12">
	            <div class="bgc-white p-20 bd">            
	            <div class="mT-30">
	            <div>
				  <button type="button" id="edit-btn" class="btn btn-primary btn-color btn-sm">수정</button>
				  <button type="button" id="delete-btn" class="btn btn-primary btn-color btn-sm">삭제</button>
				  <button type="button" id="to-list-btn" class="btn btn-primary btn-color btn-sm">목록</button>
				</div>			
	            </div> <!-- ### mT-30 ### -->           
	          </div> <!-- ### col-md-12 ### -->
	        </div> <!-- ### row ### -->        
	      </div> <!-- ### container-fluid ### --> 
	    </div> <!-- ### mainContent ### -->
	    
	    
	<!-- 답변 리스트 (작성자는 이 중 하나를 선택 가능) -->
    <div class="reply-list mt-5">
        <h5 class="fw-bold mb-4">등록된 답변</h5>
        <div class="card mb-3 border-warning">
            <div class="card-body">
                <div class="d-flex justify-content-between">
                    <h6 class="fw-bold">AnyZoo 업체 답변</h6>
                    <!-- 질문 작성자에게만 보이는 채택 버튼 -->
                    <button class="btn btn-sm btn-outline-warning">답변 채택하기</button>
                </div>
                <p class="mt-2">적응 기간에는 활동량이 줄어들 수 있습니다...</p>
            </div>
        </div>
    </div>
	    

	</div>
	<div th:replace="fragments/fragment :: message"></div>
	<div th:replace="fragments/fragment :: footer"></div>

	<!-- Bootstrap JS -->
	<script src="http://code.jquery.com/jquery-3.7.1.js"></script>    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>    
    <script th:inline='javascript'>
	document.addEventListener('DOMContentLoaded', function() {
		const btnDelete = document.querySelector('#delete-btn');
		if (btnDelete) {
			btnDelete.addEventListener('click', function(event) {
				const isOk = window.confirm('삭제할까요?');
				if (isOk) {
					location.href = 'deleteqna?boardId=' + [[${ board.boardId }]];
				}
			});	
		}
	});
		
	</script>
</body>
</html>
