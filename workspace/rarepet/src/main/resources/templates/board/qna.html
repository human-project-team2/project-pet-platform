<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AnyZoo - 문의 상세 보기</title>

<!-- Bootstrap 5 CSS & Icons -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">

<style>
    :root {
        --primary-color: #ff8e3c; /* AnyZoo 오렌지 */
        --bg-soft: #fdf6ee;
        --text-dark: #2d3436;
    }

    body {
        font-family: 'Noto Sans KR', sans-serif;
        background-color: var(--bg-soft);
        color: var(--text-dark);
    }

    /* 상세 페이지 메인 카드 */
    .detail-card {
        background: white;
        border-radius: 30px;
        border: none;
        box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        padding: 40px;
        margin-top: 20px;
    }

    /* 본문 영역 스타일 */
    .content-area {
        min-height: 300px;
        background: #fffcf9;
        border: 1px solid #f1f1f1;
        border-radius: 20px;
        padding: 30px;
        line-height: 1.8;
        white-space: pre-wrap; /* 줄바꿈 유지 */
        color: #444;
    }

    /* 버튼 스타일 */
    .btn-custom { border-radius: 50px; padding: 10px 25px; font-weight: 600; transition: 0.3s; }
    .btn-anyzoo { background-color: var(--primary-color); color: white; border: none; }
    .btn-anyzoo:hover { background-color: #e67e22; color: white; transform: translateY(-2px); }
    
    .btn-outline-anyzoo { border: 2px solid var(--primary-color); color: var(--primary-color); background: transparent; }
    .btn-outline-anyzoo:hover { background: var(--primary-color); color: white; }

    /* 답변 리스트 스타일 */
    .reply-card {
        border-radius: 20px;
        border: none;
        background: white;
        box-shadow: 0 5px 15px rgba(0,0,0,0.03);
        transition: 0.3s;
    }
    .reply-card.official { border-left: 5px solid var(--primary-color); }

    /* 모달 스타일 */
    .modal-content { border-radius: 30px; border: none; overflow: hidden; }
    .modal-header { background: var(--primary-color); color: white; border: none; padding: 25px; }
    .modal-body { padding: 35px; }
    .form-control { border-radius: 15px; padding: 15px; border: 1px solid #eee; background: #fdfdfd; }
    .form-control:focus { border-color: var(--primary-color); box-shadow: none; background: white; }
</style>
</head>

<body>

<!-- NAVBAR -->
<div th:replace="fragments/fragment :: header"></div>

<div class="container my-5" style="max-width: 900px;">

<br><br><br>
    
    <!-- 상단 네비게이션 -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <a th:href="@{/board/qnalist}" class="text-decoration-none text-muted fw-bold">
            <i class="bi bi-arrow-left-circle me-1"></i> 질문 목록으로
        </a>
        <span class="badge bg-success rounded-pill px-3 py-2">답변 완료</span>
    </div>

    <!-- Q&A 게시글 카드 -->
    <div class="detail-card mb-5">
        <div class="mb-2 text-primary fw-bold small text-uppercase">Question</div>
        <h2 class="fw-bold mb-4" th:text="${board.boardTitle}">제목이 이곳에 표시됩니다</h2>
        
        <div class="d-flex align-items-center mb-4 pb-4 border-bottom">
            <div class="flex-shrink-0">
                <div class="rounded-circle bg-light d-flex align-items-center justify-content-center" style="width:50px; height:50px;">
                    <i class="bi bi-person text-secondary fs-4"></i>
                </div>
            </div>
            <div class="ms-3">
                <div class="fw-bold" th:text="${board.boardWriterId}">작성자 ID</div>
                <div class="small text-muted" th:text="${board.boardWriteDate}">2024.05.20</div>
            </div>
        </div>

        <!-- 본문 내용 -->                 
        <div class="content-area mb-4" th:utext="${#strings.replace(board.boardContent, '\n', '<br>')}">
            질문 내용이 표시되는 영역입니다.
        </div>
        <div class="d-flex justify-content-between align-items-center">
            <div class="btn-group-area">
                <button type="button" id="edit-btn" class="btn btn-outline-secondary btn-custom me-2">수정</button>
                <button type="button" id="delete-btn" class="btn btn-outline-danger btn-custom">삭제</button>
            </div>
            <!-- 답변 작성 모달 트리거 -->
            <button type="button" class="btn btn-anyzoo btn-custom shadow" data-bs-toggle="modal" data-bs-target="#replyModal">
                <i class="bi bi-chat-dots-fill me-2"></i>답변 남기기
            </button>
        </div>
    </div>

    <!-- 답변 리스트 섹션 -->
    <div class="reply-section mt-5">
        <h5 class="fw-bold mb-4 px-2"><i class="bi bi-check2-circle me-2 text-success"></i>등록된 답변</h5>
        
        <!-- 답변 아이템 -->
        <div class="card reply-card official mb-4 shadow-sm">
            <div class="card-body p-4">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <div class="d-flex align-items-center">
                        <span class="badge bg-primary me-2">AnyZoo 업체</span>
                        <span class="fw-bold">운영팀 답변</span>
                    </div>
                    <button class="btn btn-sm btn-outline-warning rounded-pill px-3">베스트 채택</button>
                </div>
                <p class="mb-0 text-secondary" style="line-height: 1.7;">
                    적응 기간에는 아이들이 환경 변화에 민감하여 활동량이 잠시 줄어들 수 있습니다. 
                    식사량이 평소와 같다면 며칠 더 지켜보셔도 좋습니다.
                </p>
            </div>
        </div>
    </div>
</div>

<!-- [MODAL] 답변 작성 팝업 -->
<div class="modal fade" id="replyModal" tabindex="-1" aria-labelledby="replyModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content shadow-lg">
            <div class="modal-header">
                <h5 class="modal-title fw-bold" id="replyModalLabel">궁금증 해결해주기</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="replyForm" th:action="@{/board/qnareply}" method="post">
                    <input type="hidden" name="boardId" th:value="${board.boardId}">
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold">문의 제목</label>
                        <input type="text" class="form-control bg-light" th:value="${board.boardTitle}" readonly>
                    </div>
                    
                    <div class="mb-4">
                        <label class="form-label fw-bold">답변 내용</label>
                        <textarea class="form-control" name="replyContent" rows="6" placeholder="도움이 되는 따뜻한 답변을 남겨주세요."></textarea>
                    </div>
                    
                    <button type="submit" class="btn btn-anyzoo w-100 py-3 fw-bold shadow-sm">답변 등록하기</button>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- 기존 스크립트 구조 유지 -->
<script src="https://jquery.com"></script>    
<script src="https://jsdelivr.net"></script>    
<script th:inline='javascript'>
document.addEventListener('DOMContentLoaded', function() {
    // 삭제 버튼 로직
    const btnDelete = document.querySelector('#delete-btn');
    if (btnDelete) {
        btnDelete.addEventListener('click', function() {
            
                location.href = 'deleteqna?boardId=' + [[${ board.boardId }]];
            
        });	
    }

    // 수정 버튼 로직
    document.querySelector('#edit-btn')?.addEventListener('click', () => {
        location.href = 'editqna?boardId=' + [[${ board.boardId }]];
    });
});
</script>

</body>
</html>
