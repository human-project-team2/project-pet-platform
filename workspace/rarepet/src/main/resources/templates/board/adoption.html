<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AnyZoo Marketplace</title>

<!-- Bootstrap 5 CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">

<style>
body{
    font-family:'Noto Sans KR',sans-serif;
    background:#fdf6ee;
}

/* Hero */
.hero{
    background:
    linear-gradient(rgba(230,180,150,0.45), rgba(245,210,185,0.55)),
    url("https://images.unsplash.com/photo-1508672019048-805c876b67e2?auto=format&fit=crop&w=1600&q=80");
    background-size:cover;
    background-position:center;
    height:60vh;
}

.hero-box{
    background:rgba(255,250,245,0.92);
    border-radius:30px;
}

/* Card */
.card{
    border:none;
    border-radius:20px;
}

.card img{
    height:200px;
    object-fit:cover;
    border-radius:20px 20px 0 0;
}

.heart{
    position:absolute;
    top:15px;
    right:15px;
    font-size:22px;
    cursor:pointer;
    color:#ccc;
}

.heart.active{color:#e76f51;}

.review-section{
    background:url("https://images.unsplash.com/photo-1518717758536-85ae29035b6d?auto=format&fit=crop&w=1600&q=80");
    background-size:cover;
    background-position:center;
}

.review-overlay{
    background:rgba(90,60,50,0.75);
    border-radius:25px;
}
</style>
</head>

<body>

<!-- NAVBAR -->
<div th:replace="fragments/fragment :: header"></div>

<br><br>

<div class="container my-5">
		
		<div class="mb-3">
		    <a th:href="@{/board/adoptionlist}" 
		       class="btn btn-outline-secondary rounded-pill px-4">
		        ← 목록으로 돌아가기
		    </a>
		</div>
		
		<!-- #Main ============================ -->
		<div>
	      <div class="page-container">
	        <main class="main-content bgc-grey-100">
	          <div id="mainContent">
	            <div class="container-fluid">
	          	  <div class="row">
	                <div class="col-md-12">
	                  <div class="bgc-white p-20 bd">
	                  <h6 class="c-grey-900">게시글 내용</h6>
	                  <div  class="mT-30">
	                      <div class="mb-3">
	                        <label class="form-label" for="title">제목</label>
	                        <input type="text" class="form-control" id="title" readonly th:value="${ board.boardTitle }">
	                      </div>
	                      <div class="mb-3">
	                        <label class="form-label" for="writer">작성자(email)</label>
	                        <input type="text" class="form-control" id="writer" readonly th:value="${ board.boardWriterId }">
	                      </div>                      
	                      <div class="mb-3">
	                        <label class="form-label" for="content">글내용</label>
	                        <textarea id="content" class="form-control" rows="10" readonly th:text='${ #strings.replace(board.boardContent, "\n", "<br>") }'></textarea>
	                      </div>                      
	                  </div>
	                </div>
	                </div>
	              </div>
	             </div>
	          </div>
	        </main>        
	      </div>      
	    </div>
		
		<!-- 
        <h3 class="fw-bold">우리집 강아지를 분양합니다</h3>
        <div class="text-muted small">작성자</div>
		<div class="mb-4">			
			<p class="text-muted" th:text="${board.boardWriterId}" ></p>
		</div>
		<div class="mb-4">			
			<p class="text-muted" th:text="${board.boardWriteDate}" ></p>
		</div>
		 -->
        <div class="mb-3">
			<span class="badge bg-secondary mb-2">답변 대기</span>
		</div>		
		
		<div id="mainContent">
	      <div class="container-fluid">
	    	  <div class="row">
	          <div class="col-md-12">
	            <div class="bgc-white p-20 bd">            
	            <div class="mT-30">
	            <div>
				  <button type="button" id="edit-btn" class="btn btn-primary btn-color btn-sm">수정</button>
				  <button type="button" id="delete-btn" class="btn btn-primary btn-color btn-sm">삭제</button>
				  <button type="button" id="to-list-btn" class="btn btn-primary btn-color btn-sm">목록</button>
				</div>			
	            </div> <!-- ### mT-30 ### -->           
	          </div> <!-- ### col-md-12 ### -->
	        </div> <!-- ### row ### -->        
	      </div> <!-- ### container-fluid ### --> 
	    </div> <!-- ### mainContent ### -->
	    
	    <!-- 답변 리스트 (작성자는 이 중 하나를 선택 가능) -->
    	<div class="reply-list mt-5">
	        <h5 class="fw-bold mb-4">등록된 답변</h5>
	        <div class="card mb-3 border-warning">
	            <div class="card-body">
	                <div class="d-flex justify-content-between">
	                    <h6 class="fw-bold">신청자 답변</h6>
	                    <!-- 질문 작성자에게만 보이는 채택 버튼 -->
	                    <button class="btn btn-sm btn-outline-warning">답변 채택하기</button>
	                </div>
	                <p class="mt-2">분양 신청합니다.</p>
	            </div>
	        </div>
    	</div>

	</div>
	
	<!-- 분양 신청 양식 -->
	<div class="container main-container mt-5" style="max-width: 600px;">
	    <h3 class="fw-bold text-center mb-4">입양 신청서 작성</h3>
	    <div class="alert alert-info small">신청자의 아이디와 메시지가 분양 게시글 작성자에게 전달됩니다.</div>
	    
	    <form>
	        <div class="mb-3">
	            <label class="form-label">신청 동물 정보</label>
	            <input type="text" class="form-control" value="[포유류] 알비노 고슴도치" readonly>
	        </div>
	        <div class="mb-3">
	            <label class="form-label">보내는 메시지</label>
	            <textarea class="form-control" rows="5" placeholder="분양 희망 이유나 환경 등을 적어주세요."></textarea>
	        </div>
	        <button type="submit" class="btn btn-warning w-100 fw-bold py-3">입양 신청하기</button>
	    </form>
	</div>

	<div th:replace="fragments/fragment :: message"></div>
	<div th:replace="fragments/fragment :: footer"></div>
	
	<script src="http://code.jquery.com/jquery-3.7.1.js"></script>    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>    
    <script th:inline='javascript'>
	document.addEventListener('DOMContentLoaded', function() {
		const btnDelete = document.querySelector('#delete-btn');
		if (btnDelete) {
			btnDelete.addEventListener('click', function(event) {
				const isOk = window.confirm('삭제할까요?');
				if (isOk) {
					location.href = 'deleteado?boardId=' + [[${ board.boardId }]];
				}
			});	
		}
	});
	
	</script>
</body>
</html>
