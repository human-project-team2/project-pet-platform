<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AnyZoo - 분양 상세 보기</title>

<!-- Bootstrap 5 CSS & Icons -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">

<style>
    :root {
        --primary-color: #ff8e3c; /* AnyZoo 시그니처 오렌지 */
        --bg-soft: #fdf6ee;
        --text-dark: #2d3436;
    }

    body {
        font-family: 'Noto Sans KR', sans-serif;
        background-color: var(--bg-soft);
        color: var(--text-dark);
    }

    /* 상세 페이지 메인 카드 */
    .detail-card {
        background: white;
        border-radius: 30px;
        border: none;
        box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        padding: 40px;
        margin-top: 20px;
    }

    .content-area {
        min-height: 250px;
        background: #f9f9f9;
        border-radius: 20px;
        padding: 25px;
        line-height: 1.8;
        white-space: pre-wrap; /* 줄바꿈 유지 */
    }

    /* 버튼 스타일 커스텀 */
    .btn-custom { border-radius: 50px; padding: 10px 25px; font-weight: 600; transition: 0.3s; }
    .btn-anyzoo { background-color: var(--primary-color); color: white; border: none; }
    .btn-anyzoo:hover { background-color: #e67e22; color: white; transform: translateY(-2px); }
    
    .btn-outline-anyzoo { border: 2px solid var(--primary-color); color: var(--primary-color); background: transparent; }
    .btn-outline-anyzoo:hover { background: var(--primary-color); color: white; }

    /* 답변 리스트 스타일 */
    .reply-card {
        border-radius: 20px;
        border: 1px solid rgba(255, 142, 60, 0.2);
        background: #fff;
        transition: 0.3s;
    }
    .reply-card:hover { border-color: var(--primary-color); }

    /* 모달 스타일 */
    .modal-content { border-radius: 30px; border: none; overflow: hidden; }
    .modal-header { background: var(--primary-color); color: white; border: none; padding: 25px; }
    .modal-body { padding: 35px; }
    .form-control { border-radius: 12px; padding: 12px; border: 1px solid #eee; }
</style>
</head>

<body>

<!-- NAVBAR -->
<div th:replace="fragments/fragment :: header"></div>

<br><br><br>

<div class="container my-5" style="max-width: 900px;">
    
    <!-- 상단 네비게이션 -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <a th:href="@{/board/adoptionlist}" class="text-decoration-none text-muted fw-bold">
            <i class="bi bi-arrow-left-circle me-1"></i> 목록으로 돌아가기
        </a>
        <div>
            <span class="badge bg-warning text-dark rounded-pill px-3 py-2">답변 대기</span>
        </div>
    </div>

    <!-- 메인 게시글 카드 -->
    <div class="detail-card mb-5">
        <h6 class="text-muted mb-2">분양 게시글 상세</h6>
        <h2 class="fw-bold mb-4" th:text="${board.boardTitle}">제목을 불러오는 중...</h2>
        
        <div class="d-flex align-items-center mb-4 pb-4 border-bottom">
            <div class="flex-shrink-0">
                <i class="bi bi-person-circle fs-1 text-secondary"></i>
            </div>
            <div class="ms-3">
                <div class="fw-bold" th:text="${board.boardWriterId}">작성자 아이디</div>
                <div class="small text-muted" th:text="${#dates.format(board.boardWriteDate, 'yyyy-MM-dd')}">2024-05-20 · 조회 450</div>
            </div>
        </div>
        <div class="content-area mb-4" style=width:700px>            
			<div class="card shadow">
				<img
					th:src="@{${board.imgUrl}}"
					class="card-img-top">
			</div>
		</div>
        <div class="content-area mb-4" th:text="${board.boardContent}">
            게시글 내용이 여기에 표시됩니다.
        </div>

        <div class="d-flex justify-content-between align-items-center">
            <div class="btn-group-area">
                <button type="button" id="edit-btn" class="btn btn-outline-secondary btn-custom me-2">수정</button>
                <button type="button" id="delete-btn" class="btn btn-outline-danger btn-custom">삭제</button>
            </div>
            <!-- 입양 신청 모달 트리거 버튼 -->
            <button type="button" class="btn btn-anyzoo btn-custom shadow" data-bs-toggle="modal" data-bs-target="#adoptionModal">
                <i class="bi bi-heart-fill me-2"></i>입양 신청하기
            </button>
        </div>
    </div>

    <!-- 등록된 답변 섹션 -->
    <div class="reply-section mt-5">
        <h5 class="fw-bold mb-4 px-2"><i class="bi bi-chat-left-dots me-2"></i>등록된 답변</h5>
        
        <!-- 답변 아이템 (예시) -->
        <div class="card reply-card mb-3 shadow-sm">
            <div class="card-body p-4">
                <div class="d-flex justify-content-between align-items-start mb-3">
                    <div>
                        <span class="fw-bold text-primary">신청자 A</span>
                        <small class="text-muted ms-2">1시간 전</small>
                    </div>
                    <button class="btn btn-sm btn-outline-warning rounded-pill px-3">답변 채택</button>
                </div>
                <p class="mb-0 text-secondary">안녕하세요! 꼭 분양받고 싶어서 신청 남깁니다. 환경은 준비되어 있습니다.</p>
            </div>
        </div>
    </div>
</div>

<!-- [MODAL] 입양 신청서 팝업 -->
<div class="modal fade" id="adoptionModal" tabindex="-1" aria-labelledby="adoptionModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content shadow-lg">
            <div class="modal-header">
                <h5 class="modal-title fw-bold" id="adoptionModalLabel">입양 신청서 작성</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="alert alert-info border-0 rounded-4 small mb-4">
                    <i class="bi bi-info-circle me-2"></i>작성하신 정보는 작성자에게만 안전하게 전달됩니다.
                </div>
                <form id="applyForm">
                    <div class="mb-3">
                        <label class="form-label fw-bold">신청 동물 정보</label>
                        <input type="text" class="form-control bg-light" value="[포유류] 알비노 고슴도치" readonly>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-bold">보내는 메시지</label>
                        <textarea class="form-control" rows="5" placeholder="분양 희망 이유나 아이가 살게 될 환경 등을 자세히 적어주시면 채택 확률이 높아져요!"></textarea>
                    </div>
                    <button type="submit" class="btn btn-anyzoo w-100 py-3 fw-bold">신청서 제출하기</button>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- 기존 스크립트 유지 -->
<script src="http://code.jquery.com/jquery-3.7.1.js"></script>    
<!-- <script src="https://jsdelivr.net"></script>     -->
<script th:inline='javascript'>
document.addEventListener('DOMContentLoaded', function() {
    // 삭제 버튼 로직
    const btnDelete = document.querySelector('#delete-btn');
    if (btnDelete) {
        btnDelete.addEventListener('click', function() {
            
                location.href = 'deleteado?boardId=' + [[${ board.boardId }]];
            
        });	
    }

    // 수정 및 목록 버튼
    //document.querySelector('#edit-btn')?.addEventListener('click', () => {
        //location.href = 'editado?boardId=' + [[${ board.boardId }]];
    //});
    
    const btnEdit = document.querySelector('#edit-btn');
	if (btnEdit) {
		btnEdit.addEventListener('click', function(event) {
			location.href = 'adoedit?boardId=' + [[${ board.boardId }]];
		});	
	}
	
});
</script>

</body>
</html>
