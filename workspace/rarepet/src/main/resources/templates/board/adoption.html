<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AnyZoo Marketplace</title>

<!-- Bootstrap 5 CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">

<style>
body{
    font-family:'Noto Sans KR',sans-serif;
    background:#fdf6ee;
}

/* Hero */
.hero{
    background:
    linear-gradient(rgba(230,180,150,0.45), rgba(245,210,185,0.55)),
    url("https://images.unsplash.com/photo-1508672019048-805c876b67e2?auto=format&fit=crop&w=1600&q=80");
    background-size:cover;
    background-position:center;
    height:60vh;
}

.hero-box{
    background:rgba(255,250,245,0.92);
    border-radius:30px;
}

/* Card */
.card{
    border:none;
    border-radius:20px;
}

.card img{
    height:200px;
    object-fit:cover;
    border-radius:20px 20px 0 0;
}

.heart{
    position:absolute;
    top:15px;
    right:15px;
    font-size:22px;
    cursor:pointer;
    color:#ccc;
}

.heart.active{color:#e76f51;}

.review-section{
    background:url("https://images.unsplash.com/photo-1518717758536-85ae29035b6d?auto=format&fit=crop&w=1600&q=80");
    background-size:cover;
    background-position:center;
}

.review-overlay{
    background:rgba(90,60,50,0.75);
    border-radius:25px;
}
</style>
</head>

<body>

<!-- NAVBAR -->
<div th:replace="fragments/fragment :: header"></div>

<br><br><br><br><br><br>

<!-- 분양 신청 양식 -->
<div class="container main-container mt-5" style="max-width: 600px;">
    <h3 class="fw-bold text-center mb-4">분양 신청서 작성</h3>
    <div class="alert alert-info small">신청자의 아이디와 메시지가 분양 게시글 작성자에게 전달됩니다.</div>
    
    <form>
        <div class="mb-3">
            <label class="form-label">신청 동물 정보</label>
            <input type="text" class="form-control" value="[포유류] 알비노 고슴도치" readonly>
        </div>
        <div class="mb-3">
            <label class="form-label">보내는 메시지</label>
            <textarea class="form-control" rows="5" placeholder="분양 희망 이유나 환경 등을 적어주세요."></textarea>
        </div>
        <button type="submit" class="btn btn-warning w-100 fw-bold py-3">분양 신청하기</button>
    </form>
</div>

</body>
</html>
