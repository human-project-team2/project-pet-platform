<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AnyZoo | 게시글 쓰기</title>

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
	rel="stylesheet">
<link
	href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Jua&display=swap"
	rel="stylesheet">
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<style>
body {
	font-family: 'Noto Sans KR', sans-serif;
	background: #fdf6ee;
	padding-top: 80px;
}

.register-container {
	max-width: 900px;
	background: white;
	border-radius: 30px;
	padding: 30px;
	box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
}

.form-label {
	font-weight: 600;
	color: #5a3c32;
}

/* 이미지 업로드 영역 */
.image-upload-wrapper {
	display: flex;
	gap: 15px;
	flex-wrap: wrap;
	margin-bottom: 10px;
}

.image-preview {
	position: relative;
	width: 140px;
	height: 140px;
	border: 2px dashed #ddd;
	border-radius: 20px;
	display: flex;
	align-items: center;
	justify-content: center;
	overflow: hidden;
	background: #fafafa;
	cursor: pointer;
}

@media ( max-width : 576px) {
	.image-preview {
		width: 100px;
		height: 100px;
	}
}

.image-preview img {
	width: 100%;
	height: 100%;
	object-fit: cover;
}

.remove-btn {
	position: absolute;
	top: 8px;
	right: 8px;
	background: rgba(231, 111, 81, 0.9);
	color: white;
	border: none;
	border-radius: 50%;
	width: 24px;
	height: 24px;
	font-size: 12px;
	cursor: pointer;
	z-index: 5;
	display: flex;
	align-items: center;
	justify-content: center;
}

/* 모달 내 이미지 그리드 스타일 */
.summary-img-box {
	position: relative;
	width: 100px;
	height: 100px;
	border-radius: 12px;
	overflow: hidden;
	border: 1px solid #ddd;
}

.summary-img-box img {
	width: 100%;
	height: 100%;
	object-fit: cover;
}

.more-overlay {
	position: absolute;
	top: 0;
	left: 0;
	width: 100%;
	height: 100%;
	background: rgba(0, 0, 0, 0.5);
	color: white;
	display: flex;
	align-items: center;
	justify-content: center;
	font-size: 1.2rem;
	font-weight: bold;
	backdrop-filter: blur(2px);
}

/* 입력창 및 버튼 */
input[name="title"], textarea[name="content"], #priceDisplay {
	font-family: 'Jua', sans-serif !important;
	color: #5a3c32;
}

.btn-submit {
	background-color: #ffc107;
	border: none;
	padding: 15px;
	border-radius: 15px;
	font-weight: bold;
	color: #5a3c32;
	width: 100%;
	transition: all 0.2s;
}

.btn-submit:hover {
	background-color: #e6ae06;
	transform: translateY(-2px);
}

/* 에러 피드백 */
.is-invalid {
	border-color: #e76f51 !important;
	box-shadow: 0 0 0 0.25rem rgba(231, 111, 81, 0.25) !important;
}

.error-msg {
	color: #e76f51;
	font-size: 0.85rem;
	margin-top: 5px;
	display: none;
}
</style>
</head>
<body>

	<div th:replace="fragments/fragment :: header"></div>

	<div class="container my-4">
		<div class="register-container mx-auto">
			<h3 class="fw-bold mb-4 text-center">🐾 QnA 쓰기</h3>

			<form action="/board/qwrite" method="post"
				enctype="multipart/form-data">				

				<div class="row g-3">
					<div class="col-12 col-md-8">
						<label class="form-label">제목</label> <input type="text"
							class="form-control form-control-lg" name="boardTitle" id="boardTitle">
						<div class="error-msg">글 제목을 작성하세요!</div>
					</div>					
					<div class="col-12 col-md-8">
						<label class="form-label">글쓴이</label> <input type="text"
							class="form-control form-control-lg" name="boardWriterId" id="boardWriterId">
						<div class="error-msg">작성자</div>
					</div>
					<div class="col-12">
						<label class="form-label">글내용</label>
						<textarea class="form-control" id="boardContent" name="boardContent"
							rows="5" maxlength="1000"></textarea>
						<div class="error-msg">내용을 입력해주세요!</div>
					</div>
				</div>
				
				

				<div class="mt-5 row g-2">
					<div class="col-6 col-md-3">
						<button type="button" class="btn btn-outline-secondary w-100 p-3"
							onclick="history.back();">취소</button>
					</div>
					<div class="col-6 col-md-9">
						<button type="submit" class="btn btn-submit">등록하기</button>
					</div>
				</div>
			</form>
		</div>
	</div>

	<div class="modal fade" id="confirmModal" tabindex="-1"
		aria-hidden="true">
		<div class="modal-dialog modal-dialog-centered">
			<div class="modal-content"
				style="border-radius: 25px; border: none; overflow: hidden;">
				<div class="modal-header"
					style="background: #ffc107; color: #5a3c32; border: none;">
					<h5 class="modal-title fw-bold">🐾 등록 내용을 확인해주세요!</h5>
					<button type="button" class="btn-close" data-bs-dismiss="modal"
						aria-label="Close"></button>
				</div>
				<div class="modal-body p-4 text-center">
					<div id="modalImageGrid"
						class="mb-3 d-flex justify-content-center gap-2"
						style="cursor: pointer;"></div>
					<p class="text-muted small mb-3">그리드를 클릭하면 모든 사진을 볼 수 있습니다.</p>
					<div class="text-start">
						<div class="mb-2">
							<span class="text-muted small">상품명:</span>
							<p id="confirmTitle" class="fw-bold mb-0"></p>
						</div>
						<div class="mb-2">
							<span class="text-muted small">분양 가격:</span>
							<p id="confirmPrice" class="fw-bold mb-0 text-danger"
								style="font-size: 1.2rem;"></p>
						</div>
					</div>
				</div>
				<div class="modal-footer" style="border: none; background: #fafafa;">
					<button type="button" class="btn btn-outline-secondary px-4"
						data-bs-dismiss="modal">수정</button>
					<button type="button" id="finalSubmitBtn"
						class="btn btn-submit px-4" style="width: auto;">정말
						등록할게요!</button>
				</div>
			</div>
		</div>
	</div>

	<div class="modal fade" id="imageFullViewer" tabindex="-1"
		aria-hidden="true">
		<div class="modal-dialog modal-lg modal-dialog-centered">
			<div class="modal-content"
				style="background: rgba(0, 0, 0, 0.9); border: none; border-radius: 20px;">
				<div class="modal-body p-4 text-center">
					<div id="fullImageContainer"
						class="d-flex flex-wrap justify-content-center gap-3"></div>
					<button type="button" class="btn btn-light mt-4"
						data-bs-dismiss="modal">닫기</button>
				</div>
			</div>
		</div>
	</div>

<div th:replace="fragments/fragment :: footer"></div>
<div th:replace="fragments/fragment :: message"></div>
	<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>	
	<script th:replace="fragments/fragment :: message_script"></script>
	<script>
$(document).ready(function() {
    let selectedFiles = [];

    // 이미지 핸들링
    $('#btnUploadTrigger').on('click', () => $('#fileInput').click());
    $('#fileInput').on('change', function(e) {
        const files = Array.from(e.target.files);
        files.forEach(file => selectedFiles.push(file));
        $('#imageError').hide();
        updatePreview();
        syncFiles();
    });

    function updatePreview() {
        $('.preview-item').remove();
        selectedFiles.forEach((file, index) => {
            const reader = new FileReader();
            reader.onload = (e) => {
                $('#imageContainer').append(`<div class="image-preview preview-item"><img src="${e.target.result}"><button type="button" class="remove-btn" data-index="${index}">✕</button></div>`);
            };
            reader.readAsDataURL(file);
        });
    }

    $(document).on('click', '.remove-btn', function() {
        selectedFiles.splice($(this).data('index'), 1);
        updatePreview();
        syncFiles();
    });

    function syncFiles() {
        const dt = new DataTransfer();
        selectedFiles.forEach(f => dt.items.add(f));
        $('#fileInput')[0].files = dt.files;
    }

    // 카테고리 수량 애니메이션
    $('#categorySelect').on('change', function() {
        if ($(this).val() === '기타') $('#quantityWrapper').stop().slideDown(400);
        else $('#quantityWrapper').stop().slideUp(300, () => $('#productCount').val(1));
    });
    //수량 제한
   $('#productCount').on('input', function() {
    let val = $(this).val();
    let $el = $(this);
    let $error = $('#quantityError'); // ID로 직접 선택

    if (val === "") {
        $el.removeClass('is-invalid');
        $error.hide();
        return;
    }

    let num = parseInt(val);

    if (num > 9999) {
        $el.addClass('is-invalid'); // 빨간 테두리 부여
        $error.show();             // 안내 문구 출력
        $el.val(9999);             // 값 강제 보정
    } else if (num < 1) {
        $el.val(1);
        $el.removeClass('is-invalid');
        $error.hide();
    } else {
        // 정상 범위일 때 스타일 복구
        $el.removeClass('is-invalid');
        $error.hide();
    }
});

    // 가격 포맷팅
    $('#priceDisplay').on('input', function() {
        let raw = $(this).val().replace(/[^0-9]/g, '');
        if (Number(raw) > 1000000000) raw = "1000000000";
        $('#realPrice').val(raw);
        if (raw) {
            let fmt = raw.replace(/\B(?=(\d{3})+(?!\d))/g, ",");
            $(this).val(fmt + "원");
            this.setSelectionRange(fmt.length, fmt.length);
        } else $(this).val("");
        $(this).removeClass('is-invalid').parent().siblings('.error-msg').hide();
    });

    // 폼 제출 로직 (이미지 요약 그리드 포함)
    $('#registerForm').on('submit', async function(e) {
        e.preventDefault();
        let isValid = true;
        let firstErr = null;

        // 필수 항목 체크
        const checks = [ { el: $('#title'), val: $('#title').val().trim() }, { el: $('#priceDisplay'), val: $('#realPrice').val() }, { el: $('#content'), val: $('#content').val().trim() } ];
        checks.forEach(c => {
            if (!c.val) { c.el.addClass('is-invalid').parent().find('.error-msg').show(); c.el.siblings('.error-msg').show(); isValid = false; if (!firstErr) firstErr = c.el; }
        });
        if (selectedFiles.length === 0) { $('#imageError').show(); isValid = false; if (!firstErr) firstErr = $('#btnUploadTrigger'); }

        if (isValid) {
            $('#confirmTitle').text($('#title').val());
            $('#confirmPrice').text($('#priceDisplay').val());

            // 이미지 그리드 생성 (최대 3개 표시)
            let gridHtml = '';
            const displayLimit = 3;
            for (let i = 0; i < Math.min(selectedFiles.length, displayLimit); i++) {
                const src = await new Promise(r => { const reader = new FileReader(); reader.onload = e => r(e.target.result); reader.readAsDataURL(selectedFiles[i]); });
                let overlay = (i === 2 && selectedFiles.length > displayLimit) ? `<div class="more-overlay">+${selectedFiles.length - 2}</div>` : '';
                gridHtml += `<div class="summary-img-box"><img src="${src}">${overlay}</div>`;
            }
            $('#modalImageGrid').html(gridHtml);
            new bootstrap.Modal($('#confirmModal')).show();
        } else if (firstErr) firstErr.focus();
    });

    // 전체 사진 뷰어 호출
    $(document).on('click', '#modalImageGrid', async function() {
        let fullHtml = '';
        for (const file of selectedFiles) {
            const src = await new Promise(r => { const reader = new FileReader(); reader.onload = e => r(e.target.result); reader.readAsDataURL(file); });
            fullHtml += `<img src="${src}" style="width: 150px; height: 150px; object-fit: cover; border-radius: 10px; border: 2px solid white;">`;
        }
        $('#fullImageContainer').html(fullHtml);
        new bootstrap.Modal($('#imageFullViewer')).show();
    });

    $('#finalSubmitBtn').on('click', () => document.getElementById('registerForm').submit());
    
    // 에러 클래스 실시간 제거
    $(document).on('input', '.is-invalid', function() { $(this).removeClass('is-invalid').siblings('.error-msg').hide(); });
});
</script>

	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
