<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AnyZoo Marketplace</title>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<!-- Bootstrap 5 CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- Bootstrap CSS & Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>	
<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" th:href="@{/css/floating-chat.css}">
<style>
body{
    font-family:'Noto Sans KR',sans-serif;
    background:#fdf6ee;
}

/* Hero */
.hero{
    background:
    linear-gradient(rgba(230,180,150,0.45), rgba(245,210,185,0.55)),
    url("https://images.unsplash.com/photo-1508672019048-805c876b67e2?auto=format&fit=crop&w=1600&q=80");
    background-size:cover;
    background-position:center;
    height:60vh;
}

.hero-box{
    background:rgba(255,250,245,0.92);
    border-radius:30px;
}

/* Card */
.card{
    border:none;
    border-radius:20px;
}

.card img{
    height:200px;
    object-fit:cover;
    border-radius:20px 20px 0 0;
}

.heart{
    position:absolute;
    top:15px;
    right:15px;
    font-size:22px;
    cursor:pointer;
    color:#ccc;
}

.heart.active{color:#e76f51;}

.review-section{
    background:url("https://images.unsplash.com/photo-1518717758536-85ae29035b6d?auto=format&fit=crop&w=1600&q=80");
    background-size:cover;
    background-position:center;
}

.review-overlay{
    background:rgba(90,60,50,0.75);
    border-radius:25px;
}
</style>
</head>

<body>

<!-- NAVBAR -->
<div th:replace="fragments/fragment :: header"></div>

<br><br><br>

<div class="container main-container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold">커뮤니티 게시글</h2>
        <a th:href="@{/board/write}" class="text-decoration-none">
                	<strong>글쓰기</strong></a>
    </div>

    <!-- 검색 및 카테고리 (PDF 기능) -->
    <div class="row mb-4">
        <div class="col-md-3">
            <select class="form-select">
                <option>전체 카테고리</option>
                <option>포유류</option>
                <option>조류</option>
            </select>
        </div>
        <div class="col-md-6">
            <input type="text" class="form-control" placeholder="검색어를 입력하세요">
        </div>
        <div class="col-md-3">
            <button class="btn btn-outline-secondary w-100">검색</button>
        </div>
    </div>

	
    <table class="table table-hover">
      <thead>
      <tr>
        <th scope="col">글번호</th>
        <th scope="col">제목</th>
        <th scope="col">작성자</th>
        <th scope="col">작성일</th>
        <th scope="col">조회수</th>
        <th scope="col">좋아요</th>
      </tr>
      </thead>
      <tbody>
        <tr th:each="board, boardStat : ${boards}" style="height:30px">
          <th scope="row" th:text="${ board.boardId }"></th>
          <td>
            <a 	th:href="@{/board/detail(boardId=${board.boardId}) }"
                th:text="${ board.boardTitle }"></a>
                
            <span th:if="${boardStat.index == 0}" class="badge bg-danger ms-2">인기글</span>
          </td>
          <!-- 
          <td th:text="${ board.boardTitle }"></td>
          
          <td>
            <a 	th:href="@{/board/detail(pageNo=${pager.pageNo}, boardId=${board.boardId}) }"
                th:text="${ board.boardTitle }"></a>
          </td>
           -->                
          <td th:text="${ board.boardWriterId }"></td>
          <td th:text="${ board.boardWriteDate }"></td>
          <td th:text="${ board.boardViewCount }"></td>
		  <td>
		    <span class="text-danger">
		        <i class="bi bi-heart-fill"></i>
		    </span>
		    <span th:text="${ board.boardLikeCount }">0</span>
		  </td>
        </tr>
      </tbody>
    </table>
	
</div>

	<!-- PAGINATION -->
		<<nav aria-label="board pager">
          <ul class="pagination justify-content-center">
          <li class="page-item">	                            
                  <a th:if="${ pager.pageNo > 1}" class="page-link" th:href="@{/board/community(pageNo=1)}" aria-label="First">
                      <span aria-hidden="true">&laquo;</span>
                  </a>
                  <a th:if="${ pager.pageNo <= 1}" class="page-link" href="javascript:" aria-label="First">
                      <span aria-hidden="true">&laquo;</span>
                  </a>
          </li>
          <li class="page-item">
          
              <a th:if="${ pager.pageNo > 1}" class="page-link" th:href="@{/board/community(pageNo=${pager.pageNo - 1})}" aria-label="Previous">
              <span aria-hidden="true">&lt;</span>
              </a>
              <a th:if="${ pager.pageNo <= 1}"  class="page-link" href="javascript:" aria-label="Previous">
                  <span aria-hidden="true">&lt;</span>
              </a>
          </li>
          <li th:each="i : ${#numbers.sequence(pager.pageStart, (pageCnt < pager.pageEnd ? pager.pageCnt : pager.pageEnd))}" class="page-item">
          	
              <a class="page-link" th:href="@{/board/community(pageNo=${i})}" th:text="${i}"></a>
          </li>
          
          <li class="page-item">
              <a th:if="${ pager.pageNo < pager.pageCnt }" class="page-link" th:href="@{/board/community(pageNo=${pager.pageNo+1})}" aria-label="Next">
              <span aria-hidden="true">&gt;</span>
              </a>
              <a th:if="${ pager.pageNo >= pager.pageCnt }" class="page-link" href="javascript:" aria-label="Previous">
                  <span aria-hidden="true">&gt;</span>
              </a>
          </li>
          <li class="page-item">
              <a th:if="${ pager.pageNo < pager.pageCnt }" class="page-link" th:href="@{/board/community(pageNo=${pager.pageCnt})}" aria-label="Last">
              <span aria-hidden="true">&raquo;</span>
              </a>
              <a th:if="${ pager.pageNo >= pager.pageCnt }" class="page-link" href="javascript:" aria-label="Last">
                  <span aria-hidden="true">&raquo;</span>
              </a>
          </li>
          </ul>
      </nav>
	</div>

	
	<div th:replace="fragments/fragment :: footer"></div>
<div th:replace="fragments/fragment :: message"></div>
	
	<script th:replace="fragments/fragment :: message_script"></script>


</body>
</html>
