<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AnyZoo Marketplace</title>

<!-- Bootstrap 5 CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">

<style>
body{
    font-family:'Noto Sans KR',sans-serif;
    background:#fdf6ee;
}

/* Hero */
.hero{
    background:
    linear-gradient(rgba(230,180,150,0.45), rgba(245,210,185,0.55)),
    url("https://images.unsplash.com/photo-1508672019048-805c876b67e2?auto=format&fit=crop&w=1600&q=80");
    background-size:cover;
    background-position:center;
    height:60vh;
}

.hero-box{
    background:rgba(255,250,245,0.92);
    border-radius:30px;
}

/* Card */
.card{
    border:none;
    border-radius:20px;
}

.card img{
    height:200px;
    object-fit:cover;
    border-radius:20px 20px 0 0;
}

.heart{
    position:absolute;
    top:15px;
    right:15px;
    font-size:22px;
    cursor:pointer;
    color:#ccc;
}

.heart.active{color:#e76f51;}

.review-section{
    background:url("https://images.unsplash.com/photo-1518717758536-85ae29035b6d?auto=format&fit=crop&w=1600&q=80");
    background-size:cover;
    background-position:center;
}

.review-overlay{
    background:rgba(90,60,50,0.75);
    border-radius:25px;
}
</style>
</head>

<body>

<!-- NAVBAR -->
<div th:replace="fragments/fragment :: header"></div>

<br><br><br><br><br><br>

<div class="container main-container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold">커뮤니티 게시글</h2>
        <a th:href="@{/board/write}" class="text-decoration-none">
                	<strong>글쓰기</strong></a>
    </div>

    <!-- 검색 및 카테고리 (PDF 기능) -->
    <div class="row mb-4">
        <div class="col-md-3">
            <select class="form-select">
                <option>전체 카테고리</option>
                <option>포유류</option>
                <option>조류</option>
            </select>
        </div>
        <div class="col-md-6">
            <input type="text" class="form-control" placeholder="검색어를 입력하세요">
        </div>
        <div class="col-md-3">
            <button class="btn btn-outline-secondary w-100">검색</button>
        </div>
    </div>

	
    <!-- 게시글 리스트 (상단 10개는 인기글 정렬) -->
    <table class="table table-hover">
        <thead class="table-light">
            <tr>
                <th>번호</th>
                <th>제목</th>
                <th>작성자</th>
                <th>조회수</th>
                <th>추천</th>
            </tr>
        </thead>
        <tbody>
            <!-- [변경] 행 클릭 시 해당 ID의 상세 페이지로 이동 (cursor 스타일 추가) -->
            <!-- 인기 게시글 예시 (노란색 강조) -->
               
            <tr class="table-warning" style="cursor: pointer;">
                <td>BEST</td>
                <td>
                	<a th:href="@{/board/detail}" class="text-decoration-none">
                	<strong>우리집 고슴도치 먹방 영상입니다!</strong>
                </td>
                <td>도치맘</td>
                <td>1,240</td>
                <td>56</td>
            </tr>
            <!-- 일반 게시글 (최신순) -->
            <tr onclick="location.href='detail.html?id=124'" style="cursor: pointer;">
                <td>124</td>
                <td>초보 집사를 위한 가이드 공유해요</td>
                <td>애니멀러버</td>
                <td>450</td>
                <td>12</td>
            </tr>
        </tbody>
        <!-- 
        <tbody>                      
          <tr th:each="board: ${boards}" style="height:30px">
            <th scope="row" th:text="${ board.boardId }"></th>
            <td>
                <a 	th:href="@{/board/detail(pageNo=${pager.pageNo}, boardId=${board.boardId}) }"
                    th:text="${ board.title }"></a>
            </td>          
            
          </tr>
        </tbody>
         -->
        <!-- 
        <tbody>                      
          <tr th:each="board: ${boards}" style="height:30px">
            <th scope="row" th:text="${ board.boardId }"></th>
            <td>
                <a 	th:href="@{/board/detail(pageNo=${pager.pageNo}, boardId=${board.boardId}) }"
                    th:text="${ board.title }"></a>
            </td>
            <td th:text="${ board.writer.email }"></td>
            <td th:text="${ #dates.format(board.writeDate, 'yyyy-MM-dd') }"></td>
            <td th:text="${ board.readCount }"></td>
          </tr>
        </tbody>
         -->
        
    </table>
    
    <table class="table table-hover">
      <thead>
      <tr>
        <th scope="col">글번호</th>
        <th scope="col">제목</th>
        <th scope="col">작성자</th>
        <th scope="col">작성일</th>
        <th scope="col">조회수</th>
      </tr>
      </thead>
      <tbody>                      
        <tr th:each="board: ${boards}" style="height:30px">
          <th scope="row" th:text="${ board.boardId }"></th>
          <td>
            <a 	th:href="@{/board/detail(boardId=${board.boardId}) }"
                th:text="${ board.boardTitle }"></a>
          </td>
          <!-- 
          <td th:text="${ board.boardTitle }"></td>
          
          <td>
            <a 	th:href="@{/board/detail(pageNo=${pager.pageNo}, boardId=${board.boardId}) }"
                th:text="${ board.boardTitle }"></a>
          </td>
           -->                
          <td th:text="${ board.boardWriterId }"></td>
          <td th:text="${ board.boardWriteDate }"></td>
          <td th:text="${ board.boardViewCount }"></td>
        </tr>
      </tbody>
    </table>
    
</div>

	<!-- PAGINATION -->
		<div class="d-flex justify-content-center mt-5">
			<nav>
				<ul class="pagination pagination-lg">

					<!-- 이전 -->
					<li class="page-item disabled"><a
						class="page-link rounded-start-pill" href="#"> &laquo; </a></li>

					<!-- 페이지 번호 -->
					<li class="page-item active"><a class="page-link" href="#">1</a>
					</li>

					<li class="page-item"><a class="page-link" href="#">2</a></li>

					<li class="page-item"><a class="page-link" href="#">3</a></li>

					<li class="page-item"><a class="page-link" href="#">4</a></li>

					<li class="page-item"><a class="page-link" href="#">5</a></li>
					<!-- 다음 -->
					<li class="page-item"><a class="page-link rounded-end-pill"
						href="#"> &raquo; </a></li>
				</ul>
			</nav>
	</div>

	
	<div th:replace="fragments/fragment :: footer"></div>
<div th:replace="fragments/fragment :: message"></div>
	<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>	
	<script th:replace="fragments/fragment :: message_script"></script>


</body>
</html>
