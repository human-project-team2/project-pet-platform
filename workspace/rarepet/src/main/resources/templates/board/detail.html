<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AnyZoo Marketplace</title>

<!-- Bootstrap 5 CSS -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
	rel="stylesheet">
<!-- Bootstrap CSS & Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<!-- Google Font -->
<link
	href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap"
	rel="stylesheet">

<style>
body {
	font-family: 'Noto Sans KR', sans-serif;
	background: #fdf6ee;
	padding-top: 80px; /* adjust to navbar height */
}

/* Hero */
.hero {
	background: linear-gradient(rgba(230, 180, 150, 0.45),
		rgba(245, 210, 185, 0.55)),
		url("https://images.unsplash.com/photo-1508672019048-805c876b67e2?auto=format&fit=crop&w=1600&q=80");
	background-size: cover;
	background-position: center;
	height: 60vh;
}

.hero-box {
	background: rgba(255, 250, 245, 0.92);
	border-radius: 30px;
}

/* Card */
.card {
	border: none;
	border-radius: 20px;
}

.card img {
	height: 200px;
	object-fit: cover;
	border-radius: 20px 20px 0 0;
}

.heart {
	position: absolute;
	top: 15px;
	right: 15px;
	font-size: 22px;
	cursor: pointer;
	color: #ccc;
}

.heart.active {
	color: #e76f51;
}

.review-section {
	background:
		url("https://images.unsplash.com/photo-1518717758536-85ae29035b6d?auto=format&fit=crop&w=1600&q=80");
	background-size: cover;
	background-position: center;
}

.review-overlay {
	background: rgba(90, 60, 50, 0.75);
	border-radius: 25px;
}

.view-toggle .btn.active {
	background: #ffc107;
	border-color: #ffc107;
}

.price-badge {
	font-size: 18px;
	font-weight: 700;
	color: #dc3545;
}

.list-view .card {
	flex-direction: row;
	align-items: center;
}

.list-view .card img {
	width: 200px;
	height: 150px;
	object-fit: cover;
}
</style>

</head>

<body>

	<!-- NAVBAR -->
	<div th:replace="fragments/fragment :: header"></div>
	
	

	

	<div class="container my-5">
		
		<div class="mb-3">
		    <a th:href="@{/board/community}" 
		       class="btn btn-outline-secondary rounded-pill px-4">
		        ← 목록으로 돌아가기
		    </a>
		</div>

	<!-- #Main ============================ -->
	<div>
      <div class="page-container">
        <main class="main-content bgc-grey-100">
          <div id="mainContent">
            <div class="container-fluid">
          	  <div class="row">
                <div class="col-md-12">
                  <div class="bgc-white p-20 bd">
                  <h6 class="c-grey-900">게시글 내용</h6>
                  <div  class="mT-30">
                      <div class="mb-3">
                        <label class="form-label" for="title">제목</label>
                        <input type="text" class="form-control" id="title" readonly th:value="${ board.boardTitle }">
                      </div>
                      <div class="mb-3">
                        <label class="form-label" for="writer">작성자(email)</label>
                        <input type="text" class="form-control" id="writer" readonly th:value="${ board.boardWriterId }">
                      </div>                      
                      <div class="mb-3">
                        <label class="form-label" for="content">글내용</label>
                        <textarea id="content" class="form-control" rows="10" readonly th:text='${ #strings.replace(board.boardContent, "\n", "<br>") }'></textarea>
                      </div>        
		              <div>
					  <button type="button" id="edit-btn" class="btn btn-primary btn-color btn-sm">수정</button>
					  <button type="button" id="delete-btn" class="btn btn-primary btn-color btn-sm">삭제</button>
					  <button type="button" id="to-list-btn" class="btn btn-primary btn-color btn-sm">목록</button>
					  </div>                                        
                  </div>
                </div>
                </div>
              </div>              
              
              <!-- 댓글 쓰기 영역 시작 -->
              <!-- 
              <th:block th:if="${loggedIn}">
               -->
              <div class="row">
                <div class="col-md-12">
                  <div class="bgc-white p-20 bd">                  
                  <div class="mT-10">
                  
                    <th:block sec:authorize="isAuthenticated()">
                  	<form id="commentform" action="write-comment" method="post">
					  
					  <input type="hidden" name="boardId" th:value="${ board.boardId }" />
					  <input type="hidden" name="writer" th:value="${ board.boardWriterId }" /> 
					  
					  <!-- 
					  <input type="hidden" name="writer" th:value="${ session.loginuser.id }" />
					  <input type="hidden" name="pageNo" th:value="${ pageNo }" />
                      -->
                      
                      <div class="mb-3">
                        <label class="form-label" for="content">댓글내용</label>
                        <textarea id="comment_content" name="content" class="form-control" rows="5"></textarea>
                      </div>
                      <div>
	                    <button type="button" id="writecomment" class="btn btn-primary btn-color btn-sm">댓글쓰기</button>
                      </div>
					</form>
					</th:block>
					
					
					
                  </div>
                </div>
                </div>
              </div>
              <!--  댓글 쓰기 영역 끝 -->
              
              <!--  댓글 목록 영역 시작 -->
              <div class="row">
                <div class="col-md-12">
                  <div class="bgc-white p-20 bd">                  
                  <div id="comment-list" class="mT-10">
                  	
                  </div>
                </div>
                </div>
              </div>
              <!-- 댓글 목록 영역 끝 -->
              <!-- 
              </th:block>
               -->
             
             </div>
          </div>
        </main>        
      </div>      
    </div>
	
<!-- 
		<div class="row g-5">
			<div class="col-lg-6">
				<div class="card shadow">
					<img
						th:src="@{${product.imgUrl}}"
						class="card-img-top">
				</div>
			</div>
			<div class="col-lg-6">
				<div class="card shadow p-4">
					<div class="price-badge mb-3" th:text="|₩${board.boardContent}|" ></div>
					<ul class="list-unstyled mb-4">
						<li><strong>타입:</strong>
						<span th:text="${board.boardId}" ></span>
						</li>
					</ul>
				</div>
			</div>
		</div>
		 -->
		
	<!-- Modal -->
	
  
	<div class="modal fade" id="recomment-modal" 
		 data-bs-backdrop="static" data-bs-keyboard="false" 
		 tabindex="-1" aria-labelledby="recomment-modal-label" aria-hidden="true">
	  <div class="modal-dialog">
	    <div class="modal-content">
	      <div class="modal-header">
	        <h1 class="modal-title fs-5" id="recomment-modal-label">댓글 쓰기</h1>
	      </div>
	      <div class="modal-body">
	      
			<form id="recommentform" action="write-recomment" method="post">				
				<input type="hidden" name="writer" th:value="${ board.boardWriterId }" />				
				<input type="hidden" name="boardId" th:value="${ board.boardId }" />		
				<textarea class="form-control" name="content" rows="3" style="resize: none;"></textarea>             	
	        </form>
		  
	      </div>
	      <div class="modal-footer">
	        <button type="button" class="btn btn-secondary cancel-button" data-bs-dismiss="modal">취소</button>
	        <button type="button" class="btn btn-primary write-button">쓰기</button>
	      </div>
	    </div>
	  </div>
	</div>
  
	
	<div th:replace="fragments/fragment :: message"></div>
	<div th:replace="fragments/fragment :: footer"></div>

	<!-- Bootstrap JS -->
	
	<script th:replace="fragments/fragment :: message_script"></script>
	
	<script src="http://code.jquery.com/jquery-3.7.1.js"></script>    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>    
    <script th:inline='javascript'>
	document.addEventListener('DOMContentLoaded', function() {
		const btnDelete = document.querySelector('#delete-btn');
		if (btnDelete) {
			btnDelete.addEventListener('click', function(event) {
				const isOk = window.confirm('삭제할까요?');
				if (isOk) {
					location.href = 'delete?boardId=' + [[${ board.boardId }]];
				}
			});	
		}
		
		
		
		//////////////댓글추가/////////////////
		
		// # id="comment-list" 요소에 comment-list 요청 결과를 삽입 ( 비동기 )
		$('#comment-list').load('comment-list?boardId=' + [[${ board.boardId }]]);
		
		$('#writecomment').on('click', function(event) {
			alert('서버로 댓글 쓰기 요청');
			// $('#commentform').submit(); // form 객체의 submit 메서드는 form을 서버로 전송하는 명령 (동기 방식)
			
			/*
 			const boardNo = $('#commentform input[name=boardNo]').val();
			const writer = $('#commentform input[name=writer]').val();
			const content = $('#commentform textarea[name=content]').val();			
			*/
			
			const formData = $('#commentform').serialize(); //form 내부의 모든 입력 요소의 값을 전송 가능한 문자열 형식으로 반환
			// const formData = $('#commentform').serializeArray(); //form 내부의 모든 입력 요소의 값을 전송 가능한 객체 배열 형식으로 반환
						
			$.ajax({
				"url": "write-comment",
				"method": "post",
				"data": formData,
				"success": function(data, status, xhr) {
					if (data == "success") {
						alert('댓글을 등록했습니다.');
						$('#comment-list').load('comment-list?boardId=' + [[${ board.boardId }]]);
						$('#commentform textarea').val("");
					} else {
						alert('댓글을 실패');
					}
				},
				"error": function(xhr, status, err) {
					
				}
			});
		}); // end of writecomment.click event handler
		
		let currentEditCommentNo = null; // 현재 편집중인 댓글 번호 저장
		
		$('#comment-list').on('click', '.edit-comment', function(event) {
			event.preventDefault();
			
			if (currentEditCommentNo != null) {
				$('#comment-view-area-' + currentEditCommentNo).show();
				$('#comment-edit-area-' + currentEditCommentNo).hide();
			}
			
			var commentNo = $(this).data('comment-no'); // $(this) : 이벤트 발생 객체 (여기서는 <a class="edit-comment" ...>)
			
			$('#comment-view-area-' + commentNo).hide();
			$('#comment-edit-area-' + commentNo).show();
			
			currentEditCommentNo = commentNo
		});
		$('#comment-list').on('click', '.cancel-edit-comment', function(event) {
			event.preventDefault();
			
			var commentNo = $(this).data("comment-no"); // $(this) : 이벤트 발생 객체 (여기서는 <a class="cancel-edit-comment" ...>)
			const editForm = $('#comment-edit-area-' + commentNo + ' form');
			editForm[0].reset(); // editForm : jQuery 객체 , editForm[0] : javascript 객체
			
			$('#comment-view-area-' + commentNo).show();
			$('#comment-edit-area-' + commentNo).hide();
			
			currentEditCommentNo = null;
		});
		
		
		
		/////////////////////////////
		
		$('#recomment-modal .write-button').on('click', function(event) {
			
			if ( $('#recommentform textarea').val().length == 0 ) {
				alert('댓글을 작성하세요')
				return;
			}
			
			var formData = $('#recommentform').serialize();
			
			$.ajax({
				"url": "write-recomment",
				"method": "post",
				"data": formData,
				"success": function(data) {
					if (data == "success") {
						$('#comment-list').load('comment-list?boardId=' + [[${ board.boardId }]]);
						$('#recomment-modal').modal('hide');
					}
				},
				"error": function() {
					
				}
			});			
		
		});
	});
		
	</script>
</body>
</html>
