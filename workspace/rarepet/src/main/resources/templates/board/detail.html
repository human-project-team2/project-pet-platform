<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>게시글 상세</title>

<!-- Bootstrap 5 CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">

<style>
body{
    font-family:'Noto Sans KR',sans-serif;
    background:#fdf6ee;
}

/* Hero */
.hero{
    background:
    linear-gradient(rgba(230,180,150,0.45), rgba(245,210,185,0.55)),
    url("https://images.unsplash.com/photo-1508672019048-805c876b67e2?auto=format&fit=crop&w=1600&q=80");
    background-size:cover;
    background-position:center;
    height:60vh;
}

.hero-box{
    background:rgba(255,250,245,0.92);
    border-radius:30px;
}

/* Card */
.card{
    border:none;
    border-radius:20px;
}

.card img{
    height:200px;
    object-fit:cover;
    border-radius:20px 20px 0 0;
}

.heart{
    position:absolute;
    top:15px;
    right:15px;
    font-size:22px;
    cursor:pointer;
    color:#ccc;
}

.heart.active{color:#e76f51;}

.review-section{
    background:url("https://images.unsplash.com/photo-1518717758536-85ae29035b6d?auto=format&fit=crop&w=1600&q=80");
    background-size:cover;
    background-position:center;
}

.review-overlay{
    background:rgba(90,60,50,0.75);
    border-radius:25px;
}
</style>
</head>

<body>

<!-- NAVBAR -->
<div th:replace="fragments/fragment :: header"></div>

<br><br><br><br><br><br>

<div class="container">
        <div class="post-header">
            <h1 id="post-title">우리집 고슴도치 먹방 영상입니다!</h1>
        </div>
        <div class="post-meta">
            <span id="post-author">작성자: 도치맘</span>
            <span id="post-views">조회수: 1240</span>
        </div>

        <div class="post-content">
            <p>안녕하세요! 저희 집 고슴도치가 밀웜 먹는 영상입니다. 너무 귀엽죠?</p>
            <!-- 실제로는 여기에 이미지나 비디오가 들어갑니다. -->
            <p>궁금한 점 있으면 댓글로 물어봐 주세요!</p>
        </div>

        <div class="post-actions">
            <!-- 게시글 추천 기능 -->
            <button class="btn-like">추천 (56)</button>
            
            <!-- 작성자/관리자만 보이는 버튼 (프론트엔드에서는 숨김 처리) -->
            <!-- 실제로는 Spring Boot Controller에서 로그인된 사용자의 권한을 확인하여 노출 여부를 결정합니다. -->
            <button class="btn-edit" onclick="location.href='edit.html?id=1'">수정</button>
            <button class="btn-delete" onclick="alert('게시글을 삭제합니다. (관리자/작성자 권한 필요)');">삭제</button>
            
            <!-- 목록으로 이동 -->
            <button class="btn-list" onclick="location.href='list.html'">목록</button>
        </div>
    </div>
    
<!-- Bootstrap 5 JS (required for navbar toggle) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
