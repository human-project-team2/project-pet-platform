<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AnyZoo 커뮤니티 - 상세 보기</title>

<!-- Bootstrap 5 CSS & Icons -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" th:href="@{/css/floating-chat.css}">
<style>
    :root {
        --primary-color: #ff8e3c; /* AnyZoo 시그니처 오렌지 */
        --bg-soft: #fdf6ee; /* 따뜻한 배경색 */
        --text-dark: #2d3436;
    }

    body {
        font-family: 'Noto Sans KR', sans-serif;
        background-color: var(--bg-soft);
        color: var(--text-dark);
        padding-top: 20px;
    }

    /* 메인 컨테이너 카드 */
    .content-card {
        background: white;
        border-radius: 30px;
        border: none;
        box-shadow: 0 10px 40px rgba(0,0,0,0.05);
        padding: 40px;
        margin-bottom: 30px;
    }

    /* 본문 텍스트 영역 */
    .view-content {
        min-height: 300px;
        background: #fffcf9;
        border-radius: 20px;
        padding: 30px;
        line-height: 1.8;
        white-space: pre-wrap;
        color: #444;
        border: 1px solid #f1f1f1;
    }

    /* 라벨 및 입력창 스타일 */
    .form-label { font-weight: 700; color: #555; margin-bottom: 8px; }
    .form-control[readonly] { background-color: #f8f9fa; border: none; font-weight: 600; }
    .form-control:focus { border-color: var(--primary-color); box-shadow: none; }

    /* 버튼 스타일 커스텀 */
    .btn-anyzoo { background-color: var(--primary-color); color: white; border-radius: 50px; padding: 10px 25px; font-weight: 600; border: none; transition: 0.3s; }
    .btn-anyzoo:hover { background-color: #e67e22; color: white; transform: translateY(-2px); }
    
    .btn-outline-anyzoo { border: 2px solid var(--primary-color); color: var(--primary-color); border-radius: 50px; font-weight: 600; transition: 0.3s; }
    .btn-outline-anyzoo:hover { background: var(--primary-color); color: white; }

    /* 댓글 영역 스타일 */
    .comment-box {
        background: #fff;
        border-radius: 25px;
        padding: 30px;
        box-shadow: 0 5px 20px rgba(0,0,0,0.02);
    }
    .comment-input-wrapper {
        background: #fdfaf7;
        padding: 20px;
        border-radius: 20px;
        border: 1px solid #eee;
    }

    /* 댓글 리스트 아이템 */
    .comment-item {
        padding: 15px 0;
        border-bottom: 1px solid #f1f1f1;
    }
</style>
<script src="http://code.jquery.com/jquery-3.7.1.js"></script> 
</head>

<body>

<div th:replace="fragments/fragment :: header"></div>

<div class="container my-5 pt-4">
    <!-- 상단 네비게이션 -->
    <div class="mb-4 d-flex justify-content-between align-items-center">
        <a th:href="@{/board/community}" class="btn btn-outline-secondary rounded-pill px-4">
            <i class="bi bi-arrow-left me-1"></i> 목록으로 돌아가기
        </a>
    </div>
    
    <!-- [Main Content Card] -->
    <div class="content-card">
        <div class="d-flex justify-content-between align-items-end mb-4">
            <h4 class="fw-bold mb-0 text-primary"><i class="bi bi-file-text me-2"></i>게시글 상세</h4>
            <div class="small text-muted">AnyZoo Community</div>
        </div>
        
        <div class="row g-3">
            <div class="col-md-8">
                <label class="form-label">제목</label>
                <input type="text" class="form-control-plaintext fs-4 fw-bold border-bottom mb-3" readonly th:value="${board.boardTitle}">
            </div>            
            <div class="col-md-4">
                <label class="form-label text-muted">작성자</label>
                <div class="d-flex align-items-center">
                    <i class="bi bi-person-circle fs-5 me-2 text-secondary"></i>
                    <span class="fw-bold" th:text="${board.boardWriterId}">애니멀러버</span>
                </div>
            </div>
            <div class="col-12 mt-4" style=width:700px>            
				<div class="card shadow">
					<img
						th:src="@{${board.imgUrl}}"
						class="card-img-top">
				</div>
			</div>
            <div class="col-12 mt-4">
                <label class="form-label">글 내용</label>
                <div class="view-content shadow-sm" th:utext='${#strings.replace(board.boardContent, "\n", "<br>")}'>
                    내용이 표시되는 곳입니다.
                </div>
            </div>    
                    
        </div>
        <!-- 버튼 그룹 -->
        <div class="mt-5 d-flex justify-content-between border-top pt-4">
            <div>
                <button type="button" id="edit-btn" class="btn btn-outline-anyzoo px-4 me-2">수정하기</button>
                <button type="button" id="delete-btn" class="btn btn-outline-danger rounded-pill px-4">삭제</button>
            </div>
            <button type="button" id="to-list-btn" class="btn btn-dark rounded-pill px-4">목록보기</button>
        </div>
    </div>
    
    <!-- [Comment Section] -->
    <div class="comment-box">
        <h5 class="fw-bold mb-4"><i class="bi bi-chat-dots-fill text-primary me-2"></i>따뜻한 댓글</h5>

        <!-- 댓글 쓰기 (로그인 시 노출) -->
        <div class="comment-input-wrapper mb-5" sec:authorize="isAuthenticated()">
            <form id="commentform" action="write-comment" method="post">
                <input type="hidden" name="boardId" th:value="${board.boardId}" />
                <input type="hidden" name="writer" th:value="${board.boardWriterId}" />
                <div class="mb-3">
                    <textarea id="comment_content" name="content" class="form-control" rows="4" 
                              placeholder="서로를 배려하는 따뜻한 댓글을 남겨주세요."></textarea>
                </div>
                <div class="text-end">
                    <button type="button" id="writecomment" class="btn btn-anyzoo shadow-sm">댓글쓰기</button>
                </div>
            </form>
        </div>

        <!-- comment list area -->
        <div class="row">
          <div class="col-md-12">
            <div class="bgc-white p-20 bd">                  
            <div id="comment-list" class="mT-10">
            	1111
            </div>
          </div>
          </div>
        </div>
        <!-- end of comment list area -->
              
      </div>
</div>       
              

<!-- Modal -->
<div class="modal fade" id="recomment-modal" data-bs-backdrop="static" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content shadow-lg border-0 rounded-4">
            <div class="modal-header bg-primary text-white border-0 py-3">
                <h5 class="modal-title fw-bold">답글 달기</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-4">
                <form id="recommentform" action="write-recomment" method="post">				
                    <input type="hidden" name="writer" th:value="${board.boardWriterId}" />				
                    <input type="hidden" name="boardId" th:value="${board.boardId}" />		
                    <textarea class="form-control border-0 bg-light" name="content" rows="4" 
                              style="resize: none;" placeholder="답글 내용을 입력하세요."></textarea>             	
                </form>
            </div>
            <div class="modal-footer border-0 p-3">
                <button type="button" class="btn btn-light rounded-pill px-4 cancel-button" data-bs-dismiss="modal">취소</button>
                <button type="button" class="btn btn-primary rounded-pill px-4 write-button">답글 등록</button>
            </div>
        </div>
    </div>
</div>

<div th:replace="fragments/fragment :: footer"></div>
  
<!-- Scripts -->
   
<!-- <script src="https://jsdelivr.net"></script> -->
<script th:inline='javascript'>  
    
    document.addEventListener('DOMContentLoaded', function() {

		$('#delete-btn').on('click', function() {
            if(confirm('게시글을 삭제하시겠습니까?')) {
                location.href = 'delete?boardId=' + [[${board.boardId}]];
            }
        });

		const btnEdit = document.querySelector('#edit-btn');
		if (btnEdit) {
			btnEdit.addEventListener('click', function(event) {
				location.href = 'edit?boardId=' + [[${ board.boardId }]];
			});	
		}
		
		// 목록 버튼
        $('#to-list-btn').on('click', function() {
            location.href = 'community';
        });
		
		
		///////////////////////////////////////////////////

		// # id='#comment-list' 요소에 comment-list 요청 결과를 삽입 (비동기 jquery)
		$('#comment-list').load('comment-list?boardId=' + [[${ board.boardId }]]);
		// jquery에서 html 정보 조회 후 데이터 저장 -> comment-list 댓글 하나하나 table 
		
		/* comment-list 안에서
		<a class="update-comment" th:data-comment-no="${ comment.commentNo }" href="javascript:">수정</a> 
										&nbsp; 
										<a class="cancel-edit-comment" th:data-comment-no="${ comment.commentNo }" href="javascript:">취소</a>
		위 두 줄이 하나 보이면 나머지 안보이게 되어있음
		라인 8
		<div th:id="|comment-view-area-${ comment.commentNo }|">
		라인 28
		<div th:id="${ 'comment-edit-area-' + comment.commentNo }" style="display: none">
		*/
		
		$('#writecomment').on('click', function(event) {
			// alert('서버로 댓글 쓰기 요청');
			// $('#commentform').submit(); // form 객체의 submit 메서드는 form을 서버로 전송하는 명령 (동기 방식)
			
			/*
			
			위 <form id="commentform" action="write-comment" method="post">
			코드에서 각각의 name 정보 가져오는 것
 			const boardNo = $('#commentform input[name=boardNo]').val();
			const writer = $('#commentform input[name=writer]').val();
			const content = $('#commentform textarea[name=content]').val();
			
			아래는 해당 값을 한번에 반환 
			*/
			
			const formData = $('#commentform').serialize(); //form 내부의 모든 입력 요소의 값을 전송가능한 문자열 형식으로 반환
			// const formData = $('#commentform').serializeArray(); //form 내부의 모든 입력 요소의 값을 전송가능한 객체 배열 형식으로 반환
						
			$.ajax({
				"url": "write-comment",
				"method": "post",
				"data": formData,
				"success": function(data, status, xhr) {
					if (data == "success") {
						//alert('댓글을 등록했습니다.');
						$('#comment-list').load('comment-list?boardId=' + [[${ board.boardId }]]);
						$('#commentform textarea').val("");
					}
				},
				"error": function(xhr, status, err) {
					
				}
			});
		});
		
		let currentEditCommentNo = null;
        
        $('#comment-list').on('click', '.edit-comment', function(event) {
		event.preventDefault();
		
		if (currentEditCommentNo != null) {
			$('#comment-view-area-' + currentEditCommentNo).show();
			$('#comment-edit-area-' + currentEditCommentNo).hide();
		}
		
		var commentNo = $(this).data('comment-no'); // $(this) : 이벤트 발생 객체 (여기서는 <a class="edit-comment" ...>)
		
		$('#comment-view-area-' + commentNo).hide();
		$('#comment-edit-area-' + commentNo).show();
		
		currentEditCommentNo = commentNo
	});
	$('#comment-list').on('click', '.cancel-edit-comment', function(event) {
		event.preventDefault();
		
		var commentNo = $(this).data("comment-no"); // $(this) : 이벤트 발생 객체 (여기서는 <a class="cancel-edit-comment" ...>)
		const editForm = $('#comment-edit-area-' + commentNo + ' form');
		editForm[0].reset(); // editForm : jQuery 객체 , editForm[0] : javascript 객체
		
		$('#comment-view-area-' + commentNo).show();
		$('#comment-edit-area-' + commentNo).hide();
		
		currentEditCommentNo = null;
	});
	
	// 댓글 삭제 jquery에서 delete-comment
	// 실제 실행할 때 존재할 경우에만 
	// 
	// $('#comment-list .delete-comment').on('click', function(event) {
	$('#comment-list').on('click', '.delete-comment', function(event) {
		// 나중에 .delete-comment 생길거인데 그것에 event 걸어줘
		// 즉 현재 업지만 나중에 생길건데 그것에 걸어줘
		//alert('test');
		//return
		event.preventDefault();
		
		var commentNo = $(this).data('comment-no'); // .data('comment-no') --> data-comment-no="value"를 조회
		// this == event.target
		// 즉 $(event.target).data 동일
		// event 발생시킨 객체 
		// 위에서 function(event) 일 경우
		// 단 (event) => 일 경우는 아님 
		
		const yn = confirm(commentNo + "번 댓글을 삭제할까요?");
		if (!yn) return;
		
		// 동기 방식 All Refresh 요청
		//location.href = 
		//	'delete-comment?commentNo=' + commentNo + '&boardNo=${board.boardNo}&pageNo=${pageNo}';
		
		///////////////////////비동기(ajax) 요청  
		
		// jQuery 기반의 비동기(ajax) 요청
		$.ajax({
			"url": "delete-comment",
			"method": "get",
			"data" : 'commentNo=' + commentNo,
			"success": function(data, status, xhr) {
				if (data == "success") {
					// 1. 해당 댓글만 수정
					/*
					const html = `<br><br>
						<span style='color:gray'>삭제된 글입니다.</span>
						<br><br>`						
					$('#comment-view-area-' + commentNo).html(html); 
					*/
					// 2. 댓글 목록 전체 갱신
					//    jQuery의 load 함수 : 지정된 html 요소의 내용을 응답받은 부분 HTML로 (비동기) 갱신
					$('#comment-list').load('comment-list?boardId=' + [[${ board.boardId }]]);
				} else {
					alert('삭제 실패 2');
				}
				
			},
			"error": function(xhr, status, err) {
				alert('삭제 실패 1');
			}
		});
		
	});
	
	// 댓글 수정
	// $('#comment-list .update-comment').on('click', function(event) {
		$('#comment-list').on('click', '.update-comment', function(event) {
			const commentNo = $(this).data('comment-no'); // $(this) : 이벤트 발생한 객체, .data('abc') : data-abc 값 읽기
			
			const editForm = $('#comment-edit-area-' + commentNo + ' form');
			// alert(editForm.serialize());
			
			$.ajax({
				"url": "update-comment",
				"method": "post",
				"data": editForm.serialize(),
				"success": function(data) {
					if (data == "success") {
						$('#comment-list').load('comment-list?boardId=' + [[${ board.boardId }]]);
					}
				},
				"error": function(xhr, status, err) {
					alert('fail : ' + status);
				}
			});
		});
	
	// 대댓글 버튼 클릭 이벤트 처리기 -  클릭했을 때 모달 표시하는 이벤트 처리
	$('#comment-list').on('click', ".recomment-link", function(event) {
		event.preventDefault();
		
		var commentNo = $(this).data("comment-no");
		$('#recommentform')[0].reset();
		$('#recommentform input[name=commentNo]').val(commentNo);
		
		// javascript code로 modal 표시
		$('#recomment-modal').modal('show');
		
	});
	
	// 1
	// recomment-modal dkfo .write-button 버튼 이벤트 
	$('#recomment-modal .write-button').on('click', function(event) {
		
		if ( $('#recommentform textarea').val().length == 0 ) {
			alert('댓글을 작성하세요')
			return;
		}
		
		var formData = $('#recommentform').serialize();
		// recommentform 안의 데이터 한번에 받기 
		
		$.ajax({
			"url": "write-recomment",
			"method": "post",
			"data": formData,
			"success": function(data) {
				if (data == "success") {
					$('#comment-list').load('comment-list?boardId=' + [[${ board.boardId }]]);
					$('#recomment-modal').modal('hide');
					// 처리 후 숨기기 
				}
			},
			"error": function() {
				
			}
		});			
	
	});
		
        
    });
	</script>
  </body>
</html>
