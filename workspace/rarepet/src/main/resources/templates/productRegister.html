<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AnyZoo | 상품 등록</title>

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
	rel="stylesheet">
<link
	href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap"
	rel="stylesheet">
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<style>
body {
	font-family: 'Noto Sans KR', sans-serif;
	background: #fdf6ee;
	padding-top: 80px;
}

.register-container {
	max-width: 900px;
	background: white;
	border-radius: 30px;
	padding: 30px;
	box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
}

.form-label {
	font-weight: 600;
	color: #5a3c32;
}

/* 이미지 업로드 영역 */
.image-upload-wrapper {
	display: flex;
	gap: 15px;
	flex-wrap: wrap;
	margin-bottom: 10px;
}

/* 개별 이미지 박스 (반응형 크기 조절) */
.image-preview {
	position: relative;
	width: 140px;
	height: 140px;
	border: 2px dashed #ddd;
	border-radius: 20px;
	display: flex;
	align-items: center;
	justify-content: center;
	overflow: hidden;
	background: #fafafa;
	cursor: pointer;
}

/* 모바일 대응: 화면이 작아지면 박스 크기 축소 */
@media ( max-width : 576px) {
	.image-preview {
		width: 100px;
		height: 100px;
	}
}

.image-preview img {
	width: 100%;
	height: 100%;
	object-fit: cover;
}

.add-btn {
	font-size: 2.5rem;
	color: #ffc107;
	transition: transform 0.2s;
}

.image-preview:hover .add-btn {
	transform: scale(1.2);
}

/* 개별 삭제 버튼 (X) */
.remove-btn {
	position: absolute;
	top: 8px;
	right: 8px;
	background: rgba(231, 111, 81, 0.9);
	color: white;
	border: none;
	border-radius: 50%;
	width: 24px;
	height: 24px;
	font-size: 12px;
	cursor: pointer;
	z-index: 5;
	display: flex;
	align-items: center;
	justify-content: center;
}

.btn-submit {
	background-color: #ffc107;
	border: none;
	padding: 15px;
	border-radius: 15px;
	font-weight: bold;
	color: #5a3c32;
	width: 100%;
}

input[name="title"] {
	font-family: 'Jua', sans-serif !important; /* 원하는 폰트로 변경 */
	font-weight: 500;
	color: #5a3c32; /* 입력한 글자 색상 */
}

/* 사용자가 입력하는 '상세 설명' 폰트 */
textarea[name="content"] {
	font-family: 'Jua', sans-serif !important; /* 원하는 폰트로 변경 */
	font-weight: 500;
	color: #5a3c32; /* 입력한 글자 색상 */
}
/* 네비게이션 링크 기본 스타일 */
.navbar-nav .nav-link {
    position: relative;
    color: black !important; 
    transition: color 0.3s ease;
    padding: 0.5rem 1rem;
}

/* 마우스 올렸을 때 글자색 진하게 */
.navbar-nav .nav-link:hover {
    color: black !important; /* 진한 브라운색 */
}

/* 마우스 올렸을 때 밑줄 애니메이션 추가 */
.navbar-nav .nav-link::after {
    content: '';
    position: absolute;
    width: 0;
    height: 3px;
    bottom: 0;
    left: 50%;
    background-color: #ffc107; /* 테마 노란색 */
    transition: all 0.3s ease;
    transform: translateX(-50%);
}

.navbar-nav .nav-link:hover::after {
    width: 70%; /* 마우스 올리면 밑줄이 70% 너비만큼 펴짐 */
}

/* 현재 페이지(active) 표시 강화 */
.navbar-nav .nav-link.active {
    color: black !important;
    font-weight: 700;
}
.navbar-nav .nav-link.active::after {
    width: 70%;
}
</style>
</head>
<body>

	<div th:replace="fragments/fragment :: header"></div>

	<div class="container my-4">
		<div class="register-container mx-auto">
			<h3 class="fw-bold mb-4 text-center">🐾 상품 등록</h3>

			<form id="registerForm" action="/productRegister" method="post"
				enctype="multipart/form-data">

				<div class="mb-4">
					<label class="form-label">반려동물 사진 (다중 선택 가능)</label>
					<div class="image-upload-wrapper" id="imageContainer">
						<div class="image-preview" id="btnUploadTrigger">
							<span class="add-btn">+</span>
						</div>
					</div>
					<input type="file" id="fileInput" name="petImages"
						style="display: none;" accept="image/*" multiple>
					<p class="text-muted small mt-2">※ 첫 번째 사진이 대표 이미지가 됩니다. (X를 눌러
						삭제 가능)</p>
				</div>

				<div class="row g-3">
					<div class="col-12 col-md-8">
						<label class="form-label">상품명 / 품종</label> <input type="text"
							class="form-control form-control-lg" name="title"
							placeholder="예: 알비노 고슴도치" required>
					</div>
					<div class="col-12 col-md-4">
						<label class="form-label">카테고리</label> <select
							class="form-select form-select-lg" name="category">
							<option value="포유류">포유류</option>
							<option value="파충류">파충류</option>
							<option value="조류">조류</option>
							<option value="기타">기타</option>
						</select>
					</div>
					<div class="col-12">
						<label class="form-label">분양 가격 (₩)</label> <input type="number"
							class="form-control form-control-lg" name="price"
							placeholder="가격을 입력하세요" required>
					</div>
					<div class="col-12">
						<label class="form-label">상세 설명</label>
						<textarea class="form-control" name="content" rows="5"
							placeholder="아이의 성격, 건강상태, 입양 시 주의사항 등을 입력해주세요."></textarea>
					</div>
				</div>

				<div class="mt-5 row g-2">
					<div class="col-6 col-md-3">
						<button type="button" class="btn btn-outline-secondary w-100 p-3"
							onclick="history.back();">취소</button>
					</div>
					<div class="col-6 col-md-9">
						<button type="submit" class="btn btn-submit">등록하기</button>
					</div>
				</div>
			</form>
		</div>
	</div>

	<div th:replace="fragments/fragment :: footer"></div>



	<script>
$(document).ready(function() {
    let selectedFiles = []; // 파일을 담을 배열

    // 1. 플러스 박스 클릭 시 파일 선택창 열기 (jQuery 이벤트)
    $('#btnUploadTrigger').on('click', function() {
        $('#fileInput').click();
    });

    // 2. 파일 선택 시 처리
    $('#fileInput').on('change', function(e) {
        const files = Array.from(e.target.files);
        
        files.forEach(file => {
            selectedFiles.push(file); // 배열에 추가
        });

        updatePreview(); // 미리보기 갱신
        syncFiles();     // input 동기화
    });

    // 3. 미리보기 화면 갱신 함수
    function updatePreview() {
        // 추가 버튼(btnUploadTrigger)만 남기고 나머지 미리보기 이미지 삭제
        $('.preview-item').remove();

        selectedFiles.forEach((file, index) => {
            const reader = new FileReader();
            reader.onload = function(e) {
                const html = `
                    <div class="image-preview preview-item">
                        <img src="${e.target.result}">
                        <button type="button" class="remove-btn" data-index="${index}">✕</button>
                    </div>
                `;
                $('#imageContainer').append(html);
            };
            reader.readAsDataURL(file);
        });
    }

    // 4. 삭제 버튼 클릭 (동적 생성된 요소이므로 이벤트 위임 방식 사용)
    $(document).on('click', '.remove-btn', function() {
        const index = $(this).data('index');
        selectedFiles.splice(index, 1); // 배열에서 삭제
        
        updatePreview();
        syncFiles();
    });

    // 5. DataTransfer를 이용해 실제 input의 files 리스트 교체
    function syncFiles() {
        const dataTransfer = new DataTransfer();
        selectedFiles.forEach(file => {
            dataTransfer.items.add(file);
        });
        $('#fileInput')[0].files = dataTransfer.files;
    }
});
</script>

	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
