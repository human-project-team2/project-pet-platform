<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AnyZoo | 상품 등록</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: #fdf6ee; /* 홈 화면과 동일한 배경색 */
            padding-top: 80px;
        }

        .register-container {
            max-width: 800px;
            background: white;
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        .form-label {
            font-weight: 600;
            color: #5a3c32;
        }

        .image-preview {
            width: 100%;
            height: 250px;
            border: 2px dashed #ddd;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #aaa;
            cursor: pointer;
            overflow: hidden;
            background: #fafafa;
        }

        .image-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .btn-submit {
            background-color: #ffc107;
            border: none;
            padding: 12px 30px;
            border-radius: 12px;
            font-weight: bold;
            color: #5a3c32;
        }

        .btn-submit:hover {
            background-color: #eab000;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm fixed-top">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/home">🐾 AnyZoo</a>
        <div class="collapse navbar-collapse justify-content-end">
            <ul class="navbar-nav">
                <li class="nav-item"><a class="nav-link" href="#">마켓</a></li>
                <li class="nav-item"><a class="nav-link active fw-bold" href="/productRegister">판매등록</a></li>
                <li class="nav-item"><a class="nav-link" href="#">로그인</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container my-5">
    <div class="register-container mx-auto">
        <h3 class="fw-bold mb-4 text-center">🐾 새로운 가족 찾기 (상품 등록)</h3>
        
        <form action="/productRegister" method="post" enctype="multipart/form-data">
            
            <div class="mb-4">
                <label class="form-label">반려동물 사진</label>
                <div class="image-preview" id="imagePreview" onclick="document.getElementById('fileInput').click();">
                    <span>클릭하여 사진을 업로드하세요</span>
                </div>
                <input type="file" id="fileInput" name="petImage" style="display: none;" accept="image/*" onchange="previewImage(this)">
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="petName" class="form-label">동물 이름 / 품종</label>
                    <input type="text" class="form-control" id="petName" name="title" placeholder="예: 알비노 고슴도치" required>
                </div>
                
                <div class="col-md-6 mb-3">
                    <label for="category" class="form-label">카테고리</label>
                    <select class="form-select" id="category" name="category">
                        <option value="포유류">포유류</option>
                        <option value="파충류">파충류</option>
                        <option value="조류">조류</option>
                        <option value="기타">기타</option>
                    </select>
                </div>
            </div>

            <div class="mb-3">
                <label for="price" class="form-label">분양 가격 (₩)</label>
                <input type="number" class="form-control" id="price" name="price" placeholder="가격을 입력하세요" required>
            </div>

            <div class="mb-4">
                <label for="description" class="form-label">상세 설명</label>
                <textarea class="form-control" id="description" name="content" rows="6" placeholder="아이의 특징, 건강 상태, 거래 희망 지역 등을 상세히 적어주세요."></textarea>
            </div>

            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                <button type="button" class="btn btn-light me-md-2" onclick="history.back();">취소</button>
                <button type="submit" class="btn btn-submit">분양 등록하기</button>
            </div>
        </form>
    </div>
</div>

<footer class="text-center py-4 bg-light mt-5">
    © 2026 AnyZoo
</footer>

<script>
    function previewImage(input) {
        const preview = document.getElementById('imagePreview');
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                preview.innerHTML = `<img src="${e.target.result}" alt="Preview">`;
            }
            reader.readAsDataURL(input.files[0]);
        }
    }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
