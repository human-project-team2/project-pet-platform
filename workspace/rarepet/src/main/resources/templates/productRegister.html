<div class="row g-3">
    <div class="col-12 col-md-8">
        <label class="form-label">상품명 / 품종</label>
        <input type="text" class="form-control form-control-lg" name="title" id="title" placeholder="예: 알비노 고슴도치">
        <div class="error-msg">상품명을 입력해주세요!</div>
    </div>
    <div class="col-12 col-md-4">
        <label class="form-label">카테고리</label>
        <select class="form-select form-select-lg" name="category" id="categorySelect">
            <option value="포유류">포유류</option>
            <option value="파충류">파충류</option>
            <option value="조류">조류</option>
            <option value="기타">기타(용품)</option>
        </select>
    </div>

    <div class="col-12">
        <label class="form-label">한 줄 소개</label>
        <input type="text" class="form-control" name="shortDescription" id="shortDescription" placeholder="리스트에 노출될 짧은 설명을 적어주세요.">
    </div>

    <div class="col-12" id="quantityWrapper" style="display: none;">
        <label class="form-label">수량</label>
        <input type="number" class="form-control form-control-lg" name="productCount" id="productCount" value="1">
        <div class="error-msg" id="quantityError">최대 등록 가능 수량은 9999개입니다.</div>
        <p class="text-muted small mt-1">※ 용품 등은 최대 9999개까지 가능합니다.</p>
    </div>

    </div>
<script>
$(document).ready(function() {
    // [중략] 이미지 관련 로직 동일...

    // 카테고리 변경 시 수량창 제어
    $('#categorySelect').on('change', function() {
        const category = $(this).val();
        if (category === '관련 용품') {
            $('#quantityWrapper').stop().slideDown(400);
        } else {
            $('#quantityWrapper').stop().slideUp(300, () => {
                // 동물을 선택하면 다시 1로 고정
                $('#productCount').val(1).removeClass('is-invalid');
                $('#quantityError').hide();
            });
        }
    });

    // 수량 입력 시 9999 제한 및 빨간 테두리 피드백
    $('#productCount').on('input', function() {
        let val = $(this).val();
        let num = parseInt(val);
        if (num > 9999) {
            $(this).val(9999);
            $(this).addClass('is-invalid');
            $('#quantityError').fadeIn(200);
        } else {
            $(this).removeClass('is-invalid');
            $('#quantityError').hide();
        }
    });

    // [중략] 가격 포맷팅 및 폼 제출 로직 동일...
});
</script>
