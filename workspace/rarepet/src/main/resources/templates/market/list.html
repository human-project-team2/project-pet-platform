<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AnyZoo Marketplace</title>

<!-- Bootstrap 5 CSS -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
	rel="stylesheet">
	<!-- Bootstrap Icons -->
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<!-- Google Font -->
<link
	href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap"
	rel="stylesheet">
<link rel="stylesheet" th:href="@{/css/floating-chat.css}">
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<style>
body {
	font-family: 'Noto Sans KR', sans-serif;
	background: #fdf6ee;
	padding-top: 80px; /* adjust to navbar height */
}

/* Hero */
.hero {
	background: linear-gradient(rgba(230, 180, 150, 0.45),
		rgba(245, 210, 185, 0.55)),
		url("https://images.unsplash.com/photo-1508672019048-805c876b67e2?auto=format&fit=crop&w=1600&q=80");
	background-size: cover;
	background-position: center;
	height: 60vh;
}

.hero-box {
	background: rgba(255, 250, 245, 0.92);
	border-radius: 30px;
}

/* Card */
.card {
	border: none;
	border-radius: 20px;
}

.card img {
	height: 200px;
	object-fit: cover;
	border-radius: 20px 20px 0 0;
}

.heart {
	position: absolute;
	top: 15px;
	right: 15px;
	font-size: 22px;
	cursor: pointer;
	color: #ccc;
}

.heart.active {
	color: #e76f51;
}

.review-section {
	background:
		url("https://images.unsplash.com/photo-1518717758536-85ae29035b6d?auto=format&fit=crop&w=1600&q=80");
	background-size: cover;
	background-position: center;
}

.review-overlay {
	background: rgba(90, 60, 50, 0.75);
	border-radius: 25px;
}

.view-toggle .btn.active {
	background: #ffc107;
	border-color: #ffc107;
}

.price-badge {
	font-size: 18px;
	font-weight: 700;
	color: #dc3545;
}

.list-view .card {
	flex-direction: row;
	align-items: center;
}

.list-view .card img {
	width: 200px;
	height: 150px;
	object-fit: cover;
}

.nav-tabs-section {
    background: #fffaf0;           /* 부드러운 크림/베이지 톤 배경 */
    border-bottom: 3px solid #e76f51; /* 주 색상 강조 라인 */
    padding: 15px 0;
    margin-bottom: 20px;
}

.nav-tabs {
    border: none;                  /* 기본 border 제거 */
    margin: 0 auto;
    max-width: 800px;              /* 너무 넓지 않게 중앙 정렬 */
}

.nav-tabs .nav-link {
    font-size: 1.25rem;            /* 글자 크기 증가 (기본 1rem → 1.25rem) */
    font-weight: 600;
    padding: 16px 32px;            /* 상하/좌우 패딩 늘려서 버튼 크게 */
    color: #555;
    border-radius: 12px 12px 0 0;  /* 위쪽만 둥글게 */
    transition: all 0.2s ease;
}

.nav-tabs .nav-link:hover {
    background: rgba(231, 111, 81, 0.08);
    color: #e76f51;
}

.nav-tabs .nav-link.active {
    background: #e76f51;           /* 활성 탭 배경 = 메인 컬러 */
    color: white;
    border: none;
    box-shadow: 0 4px 12px rgba(231, 111, 81, 0.25);
}

/* 모바일 대응 */
@media (max-width: 576px) {
    .nav-tabs .nav-link {
        font-size: 1.1rem;
        padding: 12px 20px;
    }
}
</style>

</head>

<body>

	<!-- NAVBAR -->
	<div th:replace="fragments/fragment :: header"></div>

<div class="nav-tabs-section">
    <div class="container">
        <ul class="nav nav-tabs nav-justified" id="marketTab" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="personal-tab" data-bs-toggle="tab" 
                        data-bs-target="#personal" type="button" role="tab" 
                        aria-controls="personal" aria-selected="false">
                   Animals
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="shop-tab" data-bs-toggle="tab" 
                        data-bs-target="#shop" type="button" role="tab" 
                        aria-controls="shop" aria-selected="true">
                  Shops
                </button>
            </li>
        </ul>
    </div>
</div>

<div class="tab-content container" id="marketTabContent">

    <!-- Tab 1: 개인 분양·입양 (기존 페이지 내용) -->
    <div class="tab-pane fade show active" id="personal" role="tabpanel" aria-labelledby="personal-tab">

	<!-- PAGE TITLE -->
	<div class="container my-5">
		<div class="d-flex justify-content-between align-items-center mb-4">
			<h3 class="fw-bold">희귀 애완동물 분양 · 입양 마켓</h3>

			<!-- 보기 전환 버튼 -->
			<div class="view-toggle btn-group">
				<button class="btn btn-outline-secondary active"
					onclick="setCardView()">카드 보기</button>
				<button class="btn btn-outline-secondary" onclick="setListView()">리스트
					보기</button>
			</div>
		</div>

		<!-- SEARCH AREA -->
		<div class="card shadow-sm p-4 mb-4">

			<form class="row g-3 align-items-center">

				<!-- 카테고리 선택 -->
				<div class="col-md-3">
					<select id="categorySelect" class="form-select rounded-pill">
					        <option value="all">전체 카테고리</option>
                            <option value="포유류">포유류</option>
                            <option value="파충류">파충류</option>
                            <option value="양서류">양서류</option>
                            <option value="조류">조류</option>
                            <option value="절지동물-곤충">절지동물 & 곤충</option>
                            <option value="기타동물">기타특수생물</option>
                            <option value="기타">관련 용품</option>
					</select>
				</div>

				<!-- 검색어 입력 -->
				<div class="col-md-6">
					<input type="text" id="searchInput" class="form-control rounded-pill"
						placeholder="동물 이름 또는 키워드를 입력하세요">
				</div>

				<!-- 검색 버튼 -->
				<div class="col-md-3 d-grid">
					<button type="button" onclick="performSearch()" class="btn btn-warning rounded-pill">
						🔍 검색</button>
				</div>

			</form>

		</div>


		<!-- MARKET GRID -->
		<div id="marketContainer" class="row g-4">
			
			
			<!-- 상품 리스트 반복문 -->
				<div class="col-md-4 market-item" th:each="product:${products}">
					<div class="card shadow">
						<a th:href="@{market/detail/{productNo}(productNo=${product.productNo})}">
						<img
							th:if="${#lists.isEmpty(product.productImages) == false}" 
							th:src="@{${product.productImages[0].imgUrl}}" class="card-img-top">
						<img th:if="${#lists.isEmpty(product.productImages) == true}" 
                            src="/img/no_image.jpg" class="card-img-top">
						</a>
						<div class="mb-2">
							<span class="badge bg-warning text-dark px-3 py-2"
								th:text="${product.productCategory}">분류</span>
						</div>
						<div class="card-body">
							<h5 class="card-title" th:text="${product.productName}"></h5>
							<p class="card-text text-muted" th:text="${product.shortDescription}" ></p>
							<div class="mb-2">
							    <span class="badge bg-danger"
							          th:if="${product.productCount == 0}">
							        품절
							    </span>
							
							    <span class="badge bg-secondary"
							          th:if="${product.productCount > 0}"
							          th:text="'수량 : ' + ${product.productCount}">
							    </span>
							</div>
							<div
							class="d-flex justify-content-between align-items-center mt-3">
							<span class="text-muted small">분양가</span>
							<div class="price-badge"
								th:text="${#numbers.formatInteger(product.price, 0, 'COMMA')} + '원'"></div>
							</div>
						</div>
					</div>
				</div>
				<!-- 상품 리스트 반복문  끝-->
			</div>
			
		</div>
			

			<!-- PAGINATION -->
			<div class="d-flex justify-content-center mt-5">
				<nav>
					<ul class="pagination pagination-lg">

						<!-- 이전 -->
						<li class="page-item disabled"><a
							class="page-link rounded-start-pill" href="#"> &laquo; </a></li>

						<!-- 페이지 번호 -->
						<li class="page-item active"><a class="page-link" href="#">1</a>
						</li>

						<li class="page-item"><a class="page-link" href="#">2</a></li>

						<li class="page-item"><a class="page-link" href="#">3</a></li>

						<li class="page-item"><a class="page-link" href="#">4</a></li>

						<li class="page-item"><a class="page-link" href="#">5</a></li>

						<!-- 다음 -->
						<li class="page-item"><a class="page-link rounded-end-pill"
							href="#"> &raquo; </a></li>

					</ul>
				</nav>
			</div>
			</div>
<!-- Tab 2: 샵 분양  -->
    <div class="tab-pane fade" id="shop" role="tabpanel" aria-labelledby="shop-tab">
         <div class="my-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="fw-bold">전문 샵 · 브리더 분양</h3>
        </div>

        <!-- SHOP GRID -->
        <div class="row g-4">

            <!-- shop 반복문 -->
            <div class="col-md-4" th:each="shop : ${shops}">

                <div class="card shadow h-100">

                    <!-- shop image -->
                    <img th:src="@{${shop.imgUrlShop}}"
                         class="card-img-top"
                         style="height:200px; object-fit:cover;">

                    <div class="card-body">

                        <!-- shop name -->
                        <h5 class="card-title"
                            th:text="${shop.shopName}">
                        </h5>

                        <!-- shop description -->
                        <p class="card-text text-muted"
                           th:text="${shop.shopContent}">
                        </p>

                        <!-- rating -->
                        <div class="mb-2">

                            <span class="text-warning">
                                <i class="bi bi-star-fill"
                                   th:each="i : ${#numbers.sequence(1, shop.rating)}">
                                </i>
                            </span>

                            <span class="text-muted small"
                                  th:text="'(' + ${shop.rating} + ')'">
                            </span>

                        </div>

                        <!-- verify badge -->
                        <span th:if="${shop.verified}"
                              class="badge bg-success">
                              인증샵
                        </span>

                    </div>

                    <div class="card-footer bg-white border-0">

                        <!-- shop page link -->
                        <!-- <a th:href="@{/shop/{id}(id=${shop.id})}" -->
                        <a href="#"
                           class="btn btn-warning w-100 rounded-pill">
                           샵 방문
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>
        
    </div>

</div>
			<div th:replace="fragments/fragment :: footer"></div>

			<!-- Bootstrap JS -->
			<script
				src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
			<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
			
<div th:replace="fragments/fragment :: message"></div>
	
<script th:replace="fragments/fragment :: message_script"></script>

<script>
$( () => {

	window.setCardView = function (){
		
		$(".market-item").removeClass("col-12").addClass("col-md-4");
		$("#marketContainer").removeClass("list-view");
		$(".view-toggle .btn").removeClass("active").eq(0).addClass("active");
		
	}
	
	window.setListView = function (){
		
		$(".market-item").removeClass("col-md-4").addClass("col-12");
		$("#marketContainer").addClass("list-view");
		$(".view-toggle .btn").removeClass("active").eq(1).addClass("active");
		
	}
	
	window.performSearch = function () {

		const category = $("#categorySelect").val();
		const search = $("#searchInput").val().toLowerCase();
		
		location.href = `/market?search=${search}&category=${category}`
		

	}
	
	$("#searchInput").on("keydown", function(e){

	    if(e.key === "Enter"){
	        e.preventDefault();   // prevents form submit reload
	        performSearch();
	    }

	});
	
})



</script>
</body>
</html>
