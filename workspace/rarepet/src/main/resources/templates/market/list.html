<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AnyZoo Marketplace</title>

<!-- Bootstrap 5 CSS -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
	rel="stylesheet">

<!-- Google Font -->
<link
	href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap"
	rel="stylesheet">

<style>
body {
	font-family: 'Noto Sans KR', sans-serif;
	background: #fdf6ee;
	padding-top: 80px; /* adjust to navbar height */
}

/* Hero */
.hero {
	background: linear-gradient(rgba(230, 180, 150, 0.45),
		rgba(245, 210, 185, 0.55)),
		url("https://images.unsplash.com/photo-1508672019048-805c876b67e2?auto=format&fit=crop&w=1600&q=80");
	background-size: cover;
	background-position: center;
	height: 60vh;
}

.hero-box {
	background: rgba(255, 250, 245, 0.92);
	border-radius: 30px;
}

/* Card */
.card {
	border: none;
	border-radius: 20px;
}

.card img {
	height: 200px;
	object-fit: cover;
	border-radius: 20px 20px 0 0;
}

.heart {
	position: absolute;
	top: 15px;
	right: 15px;
	font-size: 22px;
	cursor: pointer;
	color: #ccc;
}

.heart.active {
	color: #e76f51;
}

.review-section {
	background:
		url("https://images.unsplash.com/photo-1518717758536-85ae29035b6d?auto=format&fit=crop&w=1600&q=80");
	background-size: cover;
	background-position: center;
}

.review-overlay {
	background: rgba(90, 60, 50, 0.75);
	border-radius: 25px;
}

.view-toggle .btn.active {
	background: #ffc107;
	border-color: #ffc107;
}

.price-badge {
	font-size: 18px;
	font-weight: 700;
	color: #dc3545;
}

.list-view .card {
	flex-direction: row;
	align-items: center;
}

.list-view .card img {
	width: 200px;
	height: 150px;
	object-fit: cover;
}
</style>

</head>

<body>

	<!-- NAVBAR -->
	<div th:replace="fragments/fragment :: header"></div>

	<!-- PAGE TITLE -->
	<div class="container my-5">
		<div class="d-flex justify-content-between align-items-center mb-4">
			<h3 class="fw-bold">희귀 애완동물 분양 · 입양 마켓</h3>

			<!-- 보기 전환 버튼 -->
			<div class="view-toggle btn-group">
				<button class="btn btn-outline-secondary active"
					onclick="setCardView()">카드 보기</button>
				<button class="btn btn-outline-secondary" onclick="setListView()">리스트
					보기</button>
			</div>
		</div>

		<!-- SEARCH AREA -->
		<div class="card shadow-sm p-4 mb-4">

			<form class="row g-3 align-items-center">

				<!-- 카테고리 선택 -->
				<div class="col-md-3">
					<select class="form-select rounded-pill">
                            <option value="포유류">포유류</option>
                            <option value="파충류">파충류</option>
                            <option value="양서류">양서류</option>
                            <option value="조류">조류</option>
                            <option value="절지동물-곤충">절지동물 & 곤충</option>
                            <option value="기타동물">기타특수생물</option>
                            <option value="기타">관련 용품</option>
					</select>
				</div>

				<!-- 검색어 입력 -->
				<div class="col-md-6">
					<input type="text" class="form-control rounded-pill"
						placeholder="동물 이름 또는 키워드를 입력하세요">
				</div>

				<!-- 검색 버튼 -->
				<div class="col-md-3 d-grid">
					<button type="button" class="btn btn-warning rounded-pill">
						🔍 검색</button>
				</div>

			</form>

		</div>


		<!-- MARKET GRID -->
		<div id="marketContainer" class="row g-4">
			
			<div id="marketContainer" class="row g-4">
			<!-- 상품 리스트 반복문 -->
				<div class="col-md-4 market-item" th:each="product:${products}">
					<div class="card shadow">
						<a th:href="@{market/detail}"><img th:src="@{${product.imgUrl}}" class="card-img-top"></a>
						<div class="card-body">
							<h5 class="card-title" th:text="${product.productName}"></h5>
							<p class="card-text text-muted" th:text="${product.shortDescription}" ></p>
							<div class="price-badge" th:text="${product.price}"></div>
						</div>
					</div>
				</div>
				<!-- 상품 리스트 반복문  끝-->
			</div>
			
		</div>
			

			<!-- PAGINATION -->
			<div class="d-flex justify-content-center mt-5">
				<nav>
					<ul class="pagination pagination-lg">

						<!-- 이전 -->
						<li class="page-item disabled"><a
							class="page-link rounded-start-pill" href="#"> &laquo; </a></li>

						<!-- 페이지 번호 -->
						<li class="page-item active"><a class="page-link" href="#">1</a>
						</li>

						<li class="page-item"><a class="page-link" href="#">2</a></li>

						<li class="page-item"><a class="page-link" href="#">3</a></li>

						<li class="page-item"><a class="page-link" href="#">4</a></li>

						<li class="page-item"><a class="page-link" href="#">5</a></li>

						<!-- 다음 -->
						<li class="page-item"><a class="page-link rounded-end-pill"
							href="#"> &raquo; </a></li>

					</ul>
				</nav>
			</div>

			<div th:replace="fragments/fragment :: footer"></div>

			<!-- Bootstrap JS -->
			<script
				src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
			<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

			<script>
$( () => {

	window.setCardView = function (){
		
		$(".market-item").removeClass("col-12").addClass("col-md-4");
		$("#marketContainer").removeClass("list-view");
		$(".view-toggle .btn").removeClass("active").eq(0).addClass("active");
		
	}
	
	window.setListView = function (){
		
		$(".market-item").removeClass("col-md-4").addClass("col-12");
		$("#marketContainer").addClass("list-view");
		$(".view-toggle .btn").removeClass("active").eq(1).addClass("active");
		
	}
	
})



</script>
</body>
</html>
