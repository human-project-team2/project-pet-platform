<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AnyZoo Marketplace</title>

<!-- Bootstrap 5 CSS -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
	rel="stylesheet">
<!-- Bootstrap Icons -->
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
	
<!-- Google Font -->
<link
	href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap"
	rel="stylesheet">

<style>
body {
	font-family: 'Noto Sans KR', sans-serif;
	background: #fdf6ee;
	padding-top: 80px; /* adjust to navbar height */
}

/* Hero */
.hero {
	background: linear-gradient(rgba(230, 180, 150, 0.45),
		rgba(245, 210, 185, 0.55)),
		url("https://images.unsplash.com/photo-1508672019048-805c876b67e2?auto=format&fit=crop&w=1600&q=80");
	background-size: cover;
	background-position: center;
	height: 60vh;
}

.hero-box {
	background: rgba(255, 250, 245, 0.92);
	border-radius: 30px;
}

/* Card */
.card {
	border: none;
	border-radius: 20px;
}

.card img {
	height: 200px;
	object-fit: cover;
	border-radius: 20px 20px 0 0;
}

.heart {
	position: absolute;
	top: 15px;
	right: 15px;
	font-size: 22px;
	cursor: pointer;
	color: #ccc;
}

.heart.active {
	color: #e76f51;
}

.review-section {
	background:
		url("https://images.unsplash.com/photo-1518717758536-85ae29035b6d?auto=format&fit=crop&w=1600&q=80");
	background-size: cover;
	background-position: center;
}

.review-overlay {
	background: rgba(90, 60, 50, 0.75);
	border-radius: 25px;
}

.view-toggle .btn.active {
	background: #ffc107;
	border-color: #ffc107;
}

.price-badge {
	font-size: 18px;
	font-weight: 700;
	color: #dc3545;
}

.list-view .card {
	flex-direction: row;
	align-items: center;
}

.list-view .card img {
	width: 200px;
	height: 150px;
	object-fit: cover;
}
</style>

</head>

<body>

	<!-- NAVBAR -->
	<div th:replace="fragments/fragment :: header"></div>

	<div class="container my-5">
		
		<div class="mb-3">
		    <a th:href="@{/market}" 
		       class="btn btn-outline-secondary rounded-pill px-4">
		        ← 목록으로 돌아가기
		    </a>
		</div>
		
		<!-- Title -->
		<div class="mb-4">
			<h3 class="fw-bold" th:text="${product.productName}"></h3>
			<p class="text-muted" th:text="${product.shortDescription}" ></p>
		</div>

		<div class="row g-5">

			<!-- LEFT : Image -->
			<div class="col-lg-6">
				<div class="card shadow">
					<img
						th:src="@{${product.imgUrl}}"
						class="card-img-top">
				</div>
			</div>

			<!-- RIGHT : Basic Info -->
			<div class="col-lg-6">
				<div class="card shadow p-4">

					<div class="price-badge mb-3" th:text="|₩${product.price}|" ></div>

					<ul class="list-unstyled mb-4">
						<li><strong>품종:</strong>
						<span th:text="${product.productCategory}" ></span>
						</li>
						<li><strong>성별:</strong></li>
						<li><strong>건강상태:</strong></li>
						<li><strong>접종여부:</strong></li>
						<li><strong>지역:</strong></li>
					</ul>

					<div class="d-flex gap-3 flex-wrap">

						<button class="btn btn-warning rounded-pill px-4">❤️ 관심등록
						</button>
						
						<th:block sec:authorize="isAuthenticated()">
						    <button class="btn btn-danger rounded-pill px-4"
						            data-bs-toggle="modal"
						            data-bs-target="#newMessageModal"
						            th:data-bs-receiver="${product.sellerId}">
						        💬 판매자 문의
						    </button>
						</th:block>

						<th:block sec:authorize="isAnonymous()" >
						    <button class="btn btn-outline-danger rounded-pill px-4"
						            th:onclick="'window.location.href=\'' + @{/auth/login} + '\''">
						        💬 판매자 문의
						    </button>
						</th:block>
						
						<form th:action="@{/market/shoppingCart}" method="post">
							<input type="hidden" name="productNo" th:value="${product.productNo}">
							<button type="submit" class="btn btn-outline-dark rounded-pill px-4">
								🛒 장바구니 등록</button>
						</form>
						<a th:href="@{/market/shoppingCart}"
					       class="btn btn-success rounded-pill px-4 fw-bold">
					        🛒 장바구니로 이동
					    </a>

					</div>

				</div>
			</div>

		</div>

		<!-- Description -->
		<div class="card shadow p-4 mt-5">
			<h5 class="fw-bold mb-3">상세 설명</h5>
			<p  th:text="${product.productContent}" ></p>
		</div>

		<!-- Seller Info -->
		<div class="card shadow p-4 mt-4">
			<h5 class="fw-bold mb-3">판매자 정보</h5>
			<p>
				<strong>판매자명:</strong>
				<span th:text="${product.sellerId}"></span>
			</p>
			<p>
				<strong>전화번호:</strong>
				<span th:text="${phone}"></span>
			</p>
			<p>
				<strong>이메일:</strong>
				<span th:text="${email}"></span>
			</p>
			<p>
				<strong>거래방식:</strong>
			</p>
		</div>

	</div>
	<div th:replace="fragments/fragment :: message"></div>
	<div th:replace="fragments/fragment :: footer"></div>

	<!-- Bootstrap JS -->
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
	<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
	<script th:replace="fragments/fragment :: message_script"></script>
	<script>
		
	</script>
</body>
</html>
