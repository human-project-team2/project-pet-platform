<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" 
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title th:text="${shop.shopName} + ' | AnyZoo Marketplace'">Rare Pet Shop</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">

<!-- Bootstrap JS -->
<script
	src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<style>
body { font-family: 'Noto Sans KR', sans-serif; background: #fdfaf6; padding-top: 80px; /* adjust to navbar height */
}
.hero { background: linear-gradient(rgba(255,255,255,0.8), rgba(255,255,255,0.8)), url("https://images.unsplash.com/photo-1526336024174-e58f5cdd8e13?auto=format&fit=crop&w=1600&q=80") center/cover; height: 30vh; display: flex; align-items: center; justify-content: center; }
.hero-box { background: rgba(255,255,255,0.95); padding: 30px; border-radius: 20px; text-align: center; box-shadow: 0 8px 20px rgba(0,0,0,0.1);}
.card { border: none; border-radius: 20px; overflow: hidden; transition: 0.3s; background: #fff;}
.card:hover { transform: translateY(-6px); box-shadow: 0 15px 30px rgba(0,0,0,0.1);}
.price-badge { font-weight: bold; color: #f26419; font-size: 1.2rem; }
.badge-verified { background-color: #4CAF50; color: #fff; }
</style>
<link rel="stylesheet" th:href="@{/css/floating-chat.css}">
</head>
<body>
<div th:replace="~{fragments/fragment :: header}"></div>

<!-- Shop Hero Section -->
<section class="hero mb-5">
    <div class="hero-box">
        <h1 class="fw-bold" th:text="${shop.shopName}">Shop Name</h1>
        <p th:text="${shop.shopContent}" class="text-muted mb-2">Shop Description</p>
        <div class="d-flex justify-content-center align-items-center gap-3 mt-2">
            <span th:if="${shop.verified}" class="badge badge-verified">Verified</span>
            <span th:text="'Rating: ' + ${shop.rating} + '/5'">Rating: 5/5</span>
        </div>
    </div>
</section>

<div class="container mb-5">
    <!-- Shop Owner Info -->
    <div class="d-flex align-items-center mb-5 gap-3">
        <img th:src="${shop.imgUrl}" class="rounded-circle" style="width:80px; height:80px; object-fit:cover;" alt="Owner">
        <div>
            <h5 th:text="${shop.name}" class="fw-bold">Owner Name</h5>
            <p class="text-muted mb-0" th:text="${shop.email}">owner@email.com</p>
        </div>
    </div>

    <!-- Animal / Product Grid -->
    <h3 class="fw-bold mb-4">🦜 Animals for Sale</h3>
    <div class="row g-4">
        <div class="col-sm-6 col-lg-4" th:each="product : ${shopProducts}">
            <div class="card h-100 shadow-sm">
                <a th:href="@{/market/detail/{no}(no=${product.productNo})}">
                    <img th:if="${not #lists.isEmpty(product.productImages)}" 
                         th:src="${product.productImages[0].imgUrl}" 
                         class="card-img-top" style="height:220px; object-fit:cover;" alt="Animal">
                    <img th:if="${#lists.isEmpty(product.productImages)}"
                         src="/img/no_image.jpg" class="card-img-top" style="height:220px; object-fit:cover;" alt="No Image">
                </a>
                <div class="card-body p-4">
                    <div class="mb-2 d-flex align-items-center gap-2">
                        <span class="badge bg-warning text-dark px-2 py-1" th:text="${product.productCategory}">Category</span>
                        <span th:if="${product.productCount > 0}" class="badge bg-secondary opacity-75 fw-normal" th:text="'Stock: ' + ${product.productCount}"></span>
                        <span th:if="${product.productCount == 0}" class="badge bg-danger">Sold Out</span>
                    </div>
                    <h5 class="card-title fw-bold mb-2" th:text="${product.productName}">Animal Name</h5>
                    <p class="card-text text-muted small mb-3" style="display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;" th:text="${product.shortDescription}">Description</p>
                    <div class="d-flex justify-content-between align-items-center">
                        <span class="text-muted small">Price</span>
                        <div class="price-badge" th:text="${#numbers.formatInteger(product.price, 0, 'COMMA')} + '원'">₩0</div>
                    </div>
                </div>
            </div>
        </div>
        <div th:if="${#lists.isEmpty(shopProducts)}" class="text-center p-5 col-12">
            <i class="bi bi-x-circle text-muted mb-3" style="font-size:2.5rem;"></i>
            <p class="text-muted">현재 판매 중인 동물이 없습니다. 🐾</p>
        </div>
    </div>
</div>

<div th:replace="~{fragments/fragment :: footer}"></div>
<div th:replace="fragments/fragment :: message"></div>
<script th:replace="fragments/fragment :: message_script"></script>

</body>
</html>
