<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" 
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AnyZoo Marketplace</title>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<!-- Bootstrap 5 CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">

<style>
body {
	font-family: 'Noto Sans KR', sans-serif;
	background: #fdf6ee;
	padding-top: 80px; /* adjust to navbar height */
}

/* Hero */
.hero {
	background: linear-gradient(rgba(230, 180, 150, 0.45),
		rgba(245, 210, 185, 0.55)),
		url("https://images.unsplash.com/photo-1508672019048-805c876b67e2?auto=format&fit=crop&w=1600&q=80");
	background-size: cover;
	background-position: center;
	height: 60vh;
}

.hero-box {
	background: rgba(255, 250, 245, 0.92);
	border-radius: 30px;
}

/* Card */
.card {
	border: none;
	border-radius: 20px;
	position: relative;
}

.card img {
	height: 200px;
	object-fit: cover;
	border-radius: 20px 20px 0 0;
}

.heart {
	position: absolute;
	top: 15px;
	right: 15px;
	font-size: 22px;
	cursor: pointer;
	color: #ccc;
}

.heart.active {
	color: #e76f51;
}

.review-section {
	background:
		url("https://images.unsplash.com/photo-1518717758536-85ae29035b6d?auto=format&fit=crop&w=1600&q=80");
	background-size: cover;
	background-position: center;
}

.review-overlay {
	background: rgba(90, 60, 50, 0.75);
	border-radius: 25px;
}

/* Shop Grid */
.shop-grid {
	display: grid;
	grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
	gap: 20px;
	padding: 20px;
}
.card-body h5 {
	margin-bottom: 0.5rem;
}
.card-body p {
	font-size: 0.9rem;
}
.verified {
	color: green;
	font-weight: bold;
}
</style>
</head>

<body>

<!-- NAVBAR -->
<div th:replace="fragments/fragment :: header"></div>

<!-- HERO -->
<div class="hero d-flex align-items-center justify-content-center">
    <div class="hero-box p-5 text-center">
        <h1>AnyZoo Marketplace</h1>
        <p>Discover verified shops and products for your pets</p>
    </div>
</div>

<!-- SHOP LIST -->
<div class="container mt-5">
    <h2 class="mb-4">Shop List</h2>
    <div class="shop-grid">
        <div class="card" th:each="shop : ${shops}">
            <img th:src="${shop.imgUrlShop}" class="card-img-top" alt="Shop Image">
            <div class="card-body">
                <h5 th:text="${shop.shopName}">Shop Name</h5>
                <p th:text="${shop.shopContent}">Shop Content</p>
                <p>
                    <span th:if="${shop.verified}" class="verified">Verified</span>
                    <span th:unless="${shop.verified}">Not Verified</span>
                </p>
                <p>Rating: <span th:text="${shop.rating}">0</span>/5</p>
                <i class="bi bi-heart heart" onclick="this.classList.toggle('active')"></i>
            </div>
        </div>
    </div>
</div>

<!-- FOOTER -->
<div th:replace="fragments/fragment :: footer"></div>
<div th:replace="fragments/fragment :: message"></div>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>    
<script th:replace="fragments/fragment :: message_script"></script>

<script>
    $( () => {
        function toggleHeart(el) {
            el.classList.toggle("active");
        }
    });
</script>

</body>
</html>
