<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AnyZoo Marketplace - Shop Registration</title>

<!-- Bootstrap JS -->
<script
	src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<!-- Bootstrap 5 CSS -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
	rel="stylesheet">
<!-- Bootstrap CSS & Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<!-- Google Font -->
<link
	href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap"
	rel="stylesheet">

<style>
body {
	font-family: 'Noto Sans KR', sans-serif;
	background: #fdf6ee;
	padding-top: 80px; /* adjust to navbar height */
}

/* Form Box */
.form-section {
	min-height: 70vh;
	display: flex;
	align-items: center;
	justify-content: center;
}

.form-box {
	background: rgba(255, 250, 245, 0.95);
	border-radius: 30px;
	padding: 50px;
	width: 100%;
	max-width: 700px;
	box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
}

.section-title {
	font-weight: 700;
	color: #6b4f4f;
}

/* Image Preview */
.preview-container {
	margin-top: 15px;
	text-align: center;
}

#imagePreview {
	display: none;
	max-width: 100%;
	height: 250px;
	object-fit: cover;
	border-radius: 20px;
	border: 1px solid #ddd;
}
</style>
</head>

<body>

	<!-- NAVBAR -->
	<div th:replace="fragments/fragment :: header"></div>
	
	<div th:replace="fragments/fragment :: message"></div>
	
	<!--  NAVBAR ENDED -->
	<div class="container form-section">
		<div class="form-box">

			<h3 class="text-center section-title mb-4">
				<i class="bi bi-shop"></i> Shop 등록
			</h3>
			 <!-- shop 객체 생성하고 *{} 로 필드에 저장-->
			<form th:action="@{/shop-register}"
				  th:object="${shop}"
				  method="post"
				  enctype="multipart/form-data">

				<!-- Shop ID -->
				<div class="mb-3">
					<label class="form-label">판매자 이름</label>
					<input type="text"
						   class="form-control"
						   th:field="*{shopName}"
						   placeholder="이름을 입력하세요"
						   required>
				</div>

				<!-- Shop Business Number -->
				<div class="mb-3">
					<label class="form-label">사업자 번호</label>
					<input type="text"
						   class="form-control"
						   th:field="*{businessRegNo}"
						   placeholder=""
						   required>
				</div>

				<!-- Shop Content -->
				<div class="mb-3">
					<label class="form-label">Shop 정보</label>
					<textarea class="form-control"
							  th:field="*{shopContent}"
							  rows="4"
							  placeholder=""
							  required></textarea>
				</div>

				<!-- Shop Picture -->
				<div class="mb-3">
					<label class="form-label">이미지 추가</label>
					<input type="file"
						   class="form-control"
						   id="shopPicFile"
						   name="picture"
						   accept="image/*"
						   required>
				</div>

				<!-- Image Preview -->
				<div class="preview-container">
					<img id="imagePreview" alt="Image Preview">
				</div>

				<!-- Submit Button -->
				<div class="d-grid mt-4">
					<button type="submit" class="btn btn-dark btn-lg">
						등록하기
					</button>
				</div>

			</form>

		</div>
	</div>
	
	<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
	<script th:replace="fragments/fragment :: message_script"></script>

	<script>
		$( () => {
	
			function toggleHeart(el) {
				el.classList.toggle("active");
			}
			const numbersOnly = /^[0-9]+$/;
			$("form").on("submit", event => {
				if (!numbersOnly.test($("[name = 'businessRegNo']").val()) ){
					alert("사업자 번호는 숫자만 입력 가능합니다.")
					event.preventDefault();
				}
			})
			
			// Image Preview Logic
			$("#shopPicFile").on("change", function(event) {
				const file = event.target.files[0];
				if (file) {
					const reader = new FileReader();
					reader.onload = function(e) {
						$("#imagePreview")
							.attr("src", e.target.result)
							.show();
					};
					reader.readAsDataURL(file);
				}
			});

		});
	</script>

</body>
</html>
