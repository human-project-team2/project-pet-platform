<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop Owner Dashboard</title>

<!-- Bootstrap CSS & Icons -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">

<style>
body {
	font-family: 'Noto Sans KR', sans-serif;
	background: #fdf6ee;
	padding-top: 80px;
}

.shop-card {
	background: #fff8f2;
	border-radius: 25px;
	padding: 40px;
	margin: 50px auto;
	max-width: 700px;
	box-shadow: 0 5px 20px rgba(0,0,0,0.1);
}

.shop-header h1 {
	font-weight: 700;
	font-size: 32px;
	margin-bottom: 15px;
}

.verified-badge {
	font-size: 16px;
	padding: 8px 20px;
	border-radius: 20px;
	color: #fff;
	font-weight: 500;
}

.verified {
	background-color: #4CAF50;
}

.not-verified {
	background-color: #e76f51;
}

.shop-content {
	font-size: 18px;
	line-height: 1.6;
	margin-bottom: 20px;
}

.btn-edit {
	display: block;
	margin: 20px auto 0 auto;
}
</style>
</head>

<body>

	<!-- NAVBAR -->
	<div th:replace="fragments/fragment :: header"></div>

	<!-- SHOP OWNER CARD -->
	<div class="container">
		<div class="shop-card">
			<div class="shop-header d-flex justify-content-between align-items-center">
				<h1 th:text="${shop.shopName}">Shop Name</h1>
				<span th:text="${shop.verified} ? '승인된 판매자' : '등록 승인 대기중'"
					  th:classappend="${shop.verified} ? ' verified-badge verified' : ' verified-badge not-verified'">
					Verified
				</span>
			</div>

			<!-- Current Shop Image -->
			<div class="mb-3 text-center">
				<img th:if="${shop.imgUrlShop != null}" th:src="@{${shop.imgUrlShop}}" 
				     alt="Shop Image" class="img-fluid rounded" style="max-height:300px;">
				<p th:if="${shop.imgUrlShop == null}">No image uploaded</p>
			</div>

			<!-- Shop Content Display -->
			<div class="shop-content" th:text="${shop.shopContent}">Shop description goes here.</div>
			<p><strong>Business Registration Number:</strong> <span th:text="${shop.businessRegNo}">123-45-6789</span></p>

			<!-- Edit Button -->
			<a th:href="@{/shop/editshop}" class="btn btn-primary btn-edit">판매자 정보 수정</a>
		</div>
	</div>

	<!-- FOOTER -->
	<div th:replace="fragments/fragment :: footer"></div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
