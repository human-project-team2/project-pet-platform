<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Edit Shop Information</title>

<!-- Bootstrap CSS & Icons -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">

<style>
body {
	font-family: 'Noto Sans KR', sans-serif;
	background: #fdf6ee;
	padding-top: 80px;
}

.edit-card {
	background: #fff8f2;
	border-radius: 25px;
	padding: 40px;
	margin: 50px auto;
	max-width: 700px;
	box-shadow: 0 5px 20px rgba(0,0,0,0.1);
}

.edit-card h1 {
	font-weight: 700;
	font-size: 32px;
	margin-bottom: 25px;
	text-align: center;
}

.form-label {
	font-weight: 500;
}

.btn-submit {
	display: block;
	margin: 30px auto 0 auto;
	padding: 10px 40px;
	font-size: 18px;
}
</style>
</head>

<body>

	<!-- NAVBAR -->
	<div th:replace="fragments/fragment :: header"></div>

	<!-- EDIT SHOP FORM -->
	<div class="container">
		<div class="edit-card">
			<h1>판매자 정보 수정</h1>
			
			<form th:action="@{/shop/editshop}" th:object="${shop}" method="post" enctype="multipart/form-data">
				
				<!-- Shop Name -->
				<div class="mb-3">
					<label for="shopName" class="form-label">상점 이름</label>
					<input type="text" class="form-control" id="shopName" th:field="*{shopName}" placeholder="상점 이름을 입력하세요" required>
				</div>

				<!-- Shop Description -->
				<div class="mb-3">
					<label for="shopContent" class="form-label">상점 소개</label>
					<textarea class="form-control" id="shopContent" th:field="*{shopContent}" rows="5" placeholder="상점 소개를 입력하세요" required></textarea>
				</div>

				<!-- Shop Image -->
				<div class="mb-3">
					<label for="imgUrlShop" class="form-label">상점 이미지 업로드</label>
					<input class="form-control" type="file" id="imgUrlShop" name="picture" accept="image/*">
					<div class="mt-2" th:if="${shop.imgUrlShop != null}">
						<img th:src="@{${shop.imgUrlShop}}" alt="Current Shop Image" class="img-fluid rounded" style="max-height:200px;">
						<p class="text-muted">현재 이미지</p>
					</div>
					<input type="hidden"
					       name="existingOriginalFileName"
					       th:value="${shop.originalFileName}">
					
					<input type="hidden"
					       name="existingSavedFileName"
					       th:value="${shop.savedFileName}">
					
					<input type="hidden"
					       name="existingImgUrlShop"
					       th:value="${shop.imgUrlShop}">
				</div>

				<!-- Business Registration Number -->
				<div class="mb-3">
					<label for="businessRegNo" class="form-label">사업자 등록번호</label>
					<input type="text" class="form-control" id="businessRegNo" th:field="*{businessRegNo}" placeholder="123-45-6789" readonly>
				</div>

				<!-- Submit Button -->
				<button type="submit" class="btn btn-success btn-submit">정보 수정 완료</button>
			</form>
		</div>
	</div>

	<!-- FOOTER -->
	<div th:replace="fragments/fragment :: footer"></div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
$( () => {
	//Image Preview Logic
	$("#imgUrlShop").on("change", function(event) {
		const file = event.target.files[0];
		if (file) {
			const reader = new FileReader();
			reader.onload = function(e) {
				$("#imagePreview")
					.attr("src", e.target.result)
					.show();
			};
			reader.readAsDataURL(file);
		}
	});	
})

</script>
</body>
</html>
