<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AnyZoo Marketplace | 리뷰 수정</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" th:href="@{/css/floating-chat.css}">
<style>
    body { font-family: 'Noto Sans KR', sans-serif; background: #fdf6ee; color: #5a3c32; }
    .edit-header {
        background: linear-gradient(rgba(90, 60, 50, 0.7), rgba(90, 60, 50, 0.7)),
                    url("https://images.unsplash.com/photo-1518717758536-85ae29035b6d?auto=format&fit=crop&w=1600&q=80");
        background-size: cover; background-position: center;
        padding: 80px 0; color: white; text-align: center; margin-bottom: -50px;
    }
    .edit-card {
        background: rgba(255, 250, 245, 0.95);
        border: none; border-radius: 30px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.05); padding: 40px;
    }
    .form-label { font-weight: 700; margin-bottom: 10px; }
    .form-control { border-radius: 15px; border: 1px solid #e0d0c0; padding: 12px 20px; }
    .form-control:focus { border-color: #e76f51; box-shadow: 0 0 0 0.25px rgba(231, 111, 81, 0.25); }

    /* 별점 스타일 */
    .star-rating { display: flex; flex-direction: row-reverse; justify-content: flex-end; }
    .star-rating input { display: none; }
    .star-rating label { font-size: 2rem; color: #ccc; cursor: pointer; transition: color 0.2s; }
    .star-rating input:checked ~ label,
    .star-rating label:hover,
    .star-rating label:hover ~ label { color: #f4a261; }

    /* 버튼 스타일 */
    .btn-submit { background-color: #e76f51; color: white; border-radius: 30px; padding: 12px 40px; font-weight: 700; border: none; transition: 0.3s; }
    .btn-submit:hover { background-color: #d65d40; color: white; transform: translateY(-2px); }
    .btn-cancel { background-color: #f0e0d0; color: #5a3c32; border-radius: 30px; padding: 12px 40px; font-weight: 700; border: none; text-decoration: none; }
</style>
</head>

<body>
    <div th:replace="fragments/fragment :: header"></div>

    <header class="edit-header">
        <div class="container">
            <h1 class="fw-bold display-5">리뷰 수정하기</h1>
            <p class="lead">더 들려주고 싶은 이야기가 생기셨나요?</p>
        </div>
    </header>

    <div class="container mb-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card edit-card">
                    <form th:action="@{/review/edit}" method="post" enctype="multipart/form-data">
                        
                        <input type="hidden" name="reviewNo" th:value="${review.reviewNo}">
                        <input type="hidden" name="id" th:value="${review.id}">

                        <div class="mb-4">
                            <label class="form-label d-block">만족도를 다시 선택하시겠나요?</label>
                            <div class="star-rating">
                                <input type="radio" id="5-stars" name="rating" value="5" th:checked="${review.rating == 5}" required />
                                <label for="5-stars" class="bi bi-star-fill"></label>
                                <input type="radio" id="4-stars" name="rating" value="4" th:checked="${review.rating == 4}" />
                                <label for="4-stars" class="bi bi-star-fill"></label>
                                <input type="radio" id="3-stars" name="rating" value="3" th:checked="${review.rating == 3}" />
                                <label for="3-stars" class="bi bi-star-fill"></label>
                                <input type="radio" id="2-stars" name="rating" value="2" th:checked="${review.rating == 2}" />
                                <label for="2-stars" class="bi bi-star-fill"></label>
                                <input type="radio" id="1-star" name="rating" value="1" th:checked="${review.rating == 1}" />
                                <label for="1-star" class="bi bi-star-fill"></label>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="productName" class="form-label">상품명</label>
                            <input type="text" class="form-control bg-light" id="productName" name="productName" 
                                   th:value="${review.productName}" readonly>
                        </div>

                        <div class="mb-4">
                            <label for="content" class="form-label">마켓 후기 수정</label>
                            <textarea class="form-control" id="content" name="content" rows="6" 
                                      placeholder="수정할 내용을 입력해주세요." required th:text="${review.content}"></textarea>
                        </div>

                        <div class="mb-4" th:if="${review.imgUrl != null}">
                            <label class="form-label d-block">기존 사진</label>
                            <img th:src="${review.imgUrl}" class="rounded mb-2" style="max-height: 150px; display: block;">
                            <div class="form-text text-danger">새 파일을 선택하면 기존 사진이 교체됩니다.</div>
                        </div>

                        <div class="mb-4">
                            <label for="image" class="form-label">사진 변경 (선택)</label>
                            <input type="file" class="form-control" id="image" name="image" accept="image/*">
                        </div>

                        <div class="d-flex justify-content-center gap-3 mt-5">
                            <a th:href="@{/review/list}" class="btn btn-cancel">취소</a>
                            <button type="submit" class="btn btn-submit shadow-sm">수정 완료하기</button>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="fragments/fragment :: footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
