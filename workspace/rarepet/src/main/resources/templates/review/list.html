<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AnyZoo Marketplace | Reviews</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" th:href="@{/css/floating-chat.css}">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background: #fdf6ee; }
        .review-header {
            background: linear-gradient(rgba(90, 60, 50, 0.6), rgba(90, 60, 50, 0.6)),
                        url("https://images.unsplash.com/photo-1518717758536-85ae29035b6d?auto=format&fit=crop&w=1600&q=80");
            background-size: cover; background-position: center;
            color: white; padding: 100px 0 60px; text-align: center;
        }
        
        .review-card { border: none; border-radius: 20px; transition: transform 0.3s; height: 100%; }
        .review-card:hover { transform: translateY(-5px); }
       
        .review-card .card-body { padding: 30px !important; }
        
        .review-text-area {
            white-space: pre-wrap;    
            word-break: break-all;     
            font-size: 15px;
            line-height: 1.7;
            color: #444;
            margin-bottom: 20px;
            height: 80px;            
            overflow-y: auto;         
            padding-right: 10px;      
        }
        
        .review-text-area::-webkit-scrollbar { width: 6px; }
        .review-text-area::-webkit-scrollbar-thumb { background-color: #e76f51; border-radius: 10px; }
        .review-text-area::-webkit-scrollbar-track { background-color: #f1f1f1; border-radius: 10px; }
        
        .btn-write { background-color: #e76f51; color: white; border-radius: 10px; padding: 10px 25px; border: none; }
        .btn-write:hover { background-color: #d65d41; color: white; }

        .btn-action { font-size: 13px; padding: 5px 12px; border-radius: 8px; border: none; transition: 0.2s; }
        .btn-edit { background-color: #f8f9fa; color: #666; border: 1px solid #ddd; }
        .btn-edit:hover { background-color: #e9ecef; color: #333; }
        .btn-delete { background-color: #fff1f0; color: #d9363e; border: 1px solid #ffa39e; }
        .btn-delete:hover { background-color: #ffccc7; color: #cf1322; }
    </style>
</head>

<body>
    <div th:replace="~{fragments/fragment :: header}"></div>

    <header class="review-header">
        <div class="container">
            <h1 class="fw-bold display-5">내가 쓴 리뷰</h1>
            <p class="lead">내가 작성한 리뷰 목록입니다.</p>
        </div>
    </header>

    <div class="container" style="margin-top: -30px; margin-bottom: 80px;">
        <div class="row mb-4">
            <div class="col-12 d-flex justify-content-between align-items-center bg-white p-3 shadow-sm" style="border-radius: 15px;">
                <span class="fw-bold text-muted" 
				      th:if="${list != null}" 
				      th:with="myReviews=${list.?[id == #authentication.name]}" 
				      th:text="|내가 작성한 ${myReviews.size()}개의 소중한 리뷰가 있습니다.|">
				    총 0개
				</span>                
            </div>
        </div>

        <div class="row g-4">
            <div class="col-md-4" th:each="review : ${list}" th:if="${#authentication.name == review.id}">
                <div class="card review-card shadow-sm">
                    <div class="card-body d-flex flex-column">
                        <div class="star-rating mb-2" style="color: #ffb703;">
                            <i class="bi" th:each="i : ${#numbers.sequence(1, 5)}" 
                               th:classappend="${i <= review.rating} ? 'bi-star-fill' : 'bi-star'"></i>
                        </div>

                        <h5 class="card-title fw-bold" style="color: #5a3c32;" th:text="${review.productName ?: '알 수 없는 상품'}">상품명</h5>
                        
                        <div class="review-text-area" th:text="${review.content}">내용이 들어갑니다.</div>

                        <div class="mt-auto"> 
                            <hr class="my-3" style="color: #eee;">
                            <div class="d-flex justify-content-between align-items-end">
                                <div>
                                    <span class="fw-bold" style="font-size: 14px;" th:text="${review.id} + ' 님'">작성자</span>
                                    <br>
                                    <small class="text-muted" th:text="${review.createdAt != null ? #temporals.format(review.createdAt, 'yyyy-MM-dd') : '날짜 없음'}">날짜</small>
                                </div>
                                
                                <div class="d-flex gap-2" th:if="${#authentication.name == review.id}">
								    <a th:href="@{/review/edit/{no}(no=${review.reviewNo})}" class="btn btn-action btn-edit">
								        <i class="bi bi-pencil-square"></i> 수정
								    </a>
								    <button type="button" class="btn btn-action btn-delete" 
								            th:onclick="|deleteReview('${review.reviewNo}')|">
								        <i class="bi bi-trash"></i> 삭제
								    </button>
								</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-12 text-center py-5" th:if="${#lists.isEmpty(list)}">
                <p class="text-muted">아직 등록된 리뷰가 없습니다. 첫 번째 리뷰를 남겨보세요!</p>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/fragment :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:inline="javascript">
        function deleteReview(reviewNo) {
            if (confirm("정말로 이 리뷰를 삭제하시겠습니까?")) {
                location.href = "/review/delete/" + reviewNo;
            }
        }
    </script>
</body>
</html>
