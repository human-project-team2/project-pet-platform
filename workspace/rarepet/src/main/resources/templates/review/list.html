<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>AnyZoo Marketplace</title>



<!-- Bootstrap 5 CSS -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
	rel="stylesheet">
	
<!-- Bootstrap Icons -->
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<!-- Google Font -->
<link
	href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap"
	rel="stylesheet">

<style>
body {
	font-family: 'Noto Sans KR', sans-serif;
	background: #fdf6ee;
}

/* Hero */
.hero {
	background: linear-gradient(rgba(230, 180, 150, 0.45),
		rgba(245, 210, 185, 0.55)),
		url("https://images.unsplash.com/photo-1508672019048-805c876b67e2?auto=format&fit=crop&w=1600&q=80");
	background-size: cover;
	background-position: center;
	height: 60vh;
}

.hero-box {
	background: rgba(255, 250, 245, 0.92);
	border-radius: 30px;
}

/* Card */
.card {
	border: none;
	border-radius: 20px;
}

.card img {
	height: 200px;
	object-fit: cover;
	border-radius: 20px 20px 0 0;
}

.heart {
	position: absolute;
	top: 15px;
	right: 15px;
	font-size: 22px;
	cursor: pointer;
	color: #ccc;
}

.heart.active {
	color: #e76f51;
}

.review-section {
	background:
		url("https://images.unsplash.com/photo-1518717758536-85ae29035b6d?auto=format&fit=crop&w=1600&q=80");
	background-size: cover;
	background-position: center;
}

.review-overlay {
	background: rgba(90, 60, 50, 0.75);
	border-radius: 25px;
}
</style>
</head>

<body>

	<!-- NAVBAR -->
	<div th:replace="fragments/fragment :: header"></div>
	<!-- --------------------- -->
	<header class="review-header">
        <div class="container">
            <h1 class="fw-bold display-5">고객 리뷰</h1>
            <p class="lead">AnyZoo와 함께한 소중한 경험을 공유해주세요.</p>
        </div>
    </header>

    <div class="container" style="margin-top: -40px; margin-bottom: 80px;">
        <div class="row g-4">
            
            <div class="col-12 d-flex justify-content-between align-items-center mb-2">
                <span class="text-muted"></span>
                <a href="/review/write" class="btn btn-write shadow-sm">리뷰 쓰기</a>
            </div>

            <div class="col-md-4">
                <div class="card review-card shadow-sm h-100">
                    <!-- <img src="https://images.unsplash.com/photo-1544568100-847a948585b9?auto=format&fit=crop&w=500&q=60" class="card-img-top review-img" alt="리뷰 이미지"> -->
                    <div class="card-body p-4">
                        <div class="star-rating mb-2">
                            <i class="bi bi-star-fill"></i><i class="bi bi-star-fill"></i><i class="bi bi-star-fill"></i><i class="bi bi-star-fill"></i><i class="bi bi-star-fill"></i>
                        </div>
                        <h5 class="card-title fw-bold" style="color: #5a3c32;"></h5>
                        <p class="card-text text-muted"  id=content style="font-size: 14px; line-height: 1.6;">
                        </p>
                        <hr class="my-3" style="color: #eee;">
                        <div class="author-info">
                            
                            <div>
                                <div class="fw-bold" style="font-size: 14px; color: #333;" id=id ></div>
                                <div th:text="${review.write}" class="text-muted" style="font-size: 12px;" id=createdAt></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card review-card shadow-sm h-100">
                    <img src="https://images.unsplash.com/photo-1516733725897-1aa73b87c8e8?auto=format&fit=crop&w=500&q=60" class="card-img-top review-img" alt="리뷰 이미지">
                    <div class="card-body p-4">
                        <div class="star-rating mb-2">
                            <i class="bi bi-star-fill"></i><i class="bi bi-star-fill"></i><i class="bi bi-star-fill"></i><i class="bi bi-star-fill"></i><i class="bi bi-star-half"></i>
                        </div>
                        <h5 class="card-title fw-bold" style="color: #5a3c32;">친절한 서비스에 감동했습니다.</h5>
                        <p class="card-text text-muted" style="font-size: 14px; line-height: 1.6;">
                            궁금한 점이 많아 질문을 많이 드렸는데도 하나하나 친절하게 설명해주셔서 너무 감사했습니다. 굿즈들도 너무 귀여워요!
                        </p>
                        <hr class="my-3" style="color: #eee;">
                        <div class="author-info">
                            
                            <div>
                                <div class="fw-bold" style="font-size: 14px; color: #333;">이캣 님</div>
                                <div class="text-muted" style="font-size: 12px;">2024.05.18</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card review-card shadow-sm h-100">
                    <img src="https://images.unsplash.com/photo-1583337130417-3346a1be7dee?auto=format&fit=crop&w=500&q=60" class="card-img-top review-img" alt="리뷰 이미지">
                    <div class="card-body p-4">
                        <div class="star-rating mb-2">
                            <i class="bi bi-star-fill"></i><i class="bi bi-star-fill"></i><i class="bi bi-star-fill"></i><i class="bi bi-star-fill"></i><i class="bi bi-star"></i>
                        </div>
                        <h5 class="card-title fw-bold" style="color: #5a3c32;">주말엔 사람이 좀 많지만 좋음</h5>
                        <p class="card-text text-muted" style="font-size: 14px; line-height: 1.6;">
                            인기가 많아서 그런지 사람이 꽤 많았어요. 그래도 관리하시는 분들이 동선을 잘 짜주셔서 편하게 구경했습니다. 힐링하고 가요.
                        </p>
                        <hr class="my-3" style="color: #eee;">
                        <div class="author-info">
                            <div>
                                <div class="fw-bold" style="font-size: 14px; color: #333;">박집사 님</div>
                                <div class="text-muted" style="font-size: 12px;">2024.05.15</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <div th:replace="fragments/fragment :: footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
	
	
	
	
</body>
</html>
